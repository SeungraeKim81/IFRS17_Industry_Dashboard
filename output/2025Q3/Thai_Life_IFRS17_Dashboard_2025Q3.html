<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thai life insurance industry — IFRS 17 dashboard</title>
<meta name="description" content="TFRS 17 (IFRS 17) figures and indicators for 19 Thai life insurers, 2025Q3, highlighting Samsung Life.">
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  /* light only: the dark theme was removed in v1.14 (owner decision) */
  color-scheme:light;
  /* SLI palette (company template): brand-blue #0345e4, brand-blue-deep #0033cc, navy #0b3267,
     chart accents #2939e8 #00beed #fab019 #b01e34, surface-tint #e6edfc */
  --plane:#ffffff; --surface:#ffffff; --ink:#151a24; --ink-2:#4f5663; --muted:#6f7784;
  --grid:#e3e8f2; --axis:#c5cedd; --hair:rgba(11,50,103,.12);
  --peer:#7a93c2; --focus:#0345e4; --focus-soft:rgba(3,69,228,.09);
  --c1:#2939e8; --c2:#00beed; --c3:#fab019; --c4:#b01e34;
  --pos:#2939e8; --neg:#b01e34; --total:#8a93a6;
  --good:#1e7a46; --bad:#b01e34; --neutral-mid:#eef2f8;
  --title:#0b3267; --mast:#0033cc; --mast-ink:#ffffff; --mast-ink-2:#d6e2ff; --mast-muted:#b8ccff;
  --band:#e6edfc; --band-ink:#0b3267;
  /* card colours (v1.14): better / worse than the comparative period; worse is a deep yellow, not red (owner decision) */
  --good-bg:#eef8f1; --warn:#d99a00; --warn-bg:#fff6dc; --warn-ink:#8f5c00;
}
*{box-sizing:border-box}
/* one line length for all running text, about the width of the charts. In rem, not ch: ch is the width
   of the digit 0, about half a Korean character, so ch-based widths wrapped Korean text early. */
:root{--measure:60rem}
html,body{margin:0}
body{background:var(--plane);color:var(--ink);font:400 15px/1.55 "Neue Haas Grotesk Text Pro",system-ui,-apple-system,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Thonburi","Leelawadee UI","Noto Sans Thai",sans-serif;
  -webkit-font-smoothing:antialiased;padding:0 0 64px}
.wrap{max-width:1212px;margin:0 auto;padding:0 16px}
.top{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-start;justify-content:space-between}
.top-text{flex:1 1 560px;min-width:0}
h1{font-weight:700;font-size:28px;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em;text-wrap:balance}
.lede{color:var(--ink-2);max-width:var(--measure);margin:0}
.units{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:10px}
nav.periods{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-top:8px;font-size:13px}
nav.periods .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
nav.periods a{color:var(--ink-2)}
nav.periods a[aria-current="page"]{color:var(--ink);font-weight:650;text-decoration:none}
.controls{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.lang-pick{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.lang-pick .seg button{text-transform:none;letter-spacing:0}
:lang(ko) body{word-break:keep-all;overflow-wrap:anywhere}
:lang(ko) .brand-label,:lang(ko) .units,:lang(ko) nav.periods .lab,:lang(ko) .lang-pick,:lang(ko) .focus-pick,:lang(ko) .panel h3,:lang(ko) table.data th{letter-spacing:0}
/* Thai: taller line for stacked vowel and tone marks; no capitals, so no tracking on the small caps labels */
:lang(th) body{line-height:1.7}
:lang(th) .brand-label,:lang(th) .units,:lang(th) nav.periods .lab,:lang(th) .lang-pick,:lang(th) .focus-pick,:lang(th) .panel h3,:lang(th) table.data th{letter-spacing:0}
@media(max-width:620px){.controls{align-items:stretch;width:100%}.lang-pick{justify-content:space-between}}
.focus-pick{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.focus-pick select{font:inherit;font-size:15px;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--surface);
  border:1px solid var(--axis);border-radius:6px;padding:7px 10px;min-width:220px}
nav.toc{display:flex;flex-wrap:wrap;gap:6px 18px;margin:22px 0 0;padding:10px 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);font-size:13px}
nav.toc a{color:var(--ink-2);text-decoration:none}
nav.toc a:hover{color:var(--ink);text-decoration:underline}
/* masthead: the blue band of the company's cover slide (no logo, owner decision); two translucent rings as on its break slide */
.mast{background:var(--mast);color:var(--mast-ink);position:relative;overflow:hidden;padding:28px 0 84px;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.mast .wrap{position:relative}
.mast .ring{position:absolute;border-radius:50%;border:44px solid rgba(255,255,255,.12);pointer-events:none}
.mast .r1{width:420px;height:420px;right:-140px;top:-170px}
.mast .r2{width:240px;height:240px;right:24%;bottom:-170px}
.brand-label{margin:0 0 10px;font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mast-ink)}
.mast h1{color:var(--mast-ink)}
.mast .lede{color:var(--mast-ink-2)}
.mast .units,.mast nav.periods .lab,.mast .lang-pick,.mast .focus-pick{color:var(--mast-muted)}
.mast nav.periods a{color:var(--mast-ink-2)}
.mast nav.periods a[aria-current="page"]{color:var(--mast-ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.mast .seg{border-color:rgba(255,255,255,.45)}
.mast .seg button{background:transparent;color:var(--mast-ink-2)}
.mast .seg button+button{border-left-color:rgba(255,255,255,.3)}
.mast .seg button[aria-pressed="true"]{background:#ffffff;color:var(--mast)}
.mast .focus-pick select{background:#ffffff;color:#0b3267;border-color:transparent}
.mast nav.toc{border-color:rgba(255,255,255,.22)}
.mast nav.toc a{color:var(--mast-ink-2)}
.mast nav.toc a:hover{color:var(--mast-ink)}
.mast .focus-head{margin:22px 0 0}
.mast .focus-name{color:var(--mast-ink)}
.mast .chip{background:rgba(255,255,255,.14);border-color:transparent;color:var(--mast-ink)}
#s-focus{margin-top:-56px;position:relative}
@media(max-width:620px){.mast{padding:20px 0 76px}.mast .r2{display:none}}
section{margin-top:44px;scroll-margin-top:12px}
h2{font-weight:700;font-size:20px;margin:0;letter-spacing:-.005em;color:var(--title);display:inline-block;padding-bottom:5px;border-bottom:2px solid var(--focus)}
.sec-note{color:var(--ink-2);font-size:14px;max-width:var(--measure);margin:6px 0 16px}
.panel{background:var(--surface);border:1px solid var(--hair);border-radius:6px;padding:16px}
.panel h3{margin:0;font-size:15px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink)}
.panel .sub{font-size:12px;color:var(--muted);margin:3px 0 10px}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:860px){.panels{grid-template-columns:1fr}}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:"Neue Haas Grotesk Text Pro",system-ui,-apple-system,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Thonburi","Leelawadee UI","Noto Sans Thai",sans-serif}
.num{font-variant-numeric:tabular-nums}
.legend{display:flex;gap:8px 18px;align-items:center;flex-wrap:wrap;margin:12px 0 0;font-size:13px;color:var(--ink-2)}
.key{display:inline-flex;align-items:center;gap:7px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.sq{width:12px;height:10px;border-radius:2px;display:inline-block}
/* focus summary */
.focus-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:12px}
.focus-name{font-size:22px;font-weight:650}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--hair);color:var(--ink-2);background:var(--surface)}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:1000px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.tiles{grid-template-columns:repeat(2,1fr)}}
/* phones: two compact cards per row; every line stays, in smaller type (owner decision) */
@media(max-width:480px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .tile{padding:9px 10px 9px}
  .tile .lab{font-size:13px;line-height:1.3}
  .tile .val{font-size:20px;margin-top:3px}
  .tile .delta{font-size:11.5px;line-height:1.35}
  .tile .chg{font-size:15px}
  .tile .vs{font-size:10.5px}
  .tile .ctx{font-size:11px;line-height:1.35;margin-top:3px}
}
.tile{background:var(--surface);border:1px solid var(--hair);border-radius:6px;padding:13px 14px 12px;border-top:4px solid var(--title)}
.tile .lab{font-size:15px;font-weight:700;line-height:1.3;color:var(--ink)}
.tile .val{font-size:26px;font-weight:700;line-height:1.25;margin-top:2px;color:var(--title);font-variant-numeric:tabular-nums}
.tile .delta{font-size:13px;margin-top:3px;line-height:1.25}
.tile .ctx{font-size:12px;color:var(--muted);margin-top:6px}
/* change on the comparative period (v1.14, owner decision): large and coloured; the period label small */
.tile .chg{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .chg.good{color:var(--good)} .tile .chg.bad{color:var(--warn-ink)} .tile .chg.flat{color:var(--ink-2)}
.tile .vs{font-size:11px;color:var(--muted);white-space:nowrap}
.tile.good{background:var(--good-bg);border-top-color:var(--good)}
.tile.bad{background:var(--warn-bg);border-top-color:var(--warn)}
.tiles-note{margin:10px 0 0;display:flex;flex-wrap:wrap;gap:4px 18px}
.tiles-note .sw{display:inline-block;width:14px;height:10px;border:1px solid var(--hair);border-top-width:3px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.callouts{margin-top:14px;display:grid;gap:8px}
.callout{font-size:13.5px;color:var(--ink-2);border-left:3px solid var(--axis);padding:4px 0 4px 12px}
.callout b{color:var(--ink)}
/* bar table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--hair);border-radius:8px;background:var(--surface)}
table.data{border-collapse:collapse;width:100%;font-size:13px}
table.data th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:550;text-align:right;
  padding:10px 8px;border-bottom:1px solid var(--axis);white-space:nowrap;vertical-align:bottom}
table.data th.l,table.data td.l{text-align:left}
/* headers centred in every table (owner decision); the cells keep their own alignment */
table.data th,table.data th.l{text-align:center}
table.data td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap;font-variant-numeric:tabular-nums}
table.data tr:last-child td{border-bottom:0}
table.data tr.focus td{background:var(--focus-soft)}
/* definitions on narrow screens (owner decision): one block per indicator - area, name, then the definition
   below it - so the definition is never pushed off screen */
@media(max-width:620px){
  table#defs thead{display:none}
  table#defs,table#defs tbody,table#defs tr,table#defs td{display:block;width:auto}
  table#defs tr{padding:9px 12px;border-bottom:1px solid var(--grid)}
  table#defs tr:last-child{border-bottom:0}
  table#defs td{border:0;padding:0;white-space:normal!important;text-align:left}
  table#defs td:nth-child(1){font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  table#defs td:nth-child(2){font-weight:600;color:var(--ink);margin:2px 0 3px}
  table#defs td:nth-child(3){color:var(--ink-2);line-height:1.45}
}
table.data tr.focus td.l{font-weight:600}
table.data tr.tier-break td{border-top:2px solid var(--axis)}
table#all th{white-space:normal;line-height:1.3}
table.data th.sortable{cursor:pointer;user-select:none}
table.data th.sortable:hover{color:var(--ink)}
table.data th .arr{display:inline-block;width:10px;color:var(--ink-2)}
/* market position (v1.14, owner decision): five measures in two groups, future profit (CSM) and profit for the
   period; a thin rule between measures and a heavier one between the groups. Bars start at a zero line, so a negative
   value runs left of it in red. */
table#mkt{table-layout:fixed}
table#mkt col.cn{width:34px} table#mkt col.co{width:150px} table#mkt col.cv{width:64px} table#mkt col.cs{width:52px}
table#mkt tr.grp th{text-align:left;font-size:12px;letter-spacing:0;text-transform:none;color:var(--title);font-weight:700;padding:10px 10px 5px;border-bottom:2px solid var(--title)}
table#mkt tr.grp th.blank{border-bottom:0}
table#mkt tr.ms th{white-space:normal;line-height:1.25}
table#mkt th.ml{text-align:left;padding-left:10px}
table#mkt th.shh{text-align:right;padding-left:0;font-weight:400}
table#mkt .msep{border-left:1px solid var(--hair)}
table#mkt .gsep{border-left:2px solid var(--axis)}
table#mkt td.bar{padding-left:10px}
table#mkt td.nm{overflow:hidden;text-overflow:ellipsis}
table#mkt td.s,table#mktM td.s{color:var(--muted);font-size:12px}
table#mkt td.s{background:rgba(11,50,103,.025)}
#s-market td.neg{color:var(--bad)}
#s-market .track{position:relative;height:10px}
#s-market .fill{position:absolute;top:0;bottom:0;border-radius:2px;background:var(--peer);opacity:.75}
#s-market .fill.neg{background:var(--bad);opacity:.45}
#s-market tr.focus .fill{background:var(--focus);opacity:1}
#s-market tr.focus .fill.neg{background:var(--bad);opacity:.8}
#s-market .zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--axis)}
/* up to 1060px, where the five measures would leave the bars too short: one measure at a time, picked with
   the switch (owner decision); wider screens show all five */
.mkt-m{display:none}
@media(max-width:1060px){#s-market .mkt-full{display:none}#s-market .mkt-m{display:block}}
#mktSeg{display:flex;width:100%;margin:0 0 8px}
#mktSeg button{flex:1;padding:7px 4px;line-height:1.25}
#mktSeg button[aria-pressed="true"]{background:var(--focus);color:#ffffff;font-weight:600}
table#mktM td{padding:6px 6px}
table#mktM th{white-space:normal;padding:8px 6px;line-height:1.25}
table#mktM td.nm{white-space:normal;line-height:1.3;overflow-wrap:anywhere}
table#mktM td.br{width:22%}
table#mktM .track{height:9px;background:var(--grid);border-radius:2px}
.flag{display:inline-block;font-size:10.5px;padding:0 5px;border-radius:3px;border:1px solid var(--hair);color:var(--ink-2);margin-left:6px;font-weight:400}
.tbl-tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px;font-size:13px;color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--axis);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:var(--surface);color:var(--ink-2);padding:5px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--axis)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
button.dl{font:inherit;font-size:13px;border:1px solid var(--axis);background:var(--surface);color:var(--ink);border-radius:6px;padding:5px 12px;cursor:pointer}
.ok{color:var(--good)} .fail{color:var(--bad);font-weight:700}
.notes{font-size:13.5px;color:var(--ink-2);max-width:var(--measure)}
.notes h4{color:var(--ink);font-size:14px;margin:18px 0 4px}
.notes p{margin:0 0 8px}
details:not(.sec-fold){border-top:1px solid var(--grid);padding:6px 0}
details:not(.sec-fold) summary{cursor:pointer;color:var(--ink);font-size:13.5px}
details:not(.sec-fold) p{margin:6px 0 4px;font-size:13px;color:var(--ink-2)}
/* a section that opens on request: its heading is the summary */
.sec-fold>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:8px}
.sec-fold>summary::-webkit-details-marker{display:none}
.sec-fold>summary::before{content:"\25B8";color:var(--muted);font-size:16px;display:inline-block;transition:transform .15s}
.sec-fold[open]>summary::before{transform:rotate(90deg)}
.sec-fold>summary:hover h2{text-decoration:underline;text-decoration-color:var(--axis)}
ul.flags{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2)}
footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--hair);font-size:12px;color:var(--muted)}
.tip{position:fixed;pointer-events:none;z-index:9;background:var(--surface);color:var(--ink);border:1px solid var(--hair);border-radius:6px;
  padding:9px 11px;font-size:12.5px;box-shadow:0 6px 22px rgba(0,0,0,.16);opacity:0;transition:opacity .1s;max-width:290px}
.tip b{font-size:13.5px;display:block;margin-bottom:5px}
.tip table{border-collapse:collapse;width:100%}
.tip td{padding:1px 0;font-size:12px;white-space:nowrap}
.tip td:last-child{text-align:right;padding-left:16px;font-variant-numeric:tabular-nums}
/* a null row in tipTable starts a new group of rows, set off by a hairline */
.tip tr.gs td{border-top:1px solid var(--hair);padding-top:4px}
.tip tr.gs+tr td,.tip tr:first-child td{padding-top:1px}
.tip .neg{color:var(--bad)}
/* new-business strip tooltip: one row per insurer at the spot, with the measure's numerator and denominator */
.tip:has(table.tipgrid){max-width:min(460px,calc(100vw - 16px))}
.tip table.tipgrid th{font-size:11px;font-weight:600;color:var(--muted);text-align:right;padding:0 0 3px 12px;white-space:nowrap}
.tip table.tipgrid td{text-align:right;padding:1px 0 1px 12px;font-variant-numeric:tabular-nums}
.tip table.tipgrid .l{text-align:left;padding-left:0;white-space:normal}
.tip table.tipgrid tr.f td{font-weight:650;color:var(--focus)}
.tip .tipnote{font-size:11px;color:var(--muted);margin-top:5px}
@media print{body{padding:0}.controls,nav.toc,.tbl-tools button{display:none}.tile,.panel{break-inside:avoid}}
</style>
</head>
<body>
<header class="mast"><i class="ring r1"></i><i class="ring r2"></i><div class="wrap">
<p class="brand-label" data-t="brandLabel"></p>
<div class="top">
  <div class="top-text">
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <div class="units" id="units"></div>
    <nav class="periods" id="periods"></nav>
  </div>
  <div class="controls">
    <div class="lang-pick"><span data-t="langLabel"></span>
      <div class="seg" role="group" id="langSeg"></div>
    </div>
    <label class="focus-pick"><span data-t="focusPick"></span>
      <select id="focusSel"></select>
    </label>
  </div>
</div>
<nav class="toc" id="toc"></nav>
<div class="focus-head"><span class="focus-name" id="fName"></span><span id="fChips"></span></div>
</div></header>
<div class="wrap">

<section id="s-focus">
  <div class="tiles" id="tiles"></div>
  <p class="sec-note tiles-note" id="tilesNote"></p>
  <div class="callouts" id="callouts"></div>
</section>

<section id="s-market">
  <h2 data-t="h2market"></h2>
  <p class="sec-note" data-t="noteMarket"></p>
  <div class="tbl-wrap mkt-full"><table class="data" id="mkt"></table></div>
  <div class="mkt-m"><div class="seg" role="group" id="mktSeg"></div>
    <div class="tbl-wrap"><table class="data" id="mktM"></table></div></div>
</section>

<section id="s-nb">
  <h2 data-t="h2nb"></h2>
  <p class="sec-note" data-t="noteNb"></p>
  <div class="panel"><svg id="strips" viewBox="0 0 900 380" role="img" data-t-aria="ariaStrips"></svg>
    <div class="legend">
      <span class="key"><i class="dot" style="background:var(--focus)"></i><span class="f-name"></span> <span class="p-cur"></span></span>
      <span class="key"><i class="dot" style="border:2px solid var(--focus);background:transparent"></i><span class="f-name"></span> <span class="p-cmp"></span></span>
      <span class="key"><i class="dot" style="background:var(--peer);opacity:.6"></i><span data-t="lgOthers"></span></span>
      <span class="key"><i class="sq" style="width:2px;height:12px;background:var(--ink-2)"></i><span data-t="lgMedian"></span></span>
    </div>
  </div>
</section>

<section id="s-csm">
  <h2 data-t="h2csm"></h2>
  <p class="sec-note" data-t="noteCsm"></p>
  <div class="panel"><h3 data-t="h3quad"></h3><div class="sub" id="qSub"></div>
    <svg id="quad" viewBox="0 0 900 470" role="img" data-t-aria="ariaQuad"></svg>
    <div class="legend">
      <span class="key"><i class="dot" style="background:var(--focus)"></i><span class="f-name"></span></span>
      <span class="key"><i class="dot" style="background:var(--peer)"></i><span data-t="lgOthers"></span></span>
      <span class="key"><i class="sq" style="width:16px;height:0;border-top:2px dashed var(--ink-2);background:none"></i><span data-t="qThreshold"></span></span>
      <span class="key" style="color:var(--muted)">&#9650;&nbsp;&#9654;&nbsp;<span data-t="lgCeiling"></span></span>
      <span class="key" style="color:var(--muted)" data-t="lgBubble"></span>
    </div>

 not split the change in the risk adjustment between the insurance service result and insurance finance income or expense carries the whole RA change, including the effect of discount-rate movements, in the insurance service result. Section 5 shows every insurer on one service-margin axis and names under the chart the insurers that do not disaggregate. Restating to a common basis would need the P&L/OCI split of the RA finance effect, which the statements do not disclose, so no restated margin is shown. Net profit is not affected by the choice."},{"id":"oci_policy","title":"OCI measures depend on accounting policy and on what the statements separate","companies":[],"body":"Every insurer takes part of its insurance finance income or expense to other comprehensive income (the OCI option), so its insurance OCI moves against the OCI on debt instruments at fair value through OCI. Dhipaya Life, Krungthai-AXA Life and FWD Thailand (from 2026) print the finance OCI of insurance contracts issued and reinsurance contracts held on one line; it is shown as insurance OCI. Debt OCI is the fair-value line only: amounts reclassified to profit or loss and hedging lines are left out, so the components do not add up to total OCI. For FY2024, AIA, FWD, Krungthai-AXA, Phillip and Tokio Marine had not yet applied TFRS 9; their debt OCI is the fair-value change of investments at FVOCI under the previous standard. Opening equity is the restated balance at 1 January from the statement of changes in equity (the separate statements where an insurer also presents consolidated or equity-method statements)."},{"id":"release_ratio","title":"Reading the CSM quadrant","companies":[],"body":"A release ratio of roughly 8-13% is the normal run-off pace for a stable book. Far above it, the store is drawn down quickly relative to what remains; far below it, the runway is long. New business below 1.0x the release for more than a year or two is the early warning on future earnings."}],"i18n":{"ko":{"meta":{"title":"태국 생명보험업계 IFRS 17 대시보드","market":"태국 · 생명보험","standard":"TFRS 17 (IFRS 17)","period_end":"2025년 9월 30일 (불기 2568년)","unit":"백만 바트","quarterly_caveat":"분기 수치는 검토(감사 아님)를 받은 요약 중간재무제표의 누적(연초부터) 값이다. CSM 변동표와 신계약은 1월 1일부터의 누적이고, CSM 상각률은 연간 값과 같은 척도로 읽히도록 연환산(× 12 ÷ 경과월수)했다. 비교기간은 전년 중간재무제표의 같은 기간이다. 2025년 분기는 2024년 분기를 추출하지 않아 비교기간이 없다. 업계 변동은 두 기간에 모두 있는 보험사끼리만 계산했다. 어느 기간의 중간재무제표를 받지 못한 보험사는 그 기간에서 빠진다.","comparative_caveat":"분기 수치는 검토(감사 아님)를 받은 요약 중간재무제표의 누적(연초부터) 값이다. CSM 변동표와 신계약은 1월 1일부터의 누적이고, CSM 상각률은 연간 값과 같은 척도로 읽히도록 연환산(× 12 ÷ 경과월수)했다. 비교기간은 전년 중간재무제표의 같은 기간이다. 2025년 분기는 2024년 분기를 추출하지 않아 비교기간이 없다. 업계 변동은 두 기간에 모두 있는 보험사끼리만 계산했다. 어느 기간의 중간재무제표를 받지 못한 보험사는 그 기간에서 빠진다."},"groups":{"scale":"규모","profitability":"수익성","csm":"CSM","new_business":"신계약","oci":"OCI"},"metrics":{"insurance_revenue":{"label":"보험수익","formula":"보험수익 합계"},"net_profit":{"label":"당기순이익","formula":"당기순이익"},"csm_close":{"label":"기말 CSM","formula":"기말 보험계약마진(CSM)"},"nb_csm":{"label":"신계약 CSM","formula":"당기에 최초 인식한 계약에서 발생한 CSM"},"nb_pv_premium":{"label":"신계약 PV 보험료","formula":"신계약 미래 현금유입의 현재가치"},"isr_gross":{"label":"보험서비스결과","formula":"보험수익 + 보험서비스비용"},"net_inv_result":{"label":"순투자손익","formula":"투자손익 + 보험금융손익"},"pbt":{"label":"세전이익","formula":"당기순이익 + 법인세비용"},"ism_gross":{"label":"보험서비스마진","formula":"(보험수익 + 보험서비스비용) ÷ 보험수익"},"ism_net":{"label":"재보험 후 보험서비스마진","formula":"(보험서비스결과 + 재보험손익) ÷ 보험수익"},"inv_margin":{"label":"투자손익(보험금융비용 차감 후)","formula":"(순투자수익 + 순보험금융비용) ÷ 보험수익"},"other_ratio":{"label":"기타비용(순)","formula":"(기타비용 + 기타수익) ÷ 보험수익"},"tax_ratio":{"label":"법인세","formula":"법인세 ÷ 보험수익"},"npm":{"label":"순이익률","formula":"당기순이익 ÷ 보험수익"},"current_loss_ratio":{"label":"당기 서비스 손해율","formula":"−(발생사고 + 과거서비스 관련 변동) ÷ (BEL 해제 + RA 해제 + PAA 보험수익 + 기타 보험수익 + 보험취득현금흐름 회수)"},"csm_release_share":{"label":"보험수익 중 CSM 상각 비중","formula":"CSM 상각 ÷ 보험수익"},"csm_growth":{"label":"CSM 증가율","formula":"기말 CSM ÷ 기초 CSM − 1"},"csm_release_amount":{"label":"CSM 상각","formula":"서비스 제공에 따라 당기손익으로 인식한 CSM (양수로 표시)"},"release_ratio":{"label":"CSM 상각률","formula":"CSM 상각 ÷ (기초 CSM + 신계약 + 이자부리 + 미래서비스 관련 변동). 분기 페이지는 연환산(× 12 ÷ 경과월수)"},"nb_to_release":{"label":"신계약 CSM ÷ 상각","formula":"신계약 CSM ÷ CSM 상각"},"csm_adj_ratio":{"label":"CSM 조정률","formula":"미래서비스 관련 CSM 조정 ÷ (기초 CSM + 신계약 + 이자부리). 분기 페이지는 연초 이후 누적값이며 연환산하지 않음"},"net_inv_ratio":{"label":"순투자손익률","formula":"(투자손익 + 보험금융손익) ÷ 투자손익. 투자손익이 0 이하이면 n/a"},"oci_total":{"label":"기타포괄손익","formula":"당기 기타포괄손익(세후)"},"oci_ratio":{"label":"OCI ÷ 기초 자본","formula":"기타포괄손익(세후) ÷ 기초 자본총계. 분기 페이지는 연초 이후 누적값"},"oci_offset":{"label":"부채 OCI 상쇄율","formula":"−(보험계약 + 재보험 금융손익 OCI) ÷ FVOCI 채무상품 OCI, 모두 세전. 채무상품 OCI가 기초 자본의 5% 미만이면 n/a"},"nb_csm_margin":{"label":"신계약 CSM 마진율","formula":"신계약 CSM ÷ 신계약 PV 보험료"},"acq_cost_ratio":{"label":"신계약비용률","formula":"신계약 PV 보험취득현금흐름 ÷ 신계약 PV 보험료"},"nb_claims_ratio":{"label":"신계약 보험금·급부 비율","formula":"신계약 PV 보험금 유출 ÷ 신계약 PV 보험료"},"onerous_ratio":{"label":"신계약 손실부담 비율","formula":"신계약 손실요소 ÷ 신계약 CSM"},"rev_share":{"label":"보험수익 점유율","formula":"회사 보험수익 ÷ 대상 보험사 전체 합계"},"csm_share":{"label":"기말 CSM 점유율","formula":"회사 기말 CSM ÷ 대상 보험사 전체 합계"},"nb_csm_share":{"label":"신계약 CSM 점유율","formula":"회사 신계약 CSM ÷ 대상 보험사 전체 합계"},"pbt_share":{"label":"세전이익 점유율","formula":"회사 세전이익 ÷ 대상 보험사 전체 합계"}},"checks":{"revenue_split":{"label":"보험수익 구성 합계 = 보험수익 총액","short":"수익"},"expense_split":{"label":"비용 구성 합계 = 보험서비스비용 총액","short":"비용"},"net_profit":{"label":"순이익 브리지 = 공시 당기순이익","short":"순이익"},"csm_rollforward":{"label":"CSM 변동표 = 기말 CSM","short":"CSM 변동"},"nb_csm":{"label":"신계약: PV 유입 − 취득비용 − 보험금 − RA + 손실요소 = CSM","short":"신계약 CSM"},"nb_consistency":{"label":"CSM 변동표의 신계약 = 신계약 주석","short":"신계약 일치"}},"commentary":{"ra_policy":{"title":"위험조정(RA) 분리 여부는 이익률 비교에 영향을 준다","body":"위험조정 변동을 보험서비스결과와 보험금융손익으로 나누지 않는 보험사는 할인율 변동 효과를 포함한 RA 변동 전체를 보험서비스결과에 반영한다. 5번 섹션은 모든 보험사를 보험서비스이익률 한 축에 보여 주며, RA를 분리하지 않는 보험사는 차트 아래에 적었다. 공통 기준으로 재계산하려면 RA 금융효과의 당기손익/기타포괄손익 구분이 필요한데 재무제표에 공시되지 않으므로, 재계산한 이익률은 보여 주지 않는다. 당기순이익은 이 선택의 영향을 받지 않는다."},"oci_policy":{"title":"OCI 지표는 회계정책과 재무제표의 구분 방식에 따라 달라진다","body":"모든 보험사가 보험금융손익의 일부를 기타포괄손익으로 인식(OCI 옵션)하므로, 보험계약 OCI는 FVOCI 채무상품 OCI와 반대 방향으로 움직인다. Dhipaya Life, Krungthai-AXA Life, FWD Thailand(2026년부터)는 발행 보험계약과 보유 재보험계약의 금융손익 OCI를 한 줄로 표시하며, 이는 보험계약 OCI로 보여 준다. 채무상품 OCI는 공정가치 평가 줄만 쓰고 당기손익으로 재분류된 금액과 위험회피 항목은 제외하므로, 구성 항목의 합은 OCI 합계와 일치하지 않는다. FY2024에는 AIA, FWD, Krungthai-AXA, Phillip, Tokio Marine이 TFRS 9을 적용하기 전이어서, 채무상품 OCI는 종전 기준의 FVOCI 투자자산 공정가치 변동이다. 기초 자본은 자본변동표의 1월 1일 재작성 잔액이며, 연결 또는 지분법 재무제표를 함께 공시하는 회사는 별도재무제표 기준이다."},"transition":{"title":"FY2024 수치는 전환 비교기간 수치다","body":"TFRS 17은 2025년 1월 1일 시행, 전환일은 2024년 1월 1일이다. FY2024 수치는 FY2025 재무제표에 재작성되어 실린 비교기간 수치이며, 보험사별로 선택한 전환 방법이 FY2024 CSM에 영향을 준다. 전년 대비 변동을 표시하지만, 큰 변동은 실적보다 전환 방식에서 비롯될 수 있다."},"chubb_rabbit":{"title":"CHUBB와 Rabbit Life는 신계약 대체 배수 눈금 밖에 있다","body":"두 회사 모두 FY2024 전환 비교기간에 손실부담계약 비용을 크게 인식해 CSM과 FY2025 상각액이 작다. 분모가 작아 신계약 CSM ÷ 상각 배수가 부풀려지므로, 사분면에서의 위치는 신계약이 특별히 강해서가 아니라 전환 방식의 결과로 읽어야 한다."},"t_life_accretion":{"title":"T Life의 FY2025 CSM 이자부리는 음수다","body":"양(+)의 CSM에 최초 인식 시점 이율로 부리하는 이자는 양수여야 한다. 다른 변동이 해당 행에 상계되어 있을 가능성이 크다. 공시된 그대로 CSM 변동표가 정확히 맞으므로 수정하지 않고 반영했다."},"rabbit_scale":{"title":"Rabbit Life는 보험수익 대비 비율의 의미가 약하다","body":"보험 영업 규모에 비해 투자 자산이 매우 커서, 투자손익과 기타비용이 이익 브리지 눈금을 크게 벗어난다. 막대는 축에서 잘라 표시했고, 순이익률은 실제 값이다."},"release_ratio":{"title":"CSM 사분면 읽는 법","body":"CSM 상각률이 대략 8~13%이면 안정적인 보유계약의 일반적인 상각 속도다. 그보다 훨씬 높으면 남은 CSM 대비 빠르게 소진되는 것이고, 훨씬 낮으면 이익 실현 기간이 길다는 뜻이다. 신계약 CSM이 상각액의 1.0배에 못 미치는 상태가 1~2년 넘게 이어지면 미래 이익에 대한 조기 경고 신호다."}},"notes_language_label":"추출 메모는 추출 규격에 기록한 영문 원문 그대로 표시한다."},"th":{"meta":{"title":"แดชบอร์ด IFRS 17 อุตสาหกรรมประกันชีวิตไทย","market":"ประเทศไทย · ประกันชีวิต","standard":"TFRS 17 (IFRS 17)","period_end":"30 กันยายน 2568 (ค.ศ. 2025)","unit":"ล้านบาท","quarterly_caveat":"ตัวเลขรายไตรมาสเป็นยอดสะสมตั้งแต่ต้นปี จากงบการเงินระหว่างกาลแบบย่อที่ผ่านการสอบทาน (ไม่ใช่การตรวจสอบ) การเปลี่ยนแปลง CSM และธุรกิจใหม่เป็นยอดสะสมตั้งแต่ 1 มกราคม ส่วน CSM release ratio ปรับเป็นรายปี (× 12 ÷ จำนวนเดือนสะสม) เพื่อให้อ่านได้ในระดับเดียวกับตัวเลขทั้งปี งวดเปรียบเทียบคือช่วงเวลาเดียวกันของปีก่อนจากงบการเงินระหว่างกาลของปีก่อน ไตรมาสของปี 2025 ไม่มีงวดเปรียบเทียบ เพราะไม่ได้ดึงข้อมูลไตรมาสของปี 2024 การเปลี่ยนแปลงของอุตสาหกรรมคำนวณเฉพาะบริษัทที่มีข้อมูลทั้งสองงวด บริษัทที่ไม่ได้รับงบการเงินระหว่างกาลของงวดใดจะไม่รวมอยู่ในงวดนั้น","comparative_caveat":"ตัวเลขรายไตรมาสเป็นยอดสะสมตั้งแต่ต้นปี จากงบการเงินระหว่างกาลแบบย่อที่ผ่านการสอบทาน (ไม่ใช่การตรวจสอบ) การเปลี่ยนแปลง CSM และธุรกิจใหม่เป็นยอดสะสมตั้งแต่ 1 มกราคม ส่วน CSM release ratio ปรับเป็นรายปี (× 12 ÷ จำนวนเดือนสะสม) เพื่อให้อ่านได้ในระดับเดียวกับตัวเลขทั้งปี งวดเปรียบเทียบคือช่วงเวลาเดียวกันของปีก่อนจากงบการเงินระหว่างกาลของปีก่อน ไตรมาสของปี 2025 ไม่มีงวดเปรียบเทียบ เพราะไม่ได้ดึงข้อมูลไตรมาสของปี 2024 การเปลี่ยนแปลงของอุตสาหกรรมคำนวณเฉพาะบริษัทที่มีข้อมูลทั้งสองงวด บริษัทที่ไม่ได้รับงบการเงินระหว่างกาลของงวดใดจะไม่รวมอยู่ในงวดนั้น"},"groups":{"scale":"ขนาด","profitability":"ความสามารถในการทำกำไร","csm":"CSM","new_business":"ธุรกิจใหม่","oci":"OCI"},"metrics":{"insurance_revenue":{"label":"Insurance revenue","formula":"Insurance revenue รวมทั้งหมด"},"net_profit":{"label":"Net profit","formula":"Net profit สำหรับงวด"},"csm_close":{"label":"CSM closing","formula":"Contractual service margin (CSM) ณ วันสิ้นงวด"},"nb_csm":{"label":"New-business CSM","formula":"CSM จากสัญญาที่รับรู้เมื่อเริ่มแรกในงวด"},"nb_pv_premium":{"label":"New-business PV premium","formula":"มูลค่าปัจจุบันของกระแสเงินสดรับในอนาคตของธุรกิจใหม่"},"isr_gross":{"label":"Insurance service result","formula":"Insurance revenue + insurance service expense"},"net_inv_result":{"label":"Net investment result","formula":"Net investment income + net insurance finance expense"},"pbt":{"label":"Profit before tax","formula":"Net profit + ค่าใช้จ่ายภาษีเงินได้"},"ism_gross":{"label":"Insurance service margin","formula":"(Insurance revenue + insurance service expense) / insurance revenue"},"ism_net":{"label":"Insurance service margin after reinsurance","formula":"(Insurance service result + reinsurance result) / insurance revenue"},"inv_margin":{"label":"Investment result net of IFIE","formula":"(Net investment income + net insurance finance expense) / insurance revenue"},"other_ratio":{"label":"Other expense, net","formula":"(Other expense + other income) / insurance revenue"},"tax_ratio":{"label":"Income tax","formula":"Income tax / insurance revenue"},"npm":{"label":"Net profit margin","formula":"Net profit / insurance revenue"},"current_loss_ratio":{"label":"Current-service loss ratio","formula":"-(Incurred claims + past service) / (BEL release + RA release + PAA revenue + other revenue + acquisition recovery)"},"csm_release_share":{"label":"CSM release in revenue","formula":"CSM release / insurance revenue"},"csm_growth":{"label":"CSM growth","formula":"CSM closing / CSM opening - 1"},"csm_release_amount":{"label":"CSM release","formula":"CSM ที่รับรู้ในกำไรหรือขาดทุนจากการให้บริการ (แสดงเป็นจำนวนบวก)"},"release_ratio":{"label":"CSM release ratio","formula":"CSM release / (CSM ต้นงวด + ธุรกิจใหม่ + accretion + การเปลี่ยนแปลงที่เกี่ยวกับบริการในอนาคต) หน้ารายไตรมาสปรับเป็นรายปี (× 12 ÷ จำนวนเดือนสะสม)"},"nb_to_release":{"label":"New business / release","formula":"CSM จากธุรกิจใหม่ / CSM release"},"csm_adj_ratio":{"label":"CSM adjustment ratio","formula":"การปรับ CSM สำหรับบริการในอนาคต / (CSM ต้นงวด + ธุรกิจใหม่ + accretion) หน้ารายไตรมาสแสดงค่าสะสมตั้งแต่ต้นปี ไม่ปรับเป็นรายปี"},"net_inv_ratio":{"label":"Net investment ratio","formula":"(Net investment income + net insurance finance expense) / net investment income ถ้า net investment income เป็นศูนย์หรือติดลบจะแสดง n/a"},"oci_total":{"label":"Other comprehensive income","formula":"กำไรขาดทุนเบ็ดเสร็จอื่นสำหรับงวด สุทธิจากภาษี"},"oci_ratio":{"label":"OCI / opening equity","formula":"กำไรขาดทุนเบ็ดเสร็จอื่นสุทธิจากภาษี / ส่วนของเจ้าของรวมต้นปี หน้ารายไตรมาสแสดงค่าสะสมตั้งแต่ต้นปี"},"oci_offset":{"label":"Liability OCI offset","formula":"−(OCI ทางการเงินของสัญญาประกันภัย + สัญญาประกันภัยต่อ) / OCI ของตราสารหนี้ที่วัดมูลค่า FVOCI ทั้งหมดก่อนภาษี n/a เมื่อ OCI ของตราสารหนี้น้อยกว่า 5% ของส่วนของเจ้าของต้นงวด"},"nb_csm_margin":{"label":"New-business CSM margin","formula":"CSM จากธุรกิจใหม่ / PV premium ของธุรกิจใหม่"},"acq_cost_ratio":{"label":"Acquisition cost ratio","formula":"PV acquisition cost / PV premium ของธุรกิจใหม่"},"nb_claims_ratio":{"label":"Claims & benefits ratio (NB)","formula":"PV สินไหมและผลประโยชน์ / PV premium ของธุรกิจใหม่"},"onerous_ratio":{"label":"Onerous new business","formula":"Loss component ของธุรกิจใหม่ / CSM จากธุรกิจใหม่"},"rev_share":{"label":"Share of insurance revenue","formula":"Insurance revenue ของบริษัท / ยอดรวมของทุกบริษัทที่ครอบคลุม"},"csm_share":{"label":"Share of closing CSM","formula":"CSM closing ของบริษัท / ยอดรวมของทุกบริษัทที่ครอบคลุม"},"nb_csm_share":{"label":"Share of new-business CSM","formula":"New-business CSM ของบริษัท / ยอดรวมของทุกบริษัทที่ครอบคลุม"},"pbt_share":{"label":"Share of profit before tax","formula":"Profit before tax ของบริษัท / ยอดรวมของทุกบริษัทที่ครอบคลุม"}},"checks":{"revenue_split":{"label":"ผลรวมองค์ประกอบ = Insurance revenue รวม","short":"รายได้"},"expense_split":{"label":"ผลรวมองค์ประกอบ = Insurance service expense รวม","short":"ค่าใช้จ่าย"},"net_profit":{"label":"การกระทบยอดกำไร = Net profit ตามที่พิมพ์ในงบ","short":"กำไร"},"csm_rollforward":{"label":"การเปลี่ยนแปลง CSM = CSM closing","short":"CSM"},"nb_csm":{"label":"ธุรกิจใหม่: PV inflow - acquisition - claims - RA + loss component = CSM","short":"NB CSM"},"nb_consistency":{"label":"ธุรกิจใหม่ในตารางการเปลี่ยนแปลง CSM = หมายเหตุธุรกิจใหม่","short":"NB ตรงกัน"}},"commentary":{"ra_policy":{"title":"การแยก risk adjustment (RA) มีผลต่อการเปรียบเทียบอัตรากำไร","body":"บริษัทที่ไม่แยกการเปลี่ยนแปลงของ risk adjustment ระหว่าง insurance service result กับรายได้หรือค่าใช้จ่ายทางการเงินจากการประกันภัย จะรวมการเปลี่ยนแปลงของ RA ทั้งหมด รวมถึงผลจากการเปลี่ยนแปลงอัตราคิดลด ไว้ใน ins function showTip(ev, html) {
  tip.innerHTML = html; tip.style.opacity = 1;
  const w = tip.offsetWidth || 260, h = tip.offsetHeight || 120;
  let x = ev.clientX + 16, y = ev.clientY - 20;
  if (x + w > innerWidth - 10) x = ev.clientX - w - 16;
  if (y + h > innerHeight - 10) y = innerHeight - h - 10;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
}
// the chart element whose tooltip is open. On a phone a tap opens the tooltip through an emulated mousemove, but
// no mouseleave follows when the reader scrolls or taps text, so a press outside that element, or any scroll
// (also inside a scrolling box, hence capture), closes it
let tipOwner = null;
const hideTip = () => { tip.style.opacity = 0; tipOwner = null; };
document.addEventListener("pointerdown", e => { if (tipOwner && !tipOwner.contains(e.target)) hideTip(); }, true);

const tipTable = (title, rows) => {

    if (!r) { gs = true; return ""; }

    [t("tipInv"), tipM(raw(c, "net_investment_income"))], [t("tipIfie"), tipM(raw(c, "ifie"))], [t("tipNir"), tipM(g(c, "net_inv_result"))], null,
    [t("tipPbt"), tipM(g(c, "pbt"))], [t("tipNp"), tipM(raw(c, "net_profit"))], null,
    [t("tipIsm"), fP(g(c, "ism_gross"))], [t("tipRel") + (QTR ? t("ann") : ""), fP(g(c, "release_ratio"))],
    [t("tipNbr"), fX(g(c, "nb_to_release"))], [t("tipNbm"), fP(g(c, "nb_csm_margin"))]]);
}
// CSM sustainability quadrant: its two ratios, the amounts behind them, then the closing CSM the circle's area shows
function quadTip(c) {
  return tipTable(c.name, [
    [t("tipNbr"), fX(g(c, "nb_to_release"))], [t("tipNbm"), fP(g(c, "nb_csm_margin"))], null,
    [t("tipNbCsm"), tipM(g(c, "nb_csm"))], [t("tipRelAmt"), tipM(g(c, "csm_release_amount"))], [t("tipNbPv"), tipM(g(c, "nb_pv_premium"))], null,
    [t("tipCsm"), tipM(g(c, "csm_close"))]]);

function hover(node, html) {
  const open = e => { showTip(e, typeof html === "function" ? html() : html); tipOwner = node; };
  node.addEventListener("mousemove", open);
  node.addEventListener("click", open);  // a tap opens it even where the browser emulates no mousemove
  node.addEventListener("mouseleave", hideTip);
  node.style.cursor = "default";
}
function niceTicks(lo, hi, n = 5) {
  const span = hi - lo, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => span / s <= n) || 10 * mag;
  const out = []; for (let x = Math.ceil(lo / step - 1e-9) * step; x <= hi + 1e-9; x += step) out.push(+x.toFixed(10));
  return { ticks: out, step };
}

// Card colour (v1.14, owner decision after the CFO review): the insurer's own change on the comparative period,
// better or worse for the measure. A change smaller than CHG_MIN, a measure with no better direction and a missing
// comparative leave the card plain. The industry rank stays on the card as a small reference line only.
const CHG_MIN = { growth: 0.02, pp: 0.005, x: 0.05 };
function cardChange(kind, cur, prev, better) {
  if (cur == null || prev == null) return { html: '<span class="vs">' + t("noCmp") + "</span>", status: null };
  let d, txt;
  if (kind === "growth") { d = growth(cur, prev); if (d == null) return { html: '<span class="vs">' + t("nmBase", { cmp: CMPL }) + "</span>", status: null }; txt = (d >= 0 ? "+" : "") + nf(d * 100, 1) + "%"; }
  else if (kind === "pp") { d = cur - prev; txt = (d >= 0 ? "+" : "") + nf(d * 100, 1) + " " + t("pp"); }
  else { d = cur - prev; txt = (d >= 0 ? "+" : "") + nf(d, 2) + "×"; }
  const dir = Math.abs(d) < 1e-9 ? "flat" : d > 0 ? "up" : "down";
  const status = better == null || Math.abs(d) < CHG_MIN[kind] - 1e-12 ? null : (d > 0) === better ? "good" : "bad";
  const arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "◆";
  return { html: '<span class="chg ' + (status || "flat") + '">' + arrow + " " + txt + '</span> <span class="vs">' + t("vs", { cmp: CMPL }) + "</span>", status };
}

let MKT = 0;  // measure shown in the narrow-screen market table (index into cols)
// a bar from a zero line, scaled to the measure's range; a negative value runs left of the line
function mktBar(v, lo, hi) {
  if (v == null) return "";
  const span = hi - lo || 1, z = -lo / span * 100, w = Math.abs(v) / span * 100, left = v < 0 ? z - w : z;
  return "<div class='track'>" + (lo < 0 ? "<i class='zero' style='left:" + z.toFixed(2) + "%'></i>" : "") +
    "<div class='fill" + (v < 0 ? " neg" : "") + "' style='left:" + left.toFixed(2) + "%;width:" + w.toFixed(2) + "%'></div></div>";
}
function market() {

  const sh = (c, k) => { const v = g(c, k), a = ind(k).agg; return v == null || !a ? null : v / a; };

    "<th class='gsep' colspan='" + 3 * (cols.length - NFUT) + "'>" + t("mktGPeriod") + "</th></tr>" +

  // ordered by new-business CSM; # is the new-business CSM rank

    const r = rk(c, "nb_csm")?.rank;

      cols.map((k, i) => { const v = g(c, k), s = sh(c, k);
        return "<td class='bar " + sep(i) + "'>" + mktBar(v, ...rng[k]) + "</td><td class='v" + neg(v) + "'>" + fM(v) + "</td><td class='s" + neg(s) + "'>" + fP(s) + "</td>"; }).join("") + "</tr>";
  });

    cols.map((k, i) => "<td class='" + sep(i) + "'></td><td><b>" + fM(ind(k).agg) + "</b></td><td class='s'>100%</td>").join("") + "</tr></tbody>";
  const tb = $("#mkt"); tb.innerHTML = h;
  tb.querySelectorAll("tr[data-co]").forEach(tr => hover(tr, () => coTip(byName(tr.dataset.co))));

  // narrow screens: the measure picked with the switch, its own ranking and order
  const mk = cols[MKT];
  const sw = $("#mktSeg"); sw.setAttribute("aria-label", t("mktMeasure"));
  sw.innerHTML = cols.map((k, i) => "<button type='button' data-i='" + i + "' aria-pressed='" + (i === MKT) + "'>" + esc(mLabel(k)) + "</button>").join("");
  sw.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { MKT = +b.dataset.i; market(); }));
  const mv = c => g(c, mk) ?? -Infinity;
  let m = "<thead><tr><th class='l'>#</th><th class='l'>" + t("insurer") + "</th><th></th><th>" + esc(mLabel(mk)) + (DEF[mk].unit === "thb_m" ? " (" + t("m") + ")" : "") +
    "</th><th>" + t("share") + "</th></tr></thead><tbody>";
  COS.slice().sort((a, b) => mv(b) - mv(a)).forEach(c => {
    const v = g(c, mk), s = sh(c, mk);
    m += "<tr class='" + (isF(c) ? "focus" : "") + "' data-co='" + esc(c.name) + "'><td class='l'>" + (rk(c, mk)?.rank ?? "") + "</td><td class='l nm'>" + esc(c.name) + "</td>" +
      "<td class='br'>" + mktBar(v, ...rng[mk]) + "</td><td class='" + neg(v).trim() + "'>" + fM(v) + "</td><td class='s" + neg(s) + "'>" + fP(s) + "</td></tr>";
  });

// Approximate width of text at font size fs: a Korean character is about 1 em, others about 0.55 em.
const textW = (s, fs) => [...s].reduce((a, ch) => a + (/[\u1100-\u11ff\u3130-\u318f\uac00-\ud7a3]/.test(ch) ? 1 : 0.55) * fs, 0);

/* ---------- 4a quadrant ---------- */
function quadrant() {
  const svg = $("#quad"); svg.textContent = "";
  // x: new-business CSM margin, the margin of the year's sales; y: new-business CSM / release, whether that new
  // business replaces what the CSM releases (owner decision v1.13; x was the CSM release ratio).
  // Axis limits: y at 3x; x at 25%, near the top of the 30% plausibility limit. A point beyond a limit sits on
  // it with a marker and its true value, so one outlier cannot squeeze the others.
  const W = 900, H = 470, L = 56, R = 20, T = 20, B = 46, CAP = 3, XCAP = 25;
  const QCOS = COS.filter(c => g(c, "nb_csm_margin") != null && g(c, "nb_to_release") != null);
  const xs = QCOS.map(c => g(c, "nb_csm_margin") * 100);
  const x1 = Math.min(XCAP, Math.max(20, Math.ceil(Math.max(...xs) / 5) * 5));

  const maxC = Math.max(...COS.map(c => raw(c, "csm_close")));

    svg.appendChild(el("line", { x1: L, x2: W - R, y1: py(v), y2: py(v), stroke: "var(--grid)" }));
    svg.appendChild(el("text", { x: L - 9, y: py(v) + 4, "text-anchor": "end", fill: "var(--muted)", "font-size": 11 }, v.toFixed(1) + "×"));
  }
  for (let v = 0; v <= x1; v += 5) svg.appendChild(el("text", { x: px(v), y: H - B + 18, "text-anchor": "middle", fill: "var(--muted)", "font-size": 11 }, v + "%"));
  svg.appendChild(el("line", { x1: L, x2: W - R, y1: H - B, y2: H - B, stroke: "var(--axis)" }));
  svg.appendChild(el("line", { x1: L, x2: W - R, y1: py(1), y2: py(1), stroke: "var(--ink-2)", "stroke-width": 1.5, "stroke-dasharray": "5 4" }));
  svg.appendChild(el("text", { x: (L + W - R) / 2, y: H - 6, "text-anchor": "middle", fill: "var(--ink-2)", "font-size": 12 }, t("qX")));
  // industry median of the margin, labelled just above the x axis: higher margin to its right
  const xMed = ind("nb_csm_margin").median, xm = xMed == null ? null : px(xMed * 100);
  const medTxt = xMed == null ? "" : t("median", { v: fP(xMed) }), medBox = xm == null ? null : { x1: xm + 2, x2: xm + 8 + textW(medTxt, 11), y1: H - B - 18, y2: H - B - 2 };
  if (xm != null) {
    svg.appendChild(el("line", { x1: xm, x2: xm, y1: T, y2: H - B, stroke: "var(--ink-2)", "stroke-width": 1.2, "stroke-dasharray": "3 4" }));
    svg.appendChild(el("text", { x: xm + 5, y: H - B - 6, fill: "var(--ink-2)", "font-size": 11 }, medTxt));
  }
  svg.appendChild(el("text", { x: 0, y: 0, fill: "var(--ink-2)", "font-size": 12, "text-anchor": "middle", transform: "translate(13," + ((T + H - B) / 2) + ") rotate(-90)" }, t("qY")));

  const pts = QCOS.map(c => {
    const overY = g(c, "nb_to_release") > CAP, overX = g(c, "nb_csm_margin") * 100 > x1;
    const extra = [overX ? fP(g(c, "nb_csm_margin")) : null, overY ? fX(g(c, "nb_to_release"), 1) : null].filter(Boolean).join(" · ");
    return { c, x: px(g(c, "nb_csm_margin") * 100), y: py(g(c, "nb_to_release")), rad: rad(raw(c, "csm_close")), over: overX || overY, overX, overY, extra, txt: c.short };
  })
    .sort((a, b) => (isF(b.c) - isF(a.c)) || (b.rad - a.rad));
  // the 1.0x line is explained in the legend under the chart: with the margin across, bubbles crowd that line
  // and there is no free spot for a label on it on every page (v1.13)
  const boxes = [medBox].filter(Boolean), LH = 13;
  const overlap = (a, b) => !(a.x2 < b.x1 || b.x2 < a.x1 || a.y2 < b.y1 || b.y2 < a.y1);
  pts.forEach(p => {
    const w = Math.max(p.txt.length * (isF(p.c) ? 7 : 6.2), p.over ? p.extra.length * 5.8 : 0), h = p.over ? LH + 11 : LH;
    let best = null;
    for (const side of [1, -1]) for (const dy of [0, -14, 14, -28, 28, -42, 42, -56, 56]) {
      const lx = p.x + side * (p.rad + 6), ly = p.y + 4 + dy;
      const bx1 = side > 0 ? lx : lx - w, bx2 = side > 0 ? lx + w : lx;
      const box = { x1: bx1 - 2, x2: bx2 + 2, y1: ly - 11, y2: ly - 11 + h + 3 };
      if (bx1 < L + 2 || bx2 > W - R - 2 || box.y1 < T - 4 || box.y2 > H - B - 2) continue;
      const hitL = boxes.some(b => overlap(box, b));
      const hitB = pts.some(q => q !== p && !(box.x2 < q.x - q.rad || box.x1 > q.x + q.rad || box.y2 < q.y - q.rad || box.y1 > q.y + q.rad));
      if (!hitL && !hitB) { best = { side, dy, lx, ly, box }; break; }

    }
    if (!best) { const lx = p.x + p.rad + 6; best = { side: 1, dy: 0, lx, ly: p.y + 4, box: { x1: lx, x2: lx + w, y1: p.y - 7, y2: p.y + 7 } }; }
    Object.assign(p, best); boxes.push(best.box);

  pts.slice().sort((a, b) => isF(a.c) - isF(b.c) || b.rad - a.rad).forEach(p => {
    const c = colr(p.c), gg = el("g");

    gg.appendChild(el("circle", { cx: p.x, cy: p.y, r: p.rad, fill: c, "fill-opacity": isF(p.c) ? .45 : .22, stroke: c, "stroke-width": 2 }));
    if (p.overY) gg.appendChild(el("path", { d: "M" + (p.x - 6) + "," + (p.y - p.rad - 4) + " L" + (p.x + 6) + "," + (p.y - p.rad - 4) + " L" + p.x + "," + (p.y - p.rad - 13) + " Z", fill: c }));
    if (p.overX) gg.appendChild(el("path", { d: "M" + (p.x + p.rad + 4) + "," + (p.y - 6) + " L" + (p.x + p.rad + 4) + "," + (p.y + 6) + " L" + (p.x + p.rad + 13) + "," + p.y + " Z", fill: c }));
    gg.appendChild(el("text", { x: p.lx, y: p.ly, "text-anchor": p.side > 0 ? "start" : "end", fill: "var(--ink)", "font-size": isF(p.c) ? 13 : 11.5, "font-weight": isF(p.c) ? 650 : 400 }, p.txt));
    if (p.over) gg.appendChild(el("text", { x: p.lx, y: p.ly + 12, "text-anchor": p.side > 0 ? "start" : "end", fill: "var(--muted)", "font-size": 10.5 }, p.extra));
    const hit = el("circle", { cx: p.x, cy: p.y, r: Math.max(p.rad, 12), fill: "transparent" });
    hover(hit, () => quadTip(p.c)); gg.appendChild(hit); svg.appendChild(gg);
  });
}

/* ---------- 3 strips ---------- */
// Break text into lines no wider than maxW (SVG units) at font size fs.
function wrapText(s, maxW, fs) {
  const w = x => textW(x, fs);
  const lines = [];
  s.split(" ").forEach(word => {
    const last = lines[lines.length - 1];
    if (last != null && w(last + " " + word) <= maxW) lines[lines.length - 1] = last + " " + word; else lines.push(word);
  });
  return lines;
}
// numerator and denominator of each strip measure, shown in the tooltip (THB m, current period): line items
// summed with their sign (a leading "-" negates one), so a CSM release or an expense shows as a positive amount
const STRIP_ND = { nb_csm_margin: [["nb_csm"], ["nb_pv_premium"], "ndNbCsm", "ndPvPrem"], acq_cost_ratio: [["nb_pv_acq"], ["nb_pv_premium"], "ndPvAcq", "ndPvPrem"],
  onerous_ratio: [["nb_loss_component"], ["nb_csm"], "ndLoss", "ndNbCsm"], nb_to_release: [["nb_csm"], ["-csm_release"], "ndNbCsm", "ndRel"],
  csm_adj_ratio: [["csm_future_service"], ["csm_open", "csm_nb", "csm_accretion"], "ndAdj", "ndAdjBase"],
  net_inv_ratio: [["net_investment_income", "ifie"], ["net_investment_income"], "ndNetInv", "ndInv"],
  ism_gross: [["insurance_revenue", "insurance_service_expense"], ["insurance_revenue"], "ndIsr", "ndRev"] };
const ndAmt = (c, codes) => codes.reduce((s, f) => { const neg = f[0] === "-", v = raw(c, neg ? f.slice(1) : f); return s == null || v == null ? null : s + (neg ? -v : v); }, 0);
// measures that can fall below zero: their axis is centred on the median without the zero floor
const STRIP_SIGNED = new Set(["ism_gross", "csm_adj_ratio", "net_inv_ratio"]);
const pctl = (v, p) => { const s = v.slice().sort((a, b) => a - b), k = (s.length - 1) * p, f = Math.floor(k), c = Math.min(f + 1, s.length - 1); return s[f] + (s[c] - s[f]) * (k - f); };
// Axis of one strip (owner decision): centred on the industry median, half-width 1.25 times the farther of the
// 10th and 90th percentiles from it, and never below zero (half-width at most the median). The onerous ratio is
// too skewed for that (median near 0, a few insurers in the thousands of %), so it has a fixed 0-10% axis.
function stripAxis(k, vals, med) {
  if (k === "onerous_ratio") return [0, 0.1];
  if (med == null || !vals.length) return [Math.min(0, ...vals), Math.max(...vals)];
  const spread = 1.25 * Math.max(Math.abs(pctl(vals, 0.1) - med), Math.abs(pctl(vals, 0.9) - med));
  const d = STRIP_SIGNED.has(k) ? spread : Math.min(spread, med);
  return d > 0 ? [med - d, med + d] : [Math.min(0, ...vals), Math.max(...vals)];
}
// Tooltip for a spot on a strip: every insurer whose dot overlaps there, in axis order, with the numerator and
// denominator behind the measure; the highlighted insurer adds the median and its rank.
function stripTip(k, list) {
  const d = DEF[k], [nk, dk, nl, dl] = STRIP_ND[k], amt = ndAmt;
  const hasCmp = COS.some(c => g(c, k, CMP) != null);
  let h = "<b>" + esc(mLabel(k)) + "</b><table class='tipgrid'><tr><th class='l'>" + t("insurer") + "</th><th>" + esc(CURL) + "</th>" +
    (hasCmp ? "<th>" + esc(CMPL) + "</th>" : "") + "<th>" + t(nl) + "</th><th>" + t(dl) + "</th></tr>";
  list.forEach(c => {
    h += "<tr" + (isF(c) ? " class='f'" : "") + "><td class='l'>" + esc(c.name) + "</td><td>" + fmtU(d.unit, g(c, k)) + "</td>" +
      (hasCmp ? "<td>" + fmtU(d.unit, g(c, k, CMP)) + "</td>" : "") + "<td>" + fM(amt(c, nk)) + "</td><td>" + fM(amt(c, dk)) + "</td></tr>";
  });
  h += "</table><div class='tipnote'>" + t("tipAmounts", { cur: CURL }) + "</div>";
  const f = list.find(isF);
  if (f) h += "<div class='tipnote'>" + t("tipMedian") + " " + fmtU(d.unit, ind(k).median) + " · " + t("tipRank") + " " + rk(f, k).rank + " / " + rk(f, k).n + "</div>";
  return h;
}
function strips(sel, rows) {
  const svg = $(sel); svg.textContent = "";
  const W = 900, L = 200, R = 40, rowH = 88, T = 10, NEAR = 10;
  // a row grows when its definition wraps to many lines, so the reading direction under it never runs into
  // the next row's name (the net investment ratio wraps to five lines)
  const defOf = rows.map(k => wrapText(mFormula(k), L - 14, 10.5));
  const ys = []; let yAt = T;
  defOf.forEach(dl => { ys.push(yAt); yAt += Math.max(rowH, Math.ceil(42 + dl.length * 12.5)); });
  const H = yAt + 4;
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  rows.forEach((k, ri) => {
    const d = DEF[k], y0 = ys[ri], cy = y0 + 34, med = ind(k).median;
    const pts = COS.map(c => ({ c, v: g(c, k) })).filter(p => p.v != null);
    const [lo, hi] = stripAxis(k, pts.map(p => p.v), med);
    const { ticks, step } = niceTicks(lo, hi, 6);
    // one decimal when the step is a fraction of the unit (2.5% steps would otherwise print as 3%, 8%, 13%)
    const tdp = s => Math.abs(s - Math.round(s)) > 1e-6 ? 1 : 0;
    const tickTxt = tk => d.unit === "pct" ? nf(tk * 100, tdp(step * 100)) + "%" : nf(tk, 1 + tdp(step * 10)) + "×";
    const px = v => L + (Math.min(Math.max(v, lo), hi) - lo) / (hi - lo) * (W - L - R);
    const near = p => pts.filter(q => Math.abs(px(q.v) - px(p.v)) <= NEAR).sort((a, b) => a.v - b.v).map(q => q.c);
    // name, then its definition (as in the definitions table) in small type, then the reading direction
    svg.appendChild(el("text", { x: 0, y: cy - 14, "font-size": 13, "font-weight": 600, fill: "var(--ink)" }, mLabel(k)));
    const defLines = defOf[ri];
    defLines.forEach((s, i) => svg.appendChild(el("text", { x: 0, y: cy + 2 + i * 12.5, "font-size": 10.5, fill: "var(--ink-2)" }, s)));
    svg.appendChild(el("text", { x: 0, y: cy + 6 + defLines.length * 12.5, "font-size": 11, fill: "var(--muted)" }, d.better === true ? t("better") : d.better === false ? t("worse") : ""));
    // better and worse sides of the industry median, lightly tinted, with a word at each outer end
    // (owner decision v1.13); a neutral measure has none. A side narrower than its word gets no word.
    if (d.better != null && med != null) {
      const xm = px(med), sides = [[L, xm, !d.better], [xm, W - R, d.better]];
      sides.forEach(([a, b, good], i) => {
        if (b - a < 1) return;
        svg.appendChild(el("rect", { x: a, y: cy - 18, width: b - a, height: 36, fill: good ? "var(--good)" : "var(--bad)", "fill-opacity": good ? .09 : .07 }));
        if (b - a < 70) return;
        svg.appendChild(el("text", { x: i ? b - 4 : a + 4, y: cy + 15, "text-anchor": i ? "end" : "start", "font-size": 10, "font-weight": 600,
          fill: good ? "var(--good)" : "var(--bad)" }, t((good ? "zBetter" : "zWorse") + (i ? "R" : "L"))));
      });
    }
    ticks.forEach(tk => {
      svg.appendChild(el("line", { x1: px(tk), x2: px(tk), y1: cy - 18, y2: cy + 18, stroke: "var(--grid)" }));
      svg.appendChild(el("text", { x: px(tk), y: cy + 32, "text-anchor": "middle", "font-size": 10.5, fill: "var(--muted)" }, tickTxt(tk)));
    });
    svg.appendChild(el("line", { x1: L, x2: W - R, y1: cy, y2: cy, stroke: "var(--axis)" }));
    if (med != null) svg.appendChild(el("line", { x1: px(med), x2: px(med), y1: cy - 16, y2: cy + 16, stroke: "var(--ink-2)", "stroke-width": 2 }));
    // insurers beyond the axis sit on its end; one mark per end, with their number when there are several
    const nLo = pts.filter(p => p.v < lo).length, nHi = pts.filter(p => p.v > hi).length;
    if (nLo) svg.appendChild(el("text", { x: L - 8, y: cy + 4, "text-anchor": "end", "font-size": 10.5, fill: "var(--muted)" }, "‹" + (nLo > 1 ? nLo : "")));
    if (nHi) svg.appendChild(el("text", { x: W - R + 8, y: cy + 4, "font-size": 10.5, fill: "var(--muted)" }, "›" + (nHi > 1 ? nHi : "")));
    pts.filter(p => !isF(p.c)).forEach(p => {
      const dot = el("circle", { cx: px(p.v), cy, r: 5, fill: "var(--peer)", "fill-opacity": .55, stroke: "var(--surface)", "stroke-width": 1.5 });
      hover(dot, () => stripTip(k, near(p))); svg.appendChild(dot);

      return;

      svg.appendChild(el("circle", { cx: px(vp), cy, r: 6, fill: "var(--surface)", stroke: "var(--focus)", "stroke-width": 2 }));
    }
    const fd = el("circle", { cx: px(v), cy, r: 7, fill: "var(--focus)", stroke: "var(--surface)", "stroke-width": 2 });
    hover(fd, () => stripTip(k, near({ c, v })));
    svg.appendChild(fd);
    const edge = v < lo ? "‹ " : "", edgeR = v > hi ? " ›" : "";

    if (med != null) svg.appendChild(el("text", { x: px(med), y: cy + 44, "text-anchor": "middle", "font-size": 10.5, fill: "var(--ink-2)" }, t("median", { v: fmtU(d.unit, med) })));
  });
}

/* ---------- 5 OCI composition ---------- */
// Owner decision (v1.12): bars replace the two OCI strips. Each insurer's OCI for the year to date as a share
// of its opening equity: the fair-value change on debt instruments at FVOCI (assets), the insurance and
// reinsurance finance OCI that offsets it (liabilities), equity instruments at FVOCI, and the rest (income tax,
// reclassifications to profit or loss, hedging), taken as the difference so that the bars add up to the OCI
// after tax, which the diamond marks. The short bar is the same insurer's OCI a year earlier.
const OCI_CODES = ["oci_debt_fvoci", "oci_ins_finance", "oci_reins_finance", "oci_equity_fvoci", "oci_total", "equity_open"];
const OCI_PARTS = [["debt", "var(--c1)", "lgOciDebt"], ["liab", "var(--c2)", "lgOciLiab"], ["eq", "var(--c3)", "lgOciEq"], ["rest", "var(--c4)", "lgOciRest"]];
// amounts summed over insurers (one insurer, or the industry); null when any is missing or equity is not positive
function ociAmts(cs, fy = CUR) {
  const s = {};
  for (const k of OCI_CODES) {
    let v = 0;
    for (const c of cs) { const x = raw(c, k, fy); if (x == null) return null; v += x; }
    s[k] = v;
  }
  if (!(s.equity_open > 0)) return null;
  const debt = s.oci_debt_fvoci, liab = s.oci_ins_finance + s.oci_reins_finance, eq = s.oci_equity_fvoci, tot = s.oci_total;
  return { s, debt, liab, eq, rest: tot - debt - liab - eq, tot, e: s.equity_open };
}
function ociBars() {
  const svg = $("#oci"); svg.textContent = "";
  const cos = COS.map(c => ({ c, o: ociAmts([c]), p: ociAmts([c], CMP) })).filter(r => r.o);
  if (!cos.length) return;
  // industry: sum over the insurers shown; its comparative is like for like (insurers present in both periods)
  const both = cos.filter(r => r.p).map(r => r.c);
  const indO = ociAmts(cos.map(r => r.c));
  // the offset rule of pipeline/metrics.py (n/a when the debt OCI is under 5% of opening equity), on the sums
  const indRow = { ind: true, name: t("industryAgg"), o: indO, p: both.length ? ociAmts(both, CMP) : null,
    off: Math.abs(indO.debt) < 0.05 * indO.e ? null : -indO.liab / indO.debt };
  cos.forEach(r => r.off = g(r.c, "oci_offset"));
  const sh = (o, k) => o[k] / o.e * 100;
  cos.sort((a, b) => sh(b.o, "tot") - sh(a.o, "tot"));  // total OCI, highest first
  const rows = [indRow, ...cos];
  const W = 900, L = 140, R = 132, T = 34, step = 27, GAP = 10, B = 12;
  const H = T + rows.length * step + GAP + B;
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  // axis: every stacked end of the current period and every comparative total (the marks drawn), so nothing is clipped
  let lo = 0, hi = 0;
  rows.forEach(r => {
    const parts = OCI_PARTS.map(([k]) => sh(r.o, k)), pt = r.p ? [sh(r.p, "tot")] : [];
    lo = Math.min(lo, parts.filter(v => v < 0).reduce((a, b) => a + b, 0), sh(r.o, "tot"), ...pt);
    hi = Math.max(hi, parts.filter(v => v > 0).reduce((a, b) => a + b, 0), sh(r.o, "tot"), ...pt);
  });
  const { ticks, step: ts } = niceTicks(lo, hi, 9);
  if (ticks[0] > lo + 1e-9) ticks.unshift(+(ticks[0] - ts).toFixed(10));
  if (ticks[ticks.length - 1] < hi - 1e-9) ticks.push(+(ticks[ticks.length - 1] + ts).toFixed(10));
  lo = ticks[0]; hi = ticks[ticks.length - 1];
  const px = v => L + (v - lo) / (hi - lo) * (W - L - R);
  const yOf = i => T + i * step + (i ? GAP : 0) + step / 2;
  ticks.forEach(v => {
    svg.appendChild(el("line", { x1: px(v), x2: px(v), y1: T - 12, y2: H - B + 4, stroke: Math.abs(v) < 1e-9 ? "var(--axis)" : "var(--grid)", "stroke-width": Math.abs(v) < 1e-9 ? 1.5 : 1 }));
    svg.appendChild(el("text", { x: px(v), y: T - 18, "text-anchor": "middle", fill: "var(--muted)", "font-size": 11 }, (v > 0 ? "+" : "") + nf(v, 0) + "%"));
  });
  svg.appendChild(el("text", { x: W - 4, y: T - 18, "text-anchor": "end", fill: "var(--muted)", "font-size": 11 }, t("ociColHead")));
  const pct = v => (v > 0 ? "+" : "") + nf(v, 1) + "%";
  rows.forEach((r, i) => {
    const y = yOf(i), h = 14, gg = el("g"), o = r.o, focus = !r.ind && isF(r.c);
    if (focus) gg.appendChild(el("rect", { x: 4, y: y - step / 2 + 2, width: W - 8, height: step - 4, fill: "var(--focus-soft)", rx: 3 }));
    if (r.ind) gg.appendChild(el("rect", { x: 4, y: y - step / 2 + 2, width: W - 8, height: step - 4, fill: "var(--band)", rx: 3 }));
    let cp = 0, cn = 0;
    OCI_PARTS.forEach(([k, col]) => {
      const v = sh(o, k); if (Math.abs(v) < 0.05) return;
      let x1, x2;
      if (v > 0) { x1 = px(cp); x2 = px(cp + v); cp += v; } else { x1 = px(cn + v); x2 = px(cn); cn += v; }
      const w = Math.max(1, x2 - x1 - 1);
      gg.appendChild(el("rect", { x: x1 + 0.5, y: y - h / 2, width: w, height: h, fill: col, rx: 2 }));
    });
    if (r.p) {  // the same insurer's total OCI a year earlier
      const xp = px(sh(r.p, "tot"));
      gg.appendChild(el("line", { x1: xp, x2: xp, y1: y - 10, y2: y + 10, stroke: "var(--ink-2)", "stroke-width": 2.5, "stroke-linecap": "round" }));
    }
    const name = r.ind ? r.name : r.c.name;
    gg.appendChild(el("text", { x: L - 12, y: y + 4, "text-anchor": "end", "font-size": 12.5, fill: "var(--ink)", "font-weight": focus || r.ind ? 650 : 400 }, name));
    const mx = px(sh(o, "tot")), m = 6.5;
    gg.appendChild(el("path", { d: "M" + mx + "," + (y - m) + " L" + (mx + m) + "," + y + " L" + mx + "," + (y + m) + " L" + (mx - m) + "," + y + " Z", fill: "var(--ink)", stroke: "var(--surface)", "stroke-width": 2 }));
    gg.appendChild(el("text", { x: W - 4, y: y + 4, "text-anchor": "end", fill: "var(--ink-2)", "font-size": 11.5, "font-weight": focus ? 650 : 400 },
      pct(sh(o, "tot")) + " · " + (r.off == null ? t("na") : nf(r.off * 100, 0) + "%")));
    const cell = a => fM(a) + " <span class='tipnote'>(" + pct(a / o.e * 100) + ")</span>";
    const tipHtml = () => tipTable(name + " · " + CURL, [
      [t("lgOciDebt"), cell(o.debt)], [t("tipOciIns"), cell(o.s.oci_ins_finance)], [t("tipOciReins"), cell(o.s.oci_reins_finance)],
      [t("lgOciEq"), cell(o.eq)], [t("lgOciRest"), cell(o.rest)], ["<b>" + t("lgOciNet") + "</b>", "<b>" + cell(o.tot) + "</b>"],
      [t("ndEqOpen"), fM(o.e)], [t("tipOffset"), r.off == null ? t("na") : fP(r.off)],
      ...(r.p ? [[t("lgOciNet") + " " + esc(CMPL), pct(sh(r.p, "tot"))]] : [])]) + "<div class='tipnote'>" + t("tipAmounts", { cur: CURL }) + "</div>";
    const hit = el("rect", { x: 0, y: y - step / 2, width: W, height: step, fill: "transparent" }); hover(hit, tipHtml); gg.appendChild(hit);
    svg.appendChild(gg);
  });
  $("#ociSub").textContent = t("ociSub", { cur: CURL, n: cos.length });
  $$(".oci-prior").forEach(e => e.style.display = cos.some(r => r.p) ? "" : "none");
}

/* ---------- 6 bridge ---------- */
function bridge() {
  const svg = $("#br"); svg.textContent = "";
  const W = 900, L = 140, R = 78, T = 34, step = 31, B = 20, H = T + COS.length * step + B;
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  const lo = -30, hi = 70;
  const px = v => L + (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo) * (W - L - R);
  const parts = [["ism_net", "var(--c1)", "lgIsr"], ["inv_margin", "var(--c2)", "lgInv"], ["other_ratio", "var(--c3)", "lgOther"], ["tax_ratio", "var(--c4)", "lgTax"]];
  for (let v = lo; v <= hi; v += 10) {
    svg.appendChild(el("line", { x1: px(v), x2: px(v), y1: T - 12, y2: H - B + 4, stroke: v === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": v === 0 ? 1.5 : 1 }));
    svg.appendChild(el("text", { x: px(v), y: T - 18, "text-anchor": "middle", fill: "var(--muted)", "font-size": 11 }, (v > 0 ? "+" : "") + v + "%"));
  }
  const npmOf = c => g(c, "npm") ?? -Infinity;  // ordered by net-profit margin, highest first
  COS.slice().sort((a, b) => npmOf(b) - npmOf(a)).forEach((c, i) => {
    const y = T + i * step + step / 2, h = 14, gg = el("g");
    if (isF(c)) gg.appendChild(el("rect", { x: 4, y: y - step / 2 + 2, width: W - 8, height: step - 4, fill: "var(--focus-soft)", rx: 3 }));
    let cp = 0, cn = 0, clipped = false;
    const tipHtml = () => tipTable(c.name, [...parts.map(p => [t(p[2]), fP(g(c, p[0]))]), ["<b>" + t("lgNpm") + "</b>", "<b>" + fP(g(c, "npm")) + "</b>"],
      [t("tipRev"), fM(raw(c, "insurance_revenue")) + " " + t("m")]]);
    parts.forEach(([k, col]) => {
      const v = g(c, k) * 100; if (Math.abs(v) < 0.05) return;
      let x1, x2;
      if (v > 0) { x1 = px(cp); x2 = px(cp + v); cp += v; } else { x1 = px(cn + v); x2 = px(cn); cn += v; }
      if (cp > hi || cn < lo) clipped = true;
      const w = Math.max(0, x2 - x1 - 2); if (w <= 0) return;
      gg.appendChild(el("rect", { x: x1 + 1, y: y - h / 2, width: w, height: h, fill: col, rx: 2 }));
    });
    gg.appendChild(el("text", { x: L - 12, y: y + 4, "text-anchor": "end", "font-size": 12.5, fill: "var(--ink)", "font-weight": isF(c) ? 650 : 400 }, c.name));
    const mx = px(g(c, "npm") * 100), m = 6.5;
    gg.appendChild(el("path", { d: "M" + mx + "," + (y - m) + " L" + (mx + m) + "," + y + " L" + mx + "," + (y + m) + " L" + (mx - m) + "," + y + " Z", fill: "var(--ink)", stroke: "var(--surface)", "stroke-width": 2 }));
    gg.appendChild(el("text", { x: W - R + 24, y: y + 4, fill: "var(--ink-2)", "font-size": 11.5 }, fP(g(c, "npm"))));
    if (clipped) gg.appendChild(el("text", { x: W - R + 4, y: y + 4, fill: "var(--ink-2)", "font-size": 13, "font-weight": 700 }, "››"));
    const hit = el("rect", { x: 0, y: y - step / 2, width: W, height: step, fill: "transparent" }); hover(hit, tipHtml); gg.appendChild(hit);
    svg.appendChild(gg);
  });
}

/* ---------- 7 table ---------- */
const COLS = [
  ["insurance_revenue", "growth"], ["net_profit", "growth"], ["ism_gross", "pp"], ["npm", "pp"], ["csm_close", "growth"], ["csm_growth", "pp"],
  ["release_ratio", "pp"], ["nb_to_release", "x"], ["nb_csm", "growth"], ["nb_csm_margin", "pp"], ["acq_cost_ratio", "pp"], ["onerous_ratio", "pp"]];
let VIEW = "cur", SORT = { k: "insurance_revenue", dir: -1 };
function cellVal(c, k, kind) {
  if (VIEW === "cur") return g(c, k);
  if (VIEW === "cmp") return g(c, k, CMP);
  const a = g(c, k), b = g(c, k, CMP);
  if (a == null || b == null) return null;
  return kind === "growth" ? growth(a, b) : a - b;
}
function cellTxt(k, kind, v) {
  if (v == null) return t("nm");
  if (VIEW !== "chg") return fmtU(DEF[k].unit, v);
  if (kind === "growth") return (v >= 0 ? "+" : "") + nf(v * 100, 1) + "%";
  if (kind === "pp") return (v >= 0 ? "+" : "") + nf(v * 100, 1) + " " + t("pp");
  return (v >= 0 ? "+" : "") + nf(v, 2) + "×";
}
function table() {
  const seg = $("#viewSeg");
  if (!seg.childElementCount) {
    ["cur", "cmp", "chg"].forEach(id => {
      const b = document.createElement("button"); b.type = "button"; b.dataset.v = id;
      b.addEventListener("click", () => { VIEW = id; table(); }); seg.appendChild(b);
    });
    $("#dlBtn").addEventListener("click", downloadCsv);
  }
  seg.setAttribute("aria-label", t("tableView"));
  seg.querySelectorAll("button").forEach(b => { b.textContent = b.dataset.v === "cur" ? CURL : b.dataset.v === "cmp" ? CMPL : t("viewChange"); b.setAttribute("aria-pressed", b.dataset.v === VIEW); });
  const rows = COS.slice().sort((a, b) => {
    if (SORT.k === "name") return SORT.dir * a.name.localeCompare(b.name);
    const kind = (COLS.find(x => x[0] === SORT.k) || [])[1];
    const va = cellVal(a, SORT.k, kind), vb = cellVal(b, SORT.k, kind);
    return (va == null) - (vb == null) || SORT.dir * ((va ?? 0) - (vb ?? 0));
  });
  const arr = k => SORT.k === k ? (SORT.dir < 0 ? "▼" : "▲") : "";
  let h = "<thead><tr><th class='l sortable' data-k='name'>" + t("insurer") + " <span class='arr'>" + arr("name") + "</span></th><th class='l' title='" + esc(t("raSplitTitle")) + "'>" + t("raSplit") + "</th>" +
    COLS.map(([k]) => "<th class='sortable' data-k='" + k + "' title='" + esc(mFormula(k)) + "'>" + esc(t("cols")[k] + (QTR && k === "release_ratio" ? t("ann") : "")) + " <span class='arr'>" + arr(k) + "</span></th>").join("") + "</tr></thead><tbody>";
  const defaultOrder = SORT.k === "insurance_revenue" && SORT.dir < 0 && VIEW === "cur";
  rows.forEach((c, i) => {
    const cls = [isF(c) ? "focus" : "", defaultOrder && i > 0 && c.tier !== rows[i - 1].tier ? "tier-break" : ""].join(" ");
    h += "<tr class='" + cls + "'><td class='l'>" + esc(c.name) + (isF(c) ? "<span class='flag'>" + t("focusFlag") + "</span>" : "") + "</td><td class='l'>" + (c.ra === "disaggregated" ? t("raYes") : t("raNo")) + "</td>" +
      COLS.map(([k, kind]) => "<td>" + cellTxt(k, kind, cellVal(c, k, kind)) + "</td>").join("") + "</tr>";
  });
  const aggLab = VIEW === "chg" && LFL ? t("industryAggCommon", { k: M.common_n }) : t("industryAgg");
  h += "<tr><td class='l'><b>" + esc(aggLab) + "</b></td><td class='l'></td>" + COLS.map(([k, kind]) => {
    const a = ind(k, CUR).agg, b = ind(k, CMP).agg, ac = indC(k, CUR).agg, bc = indC(k, CMP).agg;
    const v = VIEW === "cur" ? a : VIEW === "cmp" ? b : (ac == null || bc == null ? null : kind === "growth" ? growth(ac, bc) : ac - bc);
    return "<td><b>" + cellTxt(k, kind, v) + "</b></td>";
  }).join("") + "</tr></tbody>";
  const tb = $("#all"); tb.innerHTML = h;
  if (QTR) $("#s-all .sec-note").innerHTML = t("noteAll") + t("noteAllQ", { k: LFL ? M.common_n : COS.length });
  tb.querySelectorAll("th.sortable").forEach(th => th.addEventListener("click", () => {
    const k = th.dataset.k; SORT = SORT.k === k ? { k, dir: -SORT.dir } : { k, dir: k === "name" ? 1 : -1 }; table();
  }));
}
function downloadCsv() {
  const codes = DATA.metric_defs.map(d => d.code);
  const lines = [["company", "fiscal_year", "ra_policy", ...codes].join(",")];
  COS.forEach(c => DATA.years.forEach(fy => { if (c.y[fy]) lines.push(['"' + c.name + '"', fy, c.ra, ...codes.map(k => g(c, k, fy) ?? "")].join(",")); }));
  const blob = new Blob([lines.join("\n")], { type: "text/csv" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = t("csvName", { cur: CUR });
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- 9 data quality ---------- */
function dataQuality() {
  const defs = DATA.check_defs;
  let total = 0, ok = 0, nAcc = 0, nNa = 0;
  let h = "<thead><tr><th class='l'>" + t("insurer") + "</th>" + DATA.years.map(fy => defs.map(d => "<th title='" + esc(chk(d.id, "label")) + "'>" + esc(chk(d.id, "short")) + "<br>" + esc(fyL(fy)) + "</th>").join("")).join("") + "<th>" + t("dqFlags") + "</th></tr></thead><tbody>";
  COS.forEach(c => {
    h += "<tr class='" + (isF(c) ? "focus" : "") + "'><td class='l'>" + esc(c.name) + "</td>" + DATA.years.map(fy => defs.map(d => {
      const r = ((DATA.checks[c.name] || {})[fy] || {})[d.id];
      if (!r) return "<td>–</td>";
      total++; if (r.ok) ok++;
      if (r.status === "ACCEPTED") { nAcc++; return "<td class='ok' title='" + esc(t("dqAccepted", { v: nf(r.diff, 3), r: r.reason || "" })) + "'>✓*</td>"; }
      if (r.status === "N/A") { nNa++; return "<td title='" + esc(t("dqNa")) + "'>" + t("na") + "</td>"; }
      return "<td class='" + (r.ok ? "ok" : "fail") + "' title='" + esc(t("diff", { v: nf(r.diff, 3) })) + "'>" + (r.ok ? "✓" : "✗") + "</td>";
    }).join("")).join("") + "<td>" + (DATA.flags.filter(f => f.company === c.name).length || "") + "</td></tr>";
  });
  $("#dq").innerHTML = h + "</tbody>";
  $("#dqNote").innerHTML = t(QTR ? "dqNoteQ" : "dqNote", { ok, total, tol: M.tolerance_thb_m, n: COS.length, y: DATA.years.length, c: defs.length }) +
    (nAcc ? t("dqNoteAcc", { a: nAcc }) : "") + (nNa ? t("dqNoteNa", { na: nNa }) : "");
  $("#flags").innerHTML = DATA.flags.map(f => "<li><b>" + esc(f.company) + "</b> " + esc(fyL(f.fiscal_year)) + ": " + esc(flagMsg(f)) + "</li>").join("") || "<li>" + t("none") + "</li>";
}

})();
