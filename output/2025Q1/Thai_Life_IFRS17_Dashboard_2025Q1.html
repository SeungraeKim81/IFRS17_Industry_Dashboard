<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thai life insurance industry — IFRS 17 dashboard</title>
<meta name="description" content="TFRS 17 (IFRS 17) figures and indicators for 19 Thai life insurers, 2025Q1, highlighting Samsung Life.">
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  color-scheme:light;
  --plane:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --hair:rgba(11,11,11,.10);
  --peer:#2a78d6; --focus:#eb6834; --focus-soft:rgba(235,104,52,.13);
  --c1:#2a78d6; --c2:#1baf7a; --c3:#eda100; --c4:#6250d6;
  --pos:#2a78d6; --neg:#e34948; --total:#898781;
  --good:#006300; --bad:#d03b3b; --neutral-mid:#f0efec;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --plane:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --hair:rgba(255,255,255,.10);
  --peer:#3987e5; --focus:#d95926; --focus-soft:rgba(217,89,38,.20);
  --c1:#3987e5; --c2:#199e70; --c3:#c98500; --c4:#9085e9;
  --pos:#3987e5; --neg:#e66767; --total:#898781;
  --good:#0ca30c; --bad:#e66767; --neutral-mid:#383835;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --plane:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --hair:rgba(255,255,255,.10);
  --peer:#3987e5; --focus:#d95926; --focus-soft:rgba(217,89,38,.20);
  --c1:#3987e5; --c2:#199e70; --c3:#c98500; --c4:#9085e9;
  --pos:#3987e5; --neg:#e66767; --total:#898781;
  --good:#0ca30c; --bad:#e66767; --neutral-mid:#383835;
}
*{box-sizing:border-box}
/* one line length for all running text, about the width of the charts. In rem, not ch: ch is the width
   of the digit 0, about half a Korean character, so ch-based widths wrapped Korean text early. */
:root{--measure:60rem}
html,body{margin:0}
body{background:var(--plane);color:var(--ink);font:400 15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  -webkit-font-smoothing:antialiased;padding:32px 16px 64px}
.wrap{max-width:1180px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-start;justify-content:space-between}
.top-text{flex:1 1 560px;min-width:0}
h1{font-weight:650;font-size:28px;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em;text-wrap:balance}
.lede{color:var(--ink-2);max-width:var(--measure);margin:0}
.units{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:10px}
nav.periods{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-top:8px;font-size:13px}
nav.periods .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
nav.periods a{color:var(--ink-2)}
nav.periods a[aria-current="page"]{color:var(--ink);font-weight:650;text-decoration:none}
.controls{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.lang-pick{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.lang-pick .seg button{text-transform:none;letter-spacing:0}
:lang(ko) body{word-break:keep-all;overflow-wrap:anywhere}
:lang(ko) .units,:lang(ko) nav.periods .lab,:lang(ko) .lang-pick,:lang(ko) .focus-pick,:lang(ko) .panel h3,:lang(ko) table.data th{letter-spacing:0}
@media(max-width:620px){.controls{align-items:stretch;width:100%}.lang-pick{justify-content:space-between}}
.focus-pick{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.focus-pick select{font:inherit;font-size:15px;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--surface);
  border:1px solid var(--axis);border-radius:6px;padding:7px 10px;min-width:220px}
nav.toc{display:flex;flex-wrap:wrap;gap:6px 18px;margin:22px 0 0;padding:10px 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);font-size:13px}
nav.toc a{color:var(--ink-2);text-decoration:none}
nav.toc a:hover{color:var(--ink);text-decoration:underline}
section{margin-top:44px;scroll-margin-top:12px}
h2{font-weight:650;font-size:20px;margin:0;letter-spacing:-.005em}
.sec-note{color:var(--ink-2);font-size:14px;max-width:var(--measure);margin:6px 0 16px}
.panel{background:var(--surface);border:1px solid var(--hair);border-radius:8px;padding:16px}
.panel h3{margin:0;font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.panel .sub{font-size:12px;color:var(--muted);margin:3px 0 10px}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:860px){.panels{grid-template-columns:1fr}}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
.num{font-variant-numeric:tabular-nums}
.legend{display:flex;gap:8px 18px;align-items:center;flex-wrap:wrap;margin:12px 0 0;font-size:13px;color:var(--ink-2)}
.key{display:inline-flex;align-items:center;gap:7px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.sq{width:12px;height:10px;border-radius:2px;display:inline-block}
/* focus summary */
.focus-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:12px}
.focus-name{font-size:22px;font-weight:650}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--hair);color:var(--ink-2);background:var(--surface)}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.tiles + .tiles{margin-top:12px}
@media(max-width:1000px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.tiles{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.tiles{grid-template-columns:1fr}}
.tile{background:var(--surface);border:1px solid var(--hair);border-radius:8px;padding:13px 14px 12px;border-top:3px solid var(--focus)}
.tile .lab{font-size:13px;color:var(--ink-2)}
.tile .val{font-size:26px;font-weight:620;line-height:1.25;margin-top:2px}
.tile .delta{font-size:13px;margin-top:2px}
.tile .ctx{font-size:12px;color:var(--muted);margin-top:4px}
.up-good,.down-good{color:var(--good)} .up-bad,.down-bad{color:var(--bad)} .flat{color:var(--ink-2)}
.headlines{margin:16px 0 0;padding:0 0 0 18px;color:var(--ink);max-width:var(--measure)}
.headlines li{margin:4px 0}
.callouts{margin-top:14px;display:grid;gap:8px}
.callout{font-size:13.5px;color:var(--ink-2);border-left:3px solid var(--axis);padding:4px 0 4px 12px}
.callout b{color:var(--ink)}
/* bar table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--hair);border-radius:8px;background:var(--surface)}
table.data{border-collapse:collapse;width:100%;font-size:13px}
table.data th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:550;text-align:right;
  padding:10px 8px;border-bottom:1px solid var(--axis);white-space:nowrap;vertical-align:bottom}
table.data th.l,table.data td.l{text-align:left}
table.data td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap;font-variant-numeric:tabular-nums}
table.data tr:last-child td{border-bottom:0}
table.data tr.focus td{background:var(--focus-soft)}
table.data tr.focus td.l{font-weight:600}
table.data tr.tier-break td{border-top:2px solid var(--axis)}
table#all th{white-space:normal;line-height:1.3}
table.data th.sortable{cursor:pointer;user-select:none}
table.data th.sortable:hover{color:var(--ink)}
table.data th .arr{display:inline-block;width:10px;color:var(--ink-2)}
.barcell{display:flex;align-items:center;gap:8px;justify-content:flex-end;min-width:200px}
.barcell .track{flex:1;height:10px;position:relative}
.barcell .fill{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--peer);opacity:.75}
tr.focus .barcell .fill{background:var(--focus);opacity:1}
.barcell .v{min-width:56px}
.barcell .s{min-width:44px;color:var(--muted)}
.flag{display:inline-block;font-size:10.5px;padding:0 5px;border-radius:3px;border:1px solid var(--hair);color:var(--ink-2);margin-left:6px;font-weight:400}
.tbl-tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px;font-size:13px;color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--axis);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:var(--surface);color:var(--ink-2);padding:5px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--axis)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
button.dl{font:inherit;font-size:13px;border:1px solid var(--axis);background:var(--surface);color:var(--ink);border-radius:6px;padding:5px 12px;cursor:pointer}
.ok{color:var(--good)} .fail{color:var(--bad);font-weight:700}
.notes{font-size:13.5px;color:var(--ink-2);max-width:var(--measure)}
.notes h4{color:var(--ink);font-size:14px;margin:18px 0 4px}
.notes p{margin:0 0 8px}
details:not(.sec-fold){border-top:1px solid var(--grid);padding:6px 0}
details:not(.sec-fold) summary{cursor:pointer;color:var(--ink);font-size:13.5px}
details:not(.sec-fold) p{margin:6px 0 4px;font-size:13px;color:var(--ink-2)}
/* a section that opens on request: its heading is the summary */
.sec-fold>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:8px}
.sec-fold>summary::-webkit-details-marker{display:none}
.sec-fold>summary::before{content:"\25B8";color:var(--muted);font-size:16px;display:inline-block;transition:transform .15s}
.sec-fold[open]>summary::before{transform:rotate(90deg)}
.sec-fold>summary:hover h2{text-decoration:underline;text-decoration-color:var(--axis)}
ul.flags{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2)}
footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--hair);font-size:12px;color:var(--muted)}
.tip{position:fixed;pointer-events:none;z-index:9;background:var(--surface);color:var(--ink);border:1px solid var(--hair);border-radius:6px;
  padding:9px 11px;font-size:12.5px;box-shadow:0 6px 22px rgba(0,0,0,.16);opacity:0;transition:opacity .1s;max-width:290px}
.tip b{font-size:13.5px;display:block;margin-bottom:5px}
.tip table{border-collapse:collapse;width:100%}
.tip td{padding:1px 0;font-size:12px;white-space:nowrap}
.tip td:last-child{text-align:right;padding-left:16px;font-variant-numeric:tabular-nums}
@media print{body{padding:0}.controls,nav.toc,.tbl-tools button{display:none}.tile,.panel{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="top-text">
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <div class="units" id="units"></div>
    <nav class="periods" id="periods"></nav>
  </div>
  <div class="controls">
    <div class="lang-pick"><span data-t="langLabel"></span>
      <div class="seg" role="group" id="langSeg"></div>
    </div>
    <label class="focus-pick"><span data-t="focusPick"></span>
      <select id="focusSel"></select>
    </label>
  </div>
</header>
<nav class="toc" id="toc"></nav>

<section id="s-focus">
  <div class="focus-head"><span class="focus-name" id="fName"></span><span id="fChips"></span></div>
  <div class="tiles" id="tiles1"></div>
  <div class="tiles" id="tiles2"></div>
  <ul class="headlines" id="headlines"></ul>
  <div class="callouts" id="callouts"></div>
</section>

<section id="s-market">
  <h2 data-t="h2market"></h2>
  <p class="sec-note" data-t="noteMarket"></p>
  <div class="tbl-wrap"><table class="data" id="mkt"></table></div>
</section>

<section id="s-csm">
  <h2 data-t="h2csm"></h2>
  <p class="sec-note" data-t="noteCsm"></p>
  <div class="panel"><h3 data-t="h3wf"></h3><div class="sub" id="wfSub"></div>
    <svg id="wf" viewBox="0 0 900 320" role="img" data-t-aria="ariaWf"></svg>
    <div class="legend">
      <span class="key"><i class="sq" style="background:var(--total)"></i><span data-t="lgOpenClose"></span></span>
      <span class="key"><i class="sq" style="background:var(--pos)"></i><span data-t="lgIncrease"></span></span>
      <span class="key"><i class="sq" style="background:var(--neg)"></i><span data-t="lgDecrease"></span></span>
    </div>
  </div>
  <div class="panel" style="margin-top:20px"><h3 data-t="h3quad"></h3><div class="sub" id="qSub"></div>
    <svg id="quad" viewBox="0 0 900 470" role="img" data-t-aria="ariaQuad"></svg>
    <div class="legend">
      <span class="key"><i class="dot" style="background:var(--focus)"></i><span class="f-name"></span></span>
      <span class="key"><i class="dot" style="background:var(--peer)"></i><span data-t="lgOthers"></span></span>
      <span class="key" style="color:var(--muted)">&#9650;&nbsp;&#9654;&nbsp;<span data-t="lgCeiling"></span></span>
      <span class="key" style="color:var(--muted)" data-t="lgBubble"></span>
    </div>
  </div>
</section>

<section id="s-nb">
  <h2 data-t="h2nb"></h2>
  <p class="sec-note" data-t="noteNb"></p>
  <div class="panel"><svg id="strips" viewBox="0 0 900 380" role="img" data-t-aria="ariaStrips"></svg>
    <div class="legend">
      <span class="key"><i class="dot" style="background:var(--focus)"></i><span class="f-name"></span> <span class="p-cur"></span></span>
      <span class="key"><i class="dot" style="border:2px solid var(--focus);background:transparent"></i><span class="f-name"></span> <span class="p-cmp"></span></span>
      <span class="key"><i class="dot" style="background:var(--peer);opacity:.6"></i><span data-t="lgOthers"></span></span>
      <span class="key"><i class="sq" style="width:2px;height:12px;background:var(--ink-2)"></i><span data-t="lgMedian"></span></span>
    </div>
  </div>
</section>

<section id="s-ism">
  <h2 data-t="h2ism"></h2>
  <p class="sec-note" data-t="noteIsmDef" style="margin-bottom:6px"></p>
  <p class="sec-note" data-t="noteIsm"></p>
  <div class="panels">
    <div class="panel"><h3 data-t="h3dis"></h3><div class="sub" id="m1sub"></div><svg id="m1" viewBox="0 0 520 330" role="img" data-t-aria="h3dis"></svg></div>
    <div class="panel"><h3 data-t="h3not"></h3><div class="sub" id="m2sub"></div><svg id="m2" viewBox="0 0 520 330" role="img" data-t-aria="h3not"></svg></div>
  </div>
</section>

<section id="s-bridge">
  <h2 data-t="h2bridge"></h2>
  <p class="sec-note" data-t="noteBridge"></p>
  <div class="panel"><svg id="br" viewBox="0 0 900 640" role="img" data-t-aria="ariaBridge"></svg>
    <div class="legend">
      <span class="key"><i class="sq" style="background:var(--c1)"></i><span data-t="lgIsr"></span></span>
      <span class="key"><i class="sq" style="background:var(--c2)"></i><span data-t="lgInv"></span></span>
      <span class="key"><i class="sq" style="background:var(--c3)"></i><span data-t="lgOther"></span></span>
      <span class="key"><i class="sq" style="background:var(--c4)"></i><span data-t="lgTax"></span></span>
      <span class="key">&#9670;&nbsp;<span data-t="lgNpm"></span></span>
      <span class="key" style="color:var(--muted)">&rsaquo;&rsaquo;&nbsp;<span data-t="lgClipped"></span></span>
    </div>
  </div>
</section>

<section id="s-all">
  <h2 data-t="h2all"></h2>
  <p class="sec-note" data-t="noteAll"></p>
  <div class="tbl-tools">
    <div class="seg" role="group" id="viewSeg"></div>
    <button class="dl" id="dlBtn" type="button" data-t="download"></button>
  </div>
  <div class="tbl-wrap"><table class="data" id="all"></table></div>
</section>

<section id="s-dq"><details class="sec-fold">
  <summary><h2 data-t="h2dq"></h2></summary>
  <p class="sec-note" id="dqNote"></p>
  <div class="tbl-wrap"><table class="data" id="dq"></table></div>
  <div class="notes" style="margin-top:16px"><h4 data-t="h4flags"></h4>
    <p data-t="noteFlags"></p>
    <ul class="flags" id="flags"></ul></div>
</details></section>

<section id="s-method"><details class="sec-fold">
  <summary><h2 data-t="h2method"></h2></summary>
  <div class="notes" id="commentary"></div>
  <div class="notes"><h4 data-t="h4defs"></h4></div>
  <div class="tbl-wrap" style="margin-top:8px"><table class="data" id="defs"></table></div>
  <div class="notes" id="extract"></div>
</details></section>

<footer id="foot"></footer>
</div>

fect of discount-rate movements, in the insurance service result. Service margins are therefore compared only within each policy group. Restating to a common basis would need the P&L/OCI split of the RA finance effect, which the statements do not disclose, so no restated margin is shown. Net profit is not affected by the choice."},{"id":"release_ratio","title":"Reading the CSM quadrant","companies":[],"body":"A release ratio of roughly 8-13% is the normal run-off pace for a stable book. Far above it, the store is drawn down quickly relative to what remains; far below it, the runway is long. New business below 1.0x the release for more than a year or two is the early warning on future earnings."}],"i18n":{"ko":{"meta":{"title":"태국 생명보험업계 IFRS 17 대시보드","market":"태국 · 생명보험","standard":"TFRS 17 (IFRS 17)","period_end":"2025년 3월 31일 (불기 2568년)","unit":"백만 바트","quarterly_caveat":"분기 수치는 검토(감사 아님)를 받은 요약 중간재무제표의 누적(연초부터) 값이다. CSM 변동표와 신계약은 1월 1일부터의 누적이고, CSM 상각률은 연간 값과 같은 척도로 읽히도록 연환산(× 12 ÷ 경과월수)했다. 비교기간은 전년 중간재무제표의 같은 기간이다. 2025년 분기는 2024년 분기를 추출하지 않아 비교기간이 없다. 업계 변동은 두 기간에 모두 있는 보험사끼리만 계산했다. 어느 기간의 중간재무제표를 받지 못한 보험사는 그 기간에서 빠진다.","comparative_caveat":"분기 수치는 검토(감사 아님)를 받은 요약 중간재무제표의 누적(연초부터) 값이다. CSM 변동표와 신계약은 1월 1일부터의 누적이고, CSM 상각률은 연간 값과 같은 척도로 읽히도록 연환산(× 12 ÷ 경과월수)했다. 비교기간은 전년 중간재무제표의 같은 기간이다. 2025년 분기는 2024년 분기를 추출하지 않아 비교기간이 없다. 업계 변동은 두 기간에 모두 있는 보험사끼리만 계산했다. 어느 기간의 중간재무제표를 받지 못한 보험사는 그 기간에서 빠진다."},"groups":{"scale":"규모","profitability":"수익성","csm":"CSM","new_business":"신계약"},"metrics":{"insurance_revenue":{"label":"보험수익","formula":"보험수익 합계"},"net_profit":{"label":"당기순이익","formula":"당기순이익"},"csm_close":{"label":"기말 CSM","formula":"기말 보험계약마진(CSM)"},"nb_csm":{"label":"신계약 CSM","formula":"당기에 최초 인식한 계약에서 발생한 CSM"},"nb_pv_premium":{"label":"신계약 PV 보험료","formula":"신계약 미래 현금유입의 현재가치"},"isr_gross":{"label":"보험서비스결과","formula":"보험수익 + 보험서비스비용"},"ism_gross":{"label":"보험서비스이익률","formula":"(보험수익 + 보험서비스비용) ÷ 보험수익"},"ism_net":{"label":"재보험 후 보험서비스이익률","formula":"(보험서비스결과 + 재보험손익) ÷ 보험수익"},"inv_margin":{"label":"투자손익(보험금융비용 차감 후)","formula":"(순투자수익 + 순보험금융비용) ÷ 보험수익"},"other_ratio":{"label":"기타비용(순)","formula":"(기타비용 + 기타수익) ÷ 보험수익"},"tax_ratio":{"label":"법인세","formula":"법인세 ÷ 보험수익"},"npm":{"label":"순이익률","formula":"당기순이익 ÷ 보험수익"},"current_loss_ratio":{"label":"당기 서비스 손해율","formula":"−(발생사고 + 과거서비스 관련 변동) ÷ (BEL 해제 + RA 해제 + PAA 보험수익 + 기타 보험수익 + 보험취득현금흐름 회수)"},"csm_release_share":{"label":"보험수익 중 CSM 상각 비중","formula":"CSM 상각 ÷ 보험수익"},"csm_growth":{"label":"CSM 증가율","formula":"기말 CSM ÷ 기초 CSM − 1"},"csm_release_amount":{"label":"CSM 상각","formula":"서비스 제공에 따라 당기손익으로 인식한 CSM (양수로 표시)"},"release_ratio":{"label":"CSM 상각률","formula":"CSM 상각 ÷ (기초 CSM + 신계약 + 이자부리 + 미래서비스 관련 변동). 분기 페이지는 연환산(× 12 ÷ 경과월수)"},"nb_to_release":{"label":"신계약 CSM ÷ 상각","formula":"신계약 CSM ÷ CSM 상각"},"nb_csm_margin":{"label":"신계약 CSM 마진율","formula":"신계약 CSM ÷ 신계약 PV 보험료"},"acq_cost_ratio":{"label":"신계약비용률","formula":"신계약 PV 보험취득현금흐름 ÷ 신계약 PV 보험료"},"nb_claims_ratio":{"label":"신계약 보험금·급부 비율","formula":"신계약 PV 보험금 유출 ÷ 신계약 PV 보험료"},"onerous_ratio":{"label":"신계약 손실부담 비율","formula":"신계약 손실요소 ÷ 신계약 CSM"},"rev_share":{"label":"보험수익 점유율","formula":"회사 보험수익 ÷ 대상 보험사 전체 합계"},"csm_share":{"label":"기말 CSM 점유율","formula":"회사 기말 CSM ÷ 대상 보험사 전체 합계"},"nb_csm_share":{"label":"신계약 CSM 점유율","formula":"회사 신계약 CSM ÷ 대상 보험사 전체 합계"}},"checks":{"revenue_split":{"label":"보험수익 구성 합계 = 보험수익 총액","short":"수익"},"expense_split":{"label":"비용 구성 합계 = 보험서비스비용 총액","short":"비용"},"net_profit":{"label":"순이익 브리지 = 공시 당기순이익","short":"순이익"},"csm_rollforward":{"label":"CSM 변동표 = 기말 CSM","short":"CSM 변동"},"nb_csm":{"label":"신계약: PV 유입 − 취득비용 − 보험금 − RA + 손실요소 = CSM","short":"신계약 CSM"},"nb_consistency":{"label":"CSM 변동표의 신계약 = 신계약 주석","short":"신계약 일치"}},"commentary":{"ra_policy":{"title":"위험조정(RA) 분리 여부에 따라 이익률 비교가 제한된다","body":"위험조정 변동을 보험서비스결과와 보험금융손익으로 나누지 않는 보험사는 할인율 변동 효과를 포함한 RA 변동 전체를 보험서비스결과에 반영한다. 그래서 보험서비스이익률은 같은 정책 그룹 안에서만 비교한다. 공통 기준으로 재계산하려면 RA 금융효과의 당기손익/기타포괄손익 구분이 필요한데 재무제표에 공시되지 않으므로, 재계산한 이익률은 보여 주지 않는다. 당기순이익은 이 선택의 영향을 받지 않는다."},"transition":{"title":"FY2024 수치는 전환 비교기간 수치다","body":"TFRS 17은 2025년 1월 1일 시행, 전환일은 2024년 1월 1일이다. FY2024 수치는 FY2025 재무제표에 재작성되어 실린 비교기간 수치이며, 보험사별로 선택한 전환 방법이 FY2024 CSM에 영향을 준다. 전년 대비 변동을 표시하지만, 큰 변동은 실적보다 전환 방식에서 비롯될 수 있다."},"chubb_rabbit":{"title":"CHUBB와 Rabbit Life는 신계약 대체 배수 눈금 밖에 있다","body":"두 회사 모두 FY2024 전환 비교기간에 손실부담계약 비용을 크게 인식해 CSM과 FY2025 상각액이 작다. 분모가 작아 신계약 CSM ÷ 상각 배수가 부풀려지므로, 사분면에서의 위치는 신계약이 특별히 강해서가 아니라 전환 방식의 결과로 읽어야 한다."},"t_life_accretion":{"title":"T Life의 FY2025 CSM 이자부리는 음수다","body":"양(+)의 CSM에 최초 인식 시점 이율로 부리하는 이자는 양수여야 한다. 다른 변동이 해당 행에 상계되어 있을 가능성이 크다. 공시된 그대로 CSM 변동표가 정확히 맞으므로 수정하지 않고 반영했다."},"rabbit_scale":{"title":"Rabbit Life는 보험수익 대비 비율의 의미가 약하다","body":"보험 영업 규모에 비해 투자 자산이 매우 커서, 투자손익과 기타비용이 이익 브리지 눈금을 크게 벗어난다. 막대는 축에서 잘라 표시했고, 순이익률은 실제 값이다."},"release_ratio":{"title":"CSM 사분면 읽는 법","body":"CSM 상각률이 대략 8~13%이면 안정적인 보유계약의 일반적인 상각 속도다. 그보다 훨씬 높으면 남은 CSM 대비 빠르게 소진되는 것이고, 훨씬 낮으면 이익 실현 기간이 길다는 뜻이다. 신계약 CSM이 상각액의 1.0배에 못 미치는 상태가 1~2년 넘게 이어지면 미래 이익에 대한 조기 경고 신호다."}},"notes_language_label":"추출 메모는 추출 규격에 기록한 영문 원문 그대로 표시한다."}}}</script>

function niceTicks(lo, hi, n = 5) {
  const span = hi - lo, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => span / s <= n) || 10 * mag;

}

function deltaHtml(kind, cur, prev, better) {
  if (cur == null || prev == null) return '<span class="flat">' + t("noCmp") + "</span>";
  let d, txt;
  if (kind === "growth") { d = growth(cur, prev); if (d == null) return '<span class="flat">' + t("nmBase", { cmp: CMPL }) + "</span>"; txt = (d >= 0 ? "+" : "") + nf(d * 100, 1) + "%"; }
  else if (kind === "pp") { d = cur - prev; txt = (d >= 0 ? "+" : "") + nf(d * 100, 1) + " " + t("pp"); }
  else { d = cur - prev; txt = (d >= 0 ? "+" : "") + nf(d, 2) + "×"; }
  const dir = Math.abs(d) < 1e-9 ? "flat" : d > 0 ? "up" : "down";
  const cls = dir === "flat" || better == null ? "flat" : ((dir === "up") === better ? dir + "-good" : dir + "-bad");
  const arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "◆";
  return '<span class="' + cls + '">' + arrow + " " + txt + '</span> <span class="flat">' + t("vs", { cmp: CMPL }) + "</span>";
}

function waterfall() {
  const svg = $("#wf"); svg.textContent = "";

  const series = [

  ].map(s => {
    const o = s.val("csm_open"); let run = 0;
    s.bars = keys.map((k, i) => {
      const v = s.val(k) / o * 100, lab = labs[i];
      if (i === 0 || i === keys.length - 1) { run = v; return { lab, v, y0: 0, y1: v, total: true, abs: s.val(k) }; }
      const b = { lab, v, y0: run, y1: run + v, total: false, abs: s.val(k) }; run += v; return b;
    });
    return s;
  });
  const hi = Math.max(...series.flatMap(s => s.bars.map(b => Math.max(b.y0, b.y1)))) * 1.1;
  const W = 900, H = 320, T = 34, B = 46, gap = 40, pw = (W - gap) / 2, L = 40;

  const { ticks } = niceTicks(0, hi, 5);

    svg.appendChild(el("text", { x: x0 + L, y: 14, "font-size": 13, "font-weight": 600, fill: si === 0 ? "var(--ink)" : "var(--ink-2)" }, s.title));
    ticks.forEach(tk => {
      svg.appendChild(el("line", { x1: x0 + L, x2: x0 + pw, y1: py(tk), y2: py(tk), stroke: tk === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
      svg.appendChild(el("text", { x: x0 + L - 6, y: py(tk) + 4, "text-anchor": "end", "font-size": 10.5, fill: "var(--muted)" }, String(tk)));
    });
    s.bars.forEach((b, i) => {
      const cx = x0 + L + slot * i + slot / 2, top = py(Math.max(b.y0, b.y1)), bot = py(Math.min(b.y0, b.y1));
      const fill = b.total ? "var(--total)" : b.v >= 0 ? "var(--pos)" : "var(--neg)";
      const r = el("rect", { x: cx - bw / 2, y: top, width: bw, height: Math.max(1, bot - top), fill, rx: 3 });
      hover(r, tipTable(s.title, [[b.lab, fM(b.abs) + " " + t("m")], [t("tipIndex"), nf(b.v, 1)]]));
      svg.appendChild(r);
      if (i < s.bars.length - 1) { const yy = py(b.y1); svg.appendChild(el("line", { x1: cx + bw / 2, x2: cx + slot - bw / 2, y1: yy, y2: yy, stroke: "var(--axis)", "stroke-width": 1 })); }
      const lab = b.total ? nf(b.v, 0) : (b.v >= 0 ? "+" : "−") + nf(Math.abs(b.v), 1);
      svg.appendChild(el("text", { x: cx, y: top - 6, "text-anchor": "middle", "font-size": 11.5, fill: "var(--ink)", "font-weight": b.total ? 600 : 400 }, lab));
      b.lab.split(" ").forEach((w, wi) => svg.appendChild(el("text", { x: cx, y: H - B + 16 + wi * 13, "text-anchor": "middle", "font-size": 11, fill: "var(--ink-2)" }, w)));
    });
  });
}

// Approximate width of text at font size fs: a Korean character is about 1 em, others about 0.55 em.
const textW = (s, fs) => [...s].reduce((a, ch) => a + (/[\u1100-\u11ff\u3130-\u318f\uac00-\ud7a3]/.test(ch) ? 1 : 0.55) * fs, 0);

/* ---------- 3b quadrant ---------- */
function quadrant() {
  const svg = $("#quad"); svg.textContent = "";
  // axis limits: y at 3x; x at 30%, 1.5 times the top of the 5%-20% plausibility range. A point beyond
  // a limit sits on it with a marker and its true value, so one outlier cannot squeeze the others.
  const W = 900, H = 470, L = 56, R = 20, T = 20, B = 46, CAP = 3, XCAP = 30;
  const xs = COS.map(c => g(c, "release_ratio") * 100);
  const x1 = Math.min(XCAP, Math.max(25, Math.ceil(Math.max(...xs) / 5) * 5));
  const px = v => L + Math.min(v, x1) / x1 * (W - L - R), py = v => H - B - Math.min(v, CAP) / CAP * (H - T - B);
  const maxC = Math.max(...COS.map(c => raw(c, "csm_close")));
  const rad = v => 4.5 + 19 * Math.sqrt(v / maxC);
  $("#qSub").textContent = t("qSub", { cur: CURL, lo: fM(Math.min(...COS.map(c => raw(c, "csm_close")))), hi: fM(maxC) });
  for (let v = 0; v <= CAP; v += 0.5) {
    svg.appendChild(el("line", { x1: L, x2: W - R, y1: py(v), y2: py(v), stroke: "var(--grid)" }));
    svg.appendChild(el("text", { x: L - 9, y: py(v) + 4, "text-anchor": "end", fill: "var(--muted)", "font-size": 11 }, v.toFixed(1) + "×"));
  }
  for (let v = 0; v <= x1; v += 5) svg.appendChild(el("text", { x: px(v), y: H - B + 18, "text-anchor": "middle", fill: "var(--muted)", "font-size": 11 }, v + "%"));
  svg.appendChild(el("line", { x1: L, x2: W - R, y1: H - B, y2: H - B, stroke: "var(--axis)" }));
  svg.appendChild(el("line", { x1: L, x2: W - R, y1: py(1), y2: py(1), stroke: "var(--ink-2)", "stroke-width": 1.5, "stroke-dasharray": "5 4" }));
  svg.appendChild(el("text", { x: (L + W - R) / 2, y: H - 6, "text-anchor": "middle", fill: "var(--ink-2)", "font-size": 12 }, t(QTR ? "qXQ" : "qX")));
  svg.appendChild(el("text", { x: 0, y: 0, fill: "var(--ink-2)", "font-size": 12, "text-anchor": "middle", transform: "translate(13," + ((T + H - B) / 2) + ") rotate(-90)" }, t("qY")));

  const pts = COS.map(c => {
    const overY = g(c, "nb_to_release") > CAP, overX = g(c, "release_ratio") * 100 > x1;
    const extra = [overX ? fP(g(c, "release_ratio")) : null, overY ? fX(g(c, "nb_to_release"), 1) : null].filter(Boolean).join(" · ");
    return { c, x: px(g(c, "release_ratio") * 100), y: py(g(c, "nb_to_release")), rad: rad(raw(c, "csm_close")), over: overX || overY, overX, overY, extra, txt: c.short };
  })
    .sort((a, b) => (isF(b.c) - isF(a.c)) || (b.rad - a.rad));
  // the 1.0x label goes at the right end of its line, or the left end when a bubble sits there;
  // its box is reserved so that no insurer's label is placed over it
  const thTxt = t("qThreshold"), thW = textW(thTxt, 11) * 1.06, thY = py(1) - 7;
  const thBox = [{ x1: W - R - 4 - thW, x2: W - R - 4, anchor: "end", x: W - R - 4 }, { x1: L + 4, x2: L + 4 + thW, anchor: "start", x: L + 4 }]
    .map(b => Object.assign(b, { y1: thY - 11, y2: thY + 3 }))
    .find(b => !pts.some(q => q.x + q.rad > b.x1 && q.x - q.rad < b.x2 && q.y + q.rad > b.y1 && q.y - q.rad < b.y2)) ||
    { x1: W - R - 4 - thW, x2: W - R - 4, y1: thY - 11, y2: thY + 3, anchor: "end", x: W - R - 4 };
  svg.appendChild(el("text", { x: thBox.x, y: thY, "text-anchor": thBox.anchor, fill: "var(--ink-2)", "font-size": 11, "font-weight": 600 }, thTxt));
  const boxes = [thBox], LH = 13;
  const overlap = (a, b) => !(a.x2 < b.x1 || b.x2 < a.x1 || a.y2 < b.y1 || b.y2 < a.y1);
  pts.forEach(p => {
    const w = Math.max(p.txt.length * (isF(p.c) ? 7 : 6.2), p.over ? p.extra.length * 5.8 : 0), h = p.over ? LH + 11 : LH;
    let best = null;
    for (const side of [1, -1]) for (const dy of [0, -14, 14, -28, 28, -42, 42, -56, 56]) {
      const lx = p.x + side * (p.rad + 6), ly = p.y + 4 + dy;
      const bx1 = side > 0 ? lx : lx - w, bx2 = side > 0 ? lx + w : lx;
      const box = { x1: bx1 - 2, x2: bx2 + 2, y1: ly - 11, y2: ly - 11 + h + 3 };
      if (bx1 < L + 2 || bx2 > W - R - 2 || box.y1 < T - 4 || box.y2 > H - B - 2) continue;
      const hitL = boxes.some(b => overlap(box, b));
      const hitB = pts.some(q => q !== p && !(box.x2 < q.x - q.rad || box.x1 > q.x + q.rad || box.y2 < q.y - q.rad || box.y1 > q.y + q.rad));
      if (!hitL && !hitB) { best = { side, dy, lx, ly, box }; break; }
      if (!best && !hitL) best = { side, dy, lx, ly, box };
    }
    if (!best) { const lx = p.x + p.rad + 6; best = { side: 1, dy: 0, lx, ly: p.y + 4, box: { x1: lx, x2: lx + w, y1: p.y - 7, y2: p.y + 7 } }; }
    Object.assign(p, best); boxes.push(best.box);
  });
  pts.slice().sort((a, b) => isF(a.c) - isF(b.c) || b.rad - a.rad).forEach(p => {

  if (want && langs.includes(want) && (want === "en" || (DATA.i18n || {})[want])) LANG = want;
  if (h.get("focus") && byName(h.get("focus"))) F = h.get("focus");
  controls(); renderAll();
  // a link to a folded section (table of contents, or a #s-dq address) opens it; printing opens them all
  const unfold = id => { const s = document.getElementById(id), d = s && s.querySelector(".sec-fold"); if (d) d.open = true; };
  $("#toc").addEventListener("click", e => { const a = e.target.closest("a[href^='#']"); if (a) unfold(a.getAttribute("href").slice(1)); });
  if (/^#s-/.test(location.hash)) unfold(location.hash.slice(1));
  window.addEventListener("beforeprint", () => $$(".sec-fold").forEach(d => { d.open = true; }));
})();
