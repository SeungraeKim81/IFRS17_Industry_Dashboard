<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thai life insurance industry — IFRS 17 dashboard</title>
<meta name="description" content="TFRS 17 (IFRS 17) figures and indicators for 20 Thai life insurers, FY2025, highlighting Samsung Life.">
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  color-scheme:light;
  /* SLI palette (company template): brand-blue #0345e4, brand-blue-deep #0033cc, navy #0b3267,
     chart accents #2939e8 #00beed #fab019 #b01e34, surface-tint #e6edfc */
  --plane:#ffffff; --surface:#ffffff; --ink:#151a24; --ink-2:#4f5663; --muted:#6f7784;
  --grid:#e3e8f2; --axis:#c5cedd; --hair:rgba(11,50,103,.12);
  --peer:#7a93c2; --focus:#0345e4; --focus-soft:rgba(3,69,228,.09);
  --c1:#2939e8; --c2:#00beed; --c3:#fab019; --c4:#b01e34;
  --pos:#2939e8; --neg:#b01e34; --total:#8a93a6;
  --good:#1e7a46; --bad:#b01e34; --neutral-mid:#eef2f8;
  --title:#0b3267; --mast:#0033cc; --mast-ink:#ffffff; --mast-ink-2:#d6e2ff; --mast-muted:#b8ccff;
  --band:#e6edfc; --band-ink:#0b3267;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  /* dark theme: not in the company template; deep navy with a lighter brand blue for contrast */
  --plane:#0b1220; --surface:#111a2c; --ink:#e8edf6; --ink-2:#aeb8ca; --muted:#8792a6;
  --grid:#1e2a42; --axis:#2c3a57; --hair:rgba(255,255,255,.10);
  --peer:#5b6f96; --focus:#6f9bff; --focus-soft:rgba(111,155,255,.16);
  --c1:#6f86ff; --c2:#38cfee; --c3:#f5b83d; --c4:#e0566b;
  --pos:#6f86ff; --neg:#e0566b; --total:#8792a6;
  --good:#5fd08f; --bad:#ff7b8c; --neutral-mid:#1b2a48;
  --title:#ffffff; --mast:#0b3267; --mast-ink:#ffffff; --mast-ink-2:#c9d6f0; --mast-muted:#9fb2d8;
  --band:#16264a; --band-ink:#e8edf6;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  /* dark theme: not in the company template; deep navy with a lighter brand blue for contrast */
  --plane:#0b1220; --surface:#111a2c; --ink:#e8edf6; --ink-2:#aeb8ca; --muted:#8792a6;
  --grid:#1e2a42; --axis:#2c3a57; --hair:rgba(255,255,255,.10);
  --peer:#5b6f96; --focus:#6f9bff; --focus-soft:rgba(111,155,255,.16);
  --c1:#6f86ff; --c2:#38cfee; --c3:#f5b83d; --c4:#e0566b;
  --pos:#6f86ff; --neg:#e0566b; --total:#8792a6;
  --good:#5fd08f; --bad:#ff7b8c; --neutral-mid:#1b2a48;
  --title:#ffffff; --mast:#0b3267; --mast-ink:#ffffff; --mast-ink-2:#c9d6f0; --mast-muted:#9fb2d8;
  --band:#16264a; --band-ink:#e8edf6;
}
*{box-sizing:border-box}
/* one line length for all running text, about the width of the charts. In rem, not ch: ch is the width
   of the digit 0, about half a Korean character, so ch-based widths wrapped Korean text early. */
:root{--measure:60rem}
html,body{margin:0}
body{background:var(--plane);color:var(--ink);font:400 15px/1.55 "Neue Haas Grotesk Text Pro",system-ui,-apple-system,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Thonburi","Leelawadee UI","Noto Sans Thai",sans-serif;
  -webkit-font-smoothing:antialiased;padding:0 0 64px}
.wrap{max-width:1212px;margin:0 auto;padding:0 16px}
.top{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-start;justify-content:space-between}
.top-text{flex:1 1 560px;min-width:0}
h1{font-weight:700;font-size:28px;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em;text-wrap:balance}
.lede{color:var(--ink-2);max-width:var(--measure);margin:0}
.units{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:10px}
nav.periods{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-top:8px;font-size:13px}
nav.periods .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
nav.periods a{color:var(--ink-2)}
nav.periods a[aria-current="page"]{color:var(--ink);font-weight:650;text-decoration:none}
.controls{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.lang-pick{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.lang-pick .seg button{text-transform:none;letter-spacing:0}
:lang(ko) body{word-break:keep-all;overflow-wrap:anywhere}
:lang(ko) .brand-label,:lang(ko) .units,:lang(ko) nav.periods .lab,:lang(ko) .lang-pick,:lang(ko) .focus-pick,:lang(ko) .panel h3,:lang(ko) table.data th{letter-spacing:0}
/* Thai: taller line for stacked vowel and tone marks; no capitals, so no tracking on the small caps labels */
:lang(th) body{line-height:1.7}
:lang(th) .brand-label,:lang(th) .units,:lang(th) nav.periods .lab,:lang(th) .lang-pick,:lang(th) .focus-pick,:lang(th) .panel h3,:lang(th) table.data th{letter-spacing:0}
@media(max-width:620px){.controls{align-items:stretch;width:100%}.lang-pick{justify-content:space-between}}
.focus-pick{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.focus-pick select{font:inherit;font-size:15px;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--surface);
  border:1px solid var(--axis);border-radius:6px;padding:7px 10px;min-width:220px}
nav.toc{display:flex;flex-wrap:wrap;gap:6px 18px;margin:22px 0 0;padding:10px 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);font-size:13px}
nav.toc a{color:var(--ink-2);text-decoration:none}
nav.toc a:hover{color:var(--ink);text-decoration:underline}
/* masthead: the blue band of the company's cover slide (no logo, owner decision); two translucent rings as on its break slide */
.mast{background:var(--mast);color:var(--mast-ink);position:relative;overflow:hidden;padding:28px 0 84px;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.mast .wrap{position:relative}
.mast .ring{position:absolute;border-radius:50%;border:44px solid rgba(255,255,255,.12);pointer-events:none}
.mast .r1{width:420px;height:420px;right:-140px;top:-170px}
.mast .r2{width:240px;height:240px;right:24%;bottom:-170px}
.brand-label{margin:0 0 10px;font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mast-ink)}
.mast h1{color:var(--mast-ink)}
.mast .lede{color:var(--mast-ink-2)}
.mast .units,.mast nav.periods .lab,.mast .lang-pick,.mast .focus-pick{color:var(--mast-muted)}
.mast nav.periods a{color:var(--mast-ink-2)}
.mast nav.periods a[aria-current="page"]{color:var(--mast-ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.mast .seg{border-color:rgba(255,255,255,.45)}
.mast .seg button{background:transparent;color:var(--mast-ink-2)}
.mast .seg button+button{border-left-color:rgba(255,255,255,.3)}
.mast .seg button[aria-pressed="true"]{background:#ffffff;color:var(--mast)}
.mast .focus-pick select{background:#ffffff;color:#0b3267;border-color:transparent}
.mast nav.toc{border-color:rgba(255,255,255,.22)}
.mast nav.toc a{color:var(--mast-ink-2)}
.mast nav.toc a:hover{color:var(--mast-ink)}
.mast .focus-head{margin:22px 0 0}
.mast .focus-name{color:var(--mast-ink)}
.mast .chip{background:rgba(255,255,255,.14);border-color:transparent;color:var(--mast-ink)}
#s-focus{margin-top:-56px;position:relative}
@media(max-width:620px){.mast{padding:20px 0 76px}.mast .r2{display:none}}
section{margin-top:44px;scroll-margin-top:12px}
h2{font-weight:700;font-size:20px;margin:0;letter-spacing:-.005em;color:var(--title);display:inline-block;padding-bottom:5px;border-bottom:2px solid var(--focus)}
.sec-note{color:var(--ink-2);font-size:14px;max-width:var(--measure);margin:6px 0 16px}
.panel{background:var(--surface);border:1px solid var(--hair);border-radius:6px;padding:16px}
.panel h3{margin:0;font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.panel .sub{font-size:12px;color:var(--muted);margin:3px 0 10px}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:860px){.panels{grid-template-columns:1fr}}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:"Neue Haas Grotesk Text Pro",system-ui,-apple-system,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Thonburi","Leelawadee UI","Noto Sans Thai",sans-serif}
.num{font-variant-numeric:tabular-nums}
.legend{display:flex;gap:8px 18px;align-items:center;flex-wrap:wrap;margin:12px 0 0;font-size:13px;color:var(--ink-2)}
.key{display:inline-flex;align-items:center;gap:7px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.sq{width:12px;height:10px;border-radius:2px;display:inline-block}
/* focus summary */
.focus-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:12px}
.focus-name{font-size:22px;font-weight:650}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--hair);color:var(--ink-2);background:var(--surface)}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.tiles + .tiles{margin-top:12px}
@media(max-width:1000px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.tiles{grid-template-columns:repeat(2,1fr)}}
/* phones: two compact cards per row; every line stays, in smaller type (owner decision) */
@media(max-width:480px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .tiles + .tiles{margin-top:8px}
  .tile{padding:9px 10px 9px}
  .tile .lab{font-size:12px;line-height:1.3}
  .tile .val{font-size:20px;margin-top:3px}
  .tile .delta{font-size:11.5px;line-height:1.35}
  .tile .ctx{font-size:11px;line-height:1.35;margin-top:3px}
}
.tile{background:var(--surface);border:1px solid var(--hair);border-radius:6px;padding:13px 14px 12px;border-top:3px solid var(--focus)}
.tile .lab{font-size:13px;color:var(--ink-2)}
.tile .val{font-size:26px;font-weight:700;line-height:1.25;margin-top:2px;color:var(--title);font-variant-numeric:tabular-nums}
.tile .delta{font-size:13px;margin-top:2px}
.tile .ctx{font-size:12px;color:var(--muted);margin-top:4px}
.up-good,.down-good{color:var(--good)} .up-bad,.down-bad{color:var(--bad)} .flat{color:var(--ink-2)}
.keymsg{margin-top:16px;padding:14px 20px 12px;border-radius:6px;background:var(--band);color:var(--band-ink)}
.keymsg .eyebrow{margin:0 0 4px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--focus)}
:lang(ko) .keymsg .eyebrow,:lang(th) .keymsg .eyebrow{letter-spacing:.04em}
.headlines{margin:0;padding:0 0 0 18px;color:var(--band-ink);max-width:var(--measure)}
.headlines li{margin:4px 0}
.callouts{margin-top:14px;display:grid;gap:8px}
.callout{font-size:13.5px;color:var(--ink-2);border-left:3px solid var(--axis);padding:4px 0 4px 12px}
.callout b{color:var(--ink)}
/* bar table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--hair);border-radius:8px;background:var(--surface)}
table.data{border-collapse:collapse;width:100%;font-size:13px}
table.data th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:550;text-align:right;
  padding:10px 8px;border-bottom:1px solid var(--axis);white-space:nowrap;vertical-align:bottom}
table.data th.l,table.data td.l{text-align:left}
table.data td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap;font-variant-numeric:tabular-nums}
table.data tr:last-child td{border-bottom:0}
table.data tr.focus td{background:var(--focus-soft)}
table.data tr.focus td.l{font-weight:600}
table.data tr.tier-break td{border-top:2px solid var(--axis)}
table#all th{white-space:normal;line-height:1.3}
table.data th.sortable{cursor:pointer;user-select:none}
table.data th.sortable:hover{color:var(--ink)}
table.data th .arr{display:inline-block;width:10px;color:var(--ink-2)}
.barcell{display:flex;align-items:center;gap:8px;justify-content:flex-end;min-width:200px}
.barcell .track{flex:1;height:10px;position:relative}
.barcell .fill{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--peer);opacity:.75}
tr.focus .barcell .fill{background:var(--focus);opacity:1}
.barcell .v{min-width:56px}
.barcell .s{min-width:44px;color:var(--muted)}
.flag{display:inline-block;font-size:10.5px;padding:0 5px;border-radius:3px;border:1px solid var(--hair);color:var(--ink-2);margin-left:6px;font-weight:400}
.tbl-tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px;font-size:13px;color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--axis);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:var(--surface);color:var(--ink-2);padding:5px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--axis)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
button.dl{font:inherit;font-size:13px;border:1px solid var(--axis);background:var(--surface);color:var(--ink);border-radius:6px;padding:5px 12px;cursor:pointer}
.ok{color:var(--good)} .fail{color:var(--bad);font-weight:700}
.notes{font-size:13.5px;color:var(--ink-2);max-width:var(--measure)}
.notes h4{color:var(--ink);font-size:14px;margin:18px 0 4px}
.notes p{margin:0 0 8px}
details:not(.sec-fold){border-top:1px solid var(--grid);padding:6px 0}
details:not(.sec-fold) summary{cursor:pointer;color:var(--ink);font-size:13.5px}
details:not(.sec-fold) p{margin:6px 0 4px;font-size:13px;color:var(--ink-2)}
/* a section that opens on request: its heading is the summary */
.sec-fold>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:8px}
.sec-fold>summary::-webkit-details-marker{display:none}
.sec-fold>summary::before{content:"\25B8";color:var(--muted);font-size:16px;display:inline-block;transition:transform .15s}
.sec-fold[open]>summary::before{transform:rotate(90deg)}
.sec-fold>summary:hover h2{text-decoration:underline;text-decoration-color:var(--axis)}
ul.flags{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2)}
footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--hair);font-size:12px;color:var(--muted)}
.tip{position:fixed;pointer-events:none;z-index:9;background:var(--surface);color:var(--ink);border:1px solid var(--hair);border-radius:6px;
  padding:9px 11px;font-size:12.5px;box-shadow:0 6px 22px rgba(0,0,0,.16);opacity:0;transition:opacity .1s;max-width:290px}
.tip b{font-size:13.5px;display:block;margin-bottom:5px}
.tip table{border-collapse:collapse;width:100%}
.tip td{padding:1px 0;font-size:12px;white-space:nowrap}
.tip td:last-child{text-align:right;padding-left:16px;font-variant-numeric:tabular-nums}
@media print{body{padding:0}.controls,nav.toc,.tbl-tools button{display:none}.tile,.panel{break-inside:avoid}}
</style>
</head>
<body>
<header class="mast"><i class="ring r1"></i><i class="ring r2"></i><div class="wrap">
<p class="brand-label" data-t="brandLabel"></p>
<div class="top">
  <div class="top-text">
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <div class="units" id="units"></div>
    <nav class="periods" id="periods"></nav>
  </div>
  <div class="controls">
    <div class="lang-pick"><span data-t="langLabel"></span>
      <div class="seg" role="group" id="langSeg"></div>
    </div>
    <label class="focus-pick"><span data-t="focusPick"></span>
      <select id="focusSel"></select>
    </label>
  </div>
</div>
<nav class="toc" id="toc"></nav>
<div class="focus-head"><span class="focus-name" id="fName"></span><span id="fChips"></span></div>
</div></header>
<div class="wrap">

<section id="s-focus">
  <div class="tiles" id="tiles1"></div>
  <div class="tiles" id="tiles2"></div>
  <div class="keymsg"><p class="eyebrow" data-t="keyMessages"></p><ul class="headlines" id="headlines"></ul></div>
  <div class="callouts" id="callouts"></div>
</section>

<section id="s-market">
  <h2 data-t="h2market"></h2>
  <p class="sec-note" data-t="noteMarket"></p>
  <div class="tbl-wrap"><table class="data" id="mkt"></table></div>
</section>

<section id="s-csm">
  <h2 data-t="h2csm"></h2>
  <p class="sec-note" data-t="noteCsm"></p>
  <div class="panel"><h3 data-t="h3wf"></h3><div class="sub" id="wfSub"></div>
    <svg id="wf" viewBox="0 0 900 320" role="img" data-t-aria="ariaWf"></svg>
    <div class="legend">
      <span class="key"><i class="sq" style="background:var(--total)"></i><span data-t="lgOpenClose"></span></span>
      <span class="key"><i class="sq" style="background:var(--pos)"></i><span data-t="lgIncrease"></span></span>
      <span class="key"><i class="sq" style="background:var(--neg)"></i><span data-t="lgDecrease"></span></span>
    </div>
  </div>
  <div class="panel" style="margin-top:20px"><h3 data-t="h3quad"></h3><div class="sub" id="qSub"></div>
    <svg id="quad" viewBox="0 0 900 470" role="img" data-t-aria="ariaQuad"></svg>
    <div class="legend">
      <span class="key"><i class="dot" style="background:var(--focus)"></i><span class="f-name"></span></span>
      <span class="key"><i class="dot" style="background:var(--peer)"></i><span data-t="lgOthers"></span></span>
      <span class="key" style="color:var(--muted)">&#9650;&nbsp;&#9654;&nbsp;<span data-t="lgCeiling"></span></span>
      <span class="key" style="color:var(--muted)" data-t="lgBubble"></span>
    </div>
  </div>
</section>

<section id="s-nb">
  <h2 data-t="h2nb"></h2>
  <p class="sec-note" data-t="noteNb"></p>
  <div class="panel"><svg id="strips" viewBox="0 0 900 380" role="img" data-t-aria="ariaStrips"></svg>
    <div class="legend">
      <span class="key"><i class="dot" style="background:var(--focus)"></i><span class="f-name"></span> <span class="p-cur"></span></span>
      <span class="key"><i class="dot" style="border:2px solid var(--focus);background:transparent"></i><span class="f-name"></span> <span class="p-cmp"></span></span>
      <span class="key"><i class="dot" style="background:var(--peer);opacity:.6"></i><span data-t="lgOthers"></span></span>
      <span class="key"><i class="sq" style="width:2px;height:12px;background:var(--ink-2)"></i><span data-t="lgMedian"></span></span>
    </div>
  </div>
</section>

<section id="s-ism">
  <h2 data-t="h2ism"></h2>
  <p class="sec-note" data-t="noteIsmDef" style="margin-bottom:6px"></p>
  <p class="sec-note" data-t="noteIsm"></p>
  <div class="panels">
    <div class="panel"><h3 data-t="h3dis"></h3><div class="sub" id="m1sub"></div><svg id="m1" viewBox="0 0 520 330" role="img" data-t-aria="h3dis"></svg></div>
    <div class="panel"><h3 data-t="h3not"></h3><div class="sub" id="m2sub"></div><svg id="m2" viewBox="0 0 520 330" role="img" data-t-aria="h3not"></svg></div>
  </div>
</section>

<section id="s-bridge">
  <h2 data-t="h2bridge"></h2>
  <p class="sec-note" data-t="noteBridge"></p>
  <div class="panel"><svg id="br" viewBox="0 0 900 640" role="img" data-t-aria="ariaBridge"></svg>
    <div class="legend">
      <span class="key"><i class="sq" style="background:var(--c1)"></i><span data-t="lgIsr"></span></span>
      <span class="key"><i class="sq" style="background:var(--c2)"></i><span data-t="lgInv"></span></span>
      <span class="key"><i class="sq" style="background:var(--c3)"></i><span data-t="lgOther"></span></span>
      <span class="key"><i class="sq" style="background:var(--c4)"></i><span data-t="lgTax"></span></span>
      <span class="key">&#9670;&nbsp;<span data-t="lgNpm"></span></span>
      <span class="key" style="color:var(--muted)">&rsaquo;&rsaquo;&nbsp;<span data-t="lgClipped"></span></span>
    </div>
  </div>
</section>

<section id="s-all">
  <h2 data-t="h2all"></h2>
  <p class="sec-note" data-t="noteAll"></p>
  <div class="tbl-tools">
    <div class="seg" role="group" id="viewSeg"></div>
    <button class="dl" id="dlBtn" type="button" data-t="download"></button>
  </div>
  <div class="tbl-wrap"><table class="data" id="all"></table></div>
</section>

<section id="s-dq"><details class="sec-fold">
  <summary><h2 data-t="h2dq"></h2></summary>

ness 11.1 4) p.109 (2568) and p.110 (2567). RA release uses 17.1 (1,972,483 / 2,186,290), not the AOC RA (1,953,491 / 2,191,664).","extraction_note":"Source: 09_FS_THAILIFE_4Q2025.pdf (Audited financial statements FY2025 (Thai)), 188 pages, text layer: no (scanned), SHA-256 b47b6cd0ebbcb67a85e12b4592f88df50dc55e06d223f9175eae27863c828c88 (sources/2025FY/registry.csv)."},{"company":"Muang Thai Life","sheet_title":"Muang Thai Life - extracted from 15_FS_MTL_4Q2025.pdf (THB million)","header_note":"Scanned; read locally, pages located by their headings (file page numbers). Thousand Baht. The SCI (p.8) has equity-method and separate columns; the separate columns are used, as in the pilot (they differ by the share of profit of the associate and the tax charge; the insurance figures and the notes are common to both). Note 17.1 (p.91, both years) prints expenses as positive figures; they are turned negative (a printed bracketed past-service figure becomes positive). Acquisition-cost amortisation (1,851,355) exceeds the non-PAA recovery (1,574,841): the amortisation line covers PAA business too. CSM roll-forward 11.1 ข. p.73 (2568) and p.74 (2567); future-service change = change in estimates (CSM column). New business 11.1 ค. p.75 (both years). RA release uses 17.1 (1,244,003 / 1,270,383), not the AOC RA (1,246,246 / 1,264,718). Other expense = other finance costs + other operating expenses.","extraction_note":"Source: 15_FS_MTL_4Q2025.pdf (Audited financial statements FY2025 (Thai)), 122 pages, text layer: no (scanned), SHA-256 cf462649ee2854863705c15622f6109be4346002a2e4effdef0545cfde06f8cb (sources/2025FY/registry.csv)."},{"company":"Allianz Ayudhya","sheet_title":"Allianz Ayudhya - extracted from 20_FS_CAR_AYU_4Q2025.pdf (THB million)","header_note":"Financial statements are scanned images; every page located by its heading or, for the sideways note 30.1, by its content (its totals equal the SCI). Units thousand Baht. Acquisition-cost amortisation includes the impairmen the SCI (p.40) is in Baht, the notes in thousand Baht. The SCI has consolidated and separate columns; the separate columns are used (owner decision: separate statements). The separate statements account for the subsidiary by the equity method; its share of loss is included in other income (net), as the share of an associate is elsewhere. The insurance notes are common to both. Note 6.1 (columns non-PAA 7.1 / PAA 7.2 / total): 2568 revenue p.94, expenses p.95; 2567 p.96. Incurred claims and acquisition amortisation include PAA. CSM roll-forward (note 7.1, untitled reconciliation by measurement component): 2568 p.102-103, 2567 p.104-105; future-service change = change in estimates + experience adjustment (CSM column). New business p.106 (both years); totals used (the onerous column of 2568 shows a CSM of 13,470). RA release uses 6.1, equal to the AOC RA. Other expense = finance costs + other operating expenses.","extraction_note":"Source: 14_FS_CAR_PHILLIP_4Q2025.pdf (CAR disclosure with audited consolidated and separate financial statements FY2025 (Thai)), 183 pages, text layer: no (scanned), SHA-256 ca7f2ca63383b72759612e7c8705731cce19c818ec2051bdeb114d38b0bba1df (sources/2025FY/registry.csv)."},{"company":"Saha Life","sheet_title":"Saha Life - extracted from 16_FS_SAHA_4Q2025.pdf (THB million)","header_note":"Not in the pilot. Saha Life Insurance (บริษัท สหประกันชีวิต จำกัด (มหาชน)). Scanned; read locally, pages located by their headings (file page numbers). Baht with satang, face and notes. Single set of columns. The SCI (p.7) tax line is labelled 'expense (income)' but its bracketed figures are expenses (profit before tax less the bracketed figure = net profit), so they stay negative. No separate other finance cost line. Note 8 (columns ordinary / industrial / credit group / group / total; no PAA business): 2568 revenue and first expense lines p.55, remaining expenses p.56; 2567 revenue p.57, expenses p.58. CSM roll-forward 9.1.2: 2568 p.62 (opening, current and future service, new business) and p.63 (insurance finance, closing; the column headers at the top of p.63 are misprinted, the columns are identified by the row totals: PV / RA / CSM / total); 2567 p.63 (opening, current service) and p.64. Future-service change = change in estimates + experience adjustment relating to future service (CSM column). New business 9.1.3 p.65 (both years) prints future cash inflows without brackets; they are kept positive. The losses on onerous new business are large relative to the new-business CSM (as printed). RA release uses note 8 (34,070,181.15 / 27,477,334.93), not the AOC RA (37,727,716.62 / 30,211,185.63). CSM roll-forward FY2024 closes within 0.01 Baht.","extraction_note":"Source: 16_FS_SAHA_4Q2025.pdf (Audited financial statements FY2025 (Thai)), 121 pages, text layer: no (scanned), SHA-256 a76e867f17ae408b5fd51d1ab324fcd64952ec4b54d6e251baedcd9efba4f526 (sources/2025FY/registry.csv)."}],"commentary":[{"id":"ra_policy","title":"Risk-adjustment disaggregation limits margin comparisons","companies":[],"body":"An insurer that does not split the change in the risk adjustment between the insurance service result and insurance finance income or expense carries the whole RA change, including the effect of discount-rate movements, in the insurance service result. Service margins are therefore compared only within each policy group. Restating to a common basis would need the P&L/OCI split of the RA finance effect, which the statements do not disclose, so no restated margin is shown. Net profit is not affected by the choice."},{"id":"transition","periods":["FY2025"],"title":"FY2024 figures are transition comparatives","companies":[],"body":"TFRS 17 took effect on 1 January 2025 with transition on 1 January 2024. FY2024 figures are the restated comparatives in the FY2025 statements, not previously reported results, and the transition approach chosen by each insurer shapes its FY2024 CSM. Year-on-year changes are shown, but a large move can come from transition mechanics rather than from performance."},{"id":"chubb_rabbit","periods":["FY2025"],"title":"CHUBB and Rabbit Life sit above the replacement scale","companies":["CHUBB Life","Rabbit Life"],"body":"Both took heavy onerous-contract charges in the FY2024 transition comparative, which left a small CSM and a small FY2025 release. A small denominator inflates new business / release, so their position in the quadrant reflects transition mechanics rather than unusually strong new business."},{"id":"t_life_accretion","periods":["FY2025"],"title":"T Life's CSM interest accretion is negative in FY2025","companies":["T Life"],"body":"Accretion at locked-in rates on a positive CSM should be positive; the likely explanation is that another movement is netted into that row. The roll-forward closes exactly with the row as printed, so it is carried unchanged."},{"id":"rabbit_scale","periods":["FY2025"],"title":"Ratios to insurance revenue stop being meaningful for Rabbit Life","companies":["Rabbit Life"],"body":"Its investment book is very large relative to a small insurance operation, so the investment result and other expenses run far past the scale of the profit bridge. Its bars are clipped at the axis; the net-profit margin shown is the true figure."},{"id":"release_ratio","title":"Reading the CSM quadrant","companies":[],"body":"A release ratio of roughly 8-13% is the normal run-off pace for a stable book. Far above it, the store is drawn down quickly relative to what remains; far below it, the runway is long. New business below 1.0x the release for more than a year or two is the early warning on future earnings."}],"i18n":{"ko":{"meta":{"title":"태국 생명보험업계 IFRS 17 대시보드","market":"태국 · 생명보험","standard":"TFRS 17 (IFRS 17)","period_end":"2025년 12월 31일 (불기 2568년)","unit":"백만 바트","quarterly_caveat":"분기 수치는 검토(감사 아님)를 받은 요약 중간재무제표의 누적(연초부터) 값이다. CSM 변동표와 신계약은 1월 1일부터의 누적이고, CSM 상각률은 연간 값과 같은 척도로 읽히도록 연환산(× 12 ÷ 경과월수)했다. 비교기간은 전년 중간재무제표의 같은 기간이다. 2025년 분기는 2024년 분기를 추출하지 않아 비교기간이 없다. 업계 변동은 두 기간에 모두 있는 보험사끼리만 계산했다. 어느 기간의 중간재무제표를 받지 못한 보험사는 그 기간에서 빠진다.","comparative_caveat":"태국은 TFRS 17을 2025년 1월 1일부터 시행했고 전환일은 2024년 1월 1일이다. 따라서 FY2024 수치는 기존에 보고된 실적이 아니라 재작성된 전환 비교기간 수치다. 전년 대비 변동은 이 점을 감안해 읽어야 한다."},"groups":{"scale":"규모","profitability":"수익성","csm":"CSM","new_business":"신계약"},"metrics":{"insurance_revenue":{"label":"보험수익","formula":"보험수익 합계"},"net_profit":{"label":"당기순이익","formula":"당기순이익"},"csm_close":{"label":"기말 CSM","formula":"기말 보험계약마진(CSM)"},"nb_csm":{"label":"신계약 CSM","formula":"당기에 최초 인식한 계약에서 발생한 CSM"},"nb_pv_premium":{"label":"신계약 PV 보험료","formula":"신계약 미래 현금유입의 현재가치"},"isr_gross":{"label":"보험서비스결과","formula":"보험수익 + 보험서비스비용"},"ism_gross":{"label":"보험서비스이익률","formula":"(보험수익 + 보험서비스비용) ÷ 보험수익"},"ism_net":{"label":"재보험 후 보험서비스이익률","formula":"(보험서비스결과 + 재보험손익) ÷ 보험수익"},"inv_margin":{"label":"투자손익(보험금융비용 차감 후)","formula":"(순투자수익 + 순보험금융비용) ÷ 보험수익"},"other_ratio":{"label":"기타비용(순)","formula":"(기타비용 + 기타수익) ÷ 보험수익"},"tax_ratio":{"label":"법인세","formula":"법인세 ÷ 보험수익"},"npm":{"label":"순이익률","formula":"당기순이익 ÷ 보험수익"},"current_loss_ratio":{"label":"당기 서비스 손해율","formula":"−(발생사고 + 과거서비스 관련 변동) ÷ (BEL 해제 + RA 해제 + PAA 보험수익 + 기타 보험수익 + 보험취득현금흐름 회수)"},"csm_release_share":{"label":"보험수익 중 CSM 상각 비중","formula":"CSM 상각 ÷ 보험수익"},"csm_growth":{"label":"CSM 증가율","formula":"기말 CSM ÷ 기초 CSM − 1"},"csm_release_amount":{"label":"CSM 상각","formula":"서비스 제공에 따라 당기손익으로 인식한 CSM (양수로 표시)"},"release_ratio":{"label":"CSM 상각률","formula":"CSM 상각 ÷ (기초 CSM + 신계약 + 이자부리 + 미래서비스 관련 변동). 분기 페이지는 연환산(× 12 ÷ 경과월수)"},"nb_to_release":{"label":"신계약 CSM ÷ 상각","formula":"신계약 CSM ÷ CSM 상각"},"nb_csm_margin":{"label":"신계약 CSM 마진율","formula":"신계약 CSM ÷ 신계약 PV 보험료"},"acq_cost_ratio":{"label":"신계약비용률","formula":"신계약 PV 보험취득현금흐름 ÷ 신계약 PV 보험료"},"nb_claims_ratio":{"label":"신계약 보험금·급부 비율","formula":"신계약 PV 보험금 유출 ÷ 신계약 PV 보험료"},"onerous_ratio":{"label":"신계약 손실부담 비율","formula":"신계약 손실요소 ÷ 신계약 CSM"},"rev_share":{"label":"보험수익 점유율","formula":"회사 보험수익 ÷ 대상 보험사 전체 합계"},"csm_share":{"label":"기말 CSM 점유율","formula":"회사 기말 CSM ÷ 대상 보험사 전체 합계"},"nb_csm_share":{"label":"신계약 CSM 점유율","formula":"회사 신계약 CSM ÷ 대상 보험사 전체 합계"}},"checks":{"revenue_split":{"label":"보험수익 구성 합계 = 보험수익 총액","short":"수익"},"expense_split":{"label":"비용 구성 합계 = 보험서비스비용 총액","short":"비용"},"net_profit":{"label":"순이익 브리지 = 공시 당기순이익","short":"순이익"},"csm_rollforward":{"label":"CSM 변동표 = 기말 CSM","short":"CSM 변동"},"nb_csm":{"label":"신계약: PV 유입 − 취득비용 − 보험금 − RA + 손실요소 = CSM","short":"신계약 CSM"},"nb_consistency":{"label":"CSM 변동표의 신계약 = 신계약 주석","short":"신계약 일치"}},"commentary":{"ra_policy":{"title":"위험조정(RA) 분리 여부에 따라 이익률 비교가 제한된다","body":"위험조정 변동을 보험서비스결과와 보험금융손익으로 나누지 않는 보험사는 할인율 변동 효과를 포함한 RA 변동 전체를 보험서비스결과에 반영한다. 그래서 보험서비스이익률은 같은 정책 그룹 안에서만 비교한다. 공통 기준으로 재계산하려면 RA 금융효과의 당기손익/기타포괄손익 구분이 필요한데 재무제표에 공시되지 않으므로, 재계산한 이익률은 보여 주지 않는다. 당기순이익은 이 선택의 영향을 받지 않는다."},"transition":{"title":"FY2024 수치는 전환 비교기간 수치다","body":"TFRS 17은 2025년 1월 1일 시행, 전환일은 2024년 1월 1일이다. FY2024 수치는 FY2025 재무제표에 재작성되어 실린 비교기간 수치이며, 보험사별로 선택한 전환 방법이 FY2024 CSM에 영향을 준다. 전년 대비 변동을 표시하지만, 큰 변동은 실적보다 전환 방식에서 비롯될 수 있다."},"chubb_rabbit":{"title":"CHUBB와 Rabbit Life는 신계약 대체 배수 눈금 밖에 있다","body":"두 회사 모두 FY2024 전환 비교기간에 손실부담계약 비용을 크게 인식해 CSM과 FY2025 상각액이 작다. 분모가 작아 신계약 CSM ÷ 상각 배수가 부풀려지므로, 사분면에서의 위치는 신계약이 특별히 강해서가 아니라 전환 방식의 결과로 읽어야 한다."},"t_life_accretion":{"title":"T Life의 FY2025 CSM 이자부리는 음수다","body":"양(+)의 CSM에 최초 인식 시점 이율로 부리하는 이자는 양수여야 한다. 다른 변동이 해당 행에 상계되어 있을 가능성이 크다. 공시된 그대로 CSM 변동표가 정확히 맞으므로 수정하지 않고 반영했다."},"rabbit_scale":{"title":"Rabbit Life는 보험수익 대비 비율의 의미가 약하다","body":"보험 영업 규모에 비해 투자 자산이 매우 커서, 투자손익과 기타비용이 이익 브리지 눈금을 크게 벗어난다. 막대는 축에서 잘라 표시했고, 순이익률은 실제 값이다."},"release_ratio":{"title":"CSM 사분면 읽는 법","body":"CSM 상각률이 대략 8~13%이면 안정적인 보유계약의 일반적인 상각 속도다. 그보다 훨씬 높으면 남은 CSM 대비 빠르게 소진되는 것이고, 훨씬 낮으면 이익 실현 기간이 길다는 뜻이다. 신계약 CSM이 상각액의 1.0배에 못 미치는 상태가 1~2년 넘게 이어지면 미래 이익에 대한 조기 경고 신호다."}},"notes_language_label":"추출 메모는 추출 규격에 기록한 영문 원문 그대로 표시한다."},"th":{"meta":{"title":"แดชบอร์ด IFRS 17 อุตสาหกรรมประกันชีวิตไทย","market": ":"(Net investment income + net insurance finance expense) / insurance revenue"},"other_ratio":{"label":"Other expense, net","formula":"(Other expense + other income) / insurance revenue"},"tax_ratio":{"label":"Income tax","formula":"Income tax / insurance revenue"},"npm":{"label":"Net profit margin","formula":"Net profit / insurance revenue"},"current_loss_ratio":{"label":"Current-service loss ratio","formula":"-(Incurred claims + past service) / (BEL release + RA release + PAA revenue + other revenue + acquisition recovery)"},"csm_release_share":{"label":"CSM release in revenue","formula":"CSM release / insurance revenue"},"csm_growth":{"label":"CSM growth","formula":"CSM closing / CSM opening - 1"},"csm_release_amount":{"label":"CSM release","formula":"CSM ที่รับรู้ในกำไรหรือขาดทุนจากการให้บริการ (แสดงเป็นจำนวนบวก)"},"release_ratio":{"label":"CSM release ratio","formula":"CSM release / (CSM ต้นงวด + ธุรกิจใหม่ + accretion + การเปลี่ยนแปลงที่เกี่ยวกับบริการในอนาคต) หน้ารายไตรมาสปรับเป็นรายปี (× 12 ÷ จำนวนเดือนสะสม)"},"nb_to_release":{"label":"New business / release","formula":"CSM จากธุรกิจใหม่ / CSM release"},"nb_csm_margin":{"label":"New-business CSM margin","formula":"CSM จากธุรกิจใหม่ / PV premium ของธุรกิจใหม่"},"acq_cost_ratio":{"label":"Acquisition cost ratio","formula":"PV acquisition cost / PV premium ของธุรกิจใหม่"},"nb_claims_ratio":{"label":"Claims & benefits ratio (NB)","formula":"PV สินไหมและผลประโยชน์ / PV premium ของธุรกิจใหม่"},"onerous_ratio":{"label":"Onerous new business","formula":"Loss component ของธุรกิจใหม่ / CSM จากธุรกิจใหม่"},"rev_share":{"label":"Share of insurance revenue","formula":"Insurance revenue ของบริษัท / ยอดรวมของทุกบริษัทที่ครอบคลุม"},"csm_share":{"label":"Share of closing CSM","formula":"CSM closing ของบริษัท / ยอดรวมของทุกบริษัทที่ครอบคลุม"},"nb_csm_share":{"label":"Share of new-business CSM","formula":"New-business CSM ของบริษัท / ยอดรวมของทุกบริษัทที่ครอบคลุม"}},"checks":{"revenue_split":{"label":"ผลรวมองค์ประกอบ = Insura function showTip(ev, html) {
  tip.innerHTML = html; tip.style.opacity = 1;

  let x = ev.clientX + 16, y = ev.clientY - 20;
  if (x + w > innerWidth - 10) x = ev.clientX - w - 16;
  if (y + h > innerHeight - 10) y = innerHeight - h - 10;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
}
const hideTip = () => tip.style.opacity = 0;

function niceTicks(lo, hi, n = 5) {
  const span = hi - lo, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => span / s <= n) || 10 * mag;
  const out = []; for (let x = Math.ceil(lo / step - 1e-9) * step; x <= hi + 1e-9; x += step) out.push(+x.toFixed(10));
  return { ticks: out, step };
}

function deltaHtml(kind, cur, prev, better) {
  if (cur == null || prev == null) return '<span class="flat">' + t("noCmp") + "</span>";
  let d, txt;
  if (kind === "growth") { d = growth(cur, prev); if (d == null) return '<span class="flat">' + t("nmBase", { cmp: CMPL }) + "</span>"; txt = (d >= 0 ? "+" : "") + nf(d * 100, 1) + "%"; }
  else if (kind === "pp") { d = cur - prev; txt = (d >= 0 ? "+" : "") + nf(d * 100, 1) + " " + t("pp"); }
  else { d = cur - prev; txt = (d >= 0 ? "+" : "") + nf(d, 2) + "×"; }
  const dir = Math.abs(d) < 1e-9 ? "flat" : d > 0 ? "up" : "down";
  const cls = dir === "flat" || better == null ? "flat" : ((dir === "up") === better ? dir + "-good" : dir + "-bad");
  const arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "◆";
  return '<span class="' + cls + '">' + arrow + " " + txt + '</span> <span class="flat">' + t("vs", { cmp: CMPL }) + "</span>";
}

/* ---------- 3a waterfall ---------- */
function waterfall() {
  const svg = $("#wf"); svg.textContent = "";
  const c = byName(F);
  const keys = ["csm_open", "csm_nb", "csm_accretion", "csm_future_service", "csm_release", "csm_close"], labs = t("wf");
  const series = [
    { title: c.name, val: k => raw(c, k) },
    { title: t("industryN", { n: COS.length }), val: k => ind("sum_" + k).agg },
  ].map(s => {
    const o = s.val("csm_open"); let run = 0;
    s.bars = keys.map((k, i) => {
      const v = s.val(k) / o * 100, lab = labs[i];
      if (i === 0 || i === keys.length - 1) { run = v; return { lab, v, y0: 0, y1: v, total: true, abs: s.val(k) }; }
      const b = { lab, v, y0: run, y1: run + v, total: false, abs: s.val(k) }; run += v; return b;
    });
    return s;
  });
  const hi = Math.max(...series.flatMap(s => s.bars.map(b => Math.max(b.y0, b.y1)))) * 1.1;
  const W = 900, H = 320, T = 34, B = 46, gap = 40, pw = (W - gap) / 2, L = 40;

    ticks.forEach(tk => {
      svg.appendChild(el("line", { x1: x0 + L, x2: x0 + pw, y1: py(tk), y2: py(tk), stroke: tk === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));

      const r = el("rect", { x: cx - bw / 2, y: top, width: bw, height: Math.max(1, bot - top), fill, rx: 3 });
      hover(r, tipTable(s.title, [[b.lab, fM(b.abs) + " " + t("m")], [t("tipIndex"), nf(b.v, 1)]]));
      svg.appendChild(r);

      const lab = b.total ? nf(b.v, 0) : (b.v >= 0 ? "+" : "−") + nf(Math.abs(b.v), 1);
      svg.appendChild(el("text", { x: cx, y: top - 6, "text-anchor": "middle", "font-size": 11.5, fill: "var(--ink)", "font-weight": b.total ? 600 : 400 }, lab));

    });

// Approximate width of text at font size fs: a Korean character is about 1 em, others about 0.55 em.
const textW = (s, fs) => [...s].reduce((a, ch) => a + (/[\u1100-\u11ff\u3130-\u318f\uac00-\ud7a3]/.test(ch) ? 1 : 0.55) * fs, 0);

/* ---------- 3b quadrant ---------- */
function quadrant() {
  const svg = $("#quad"); svg.textContent = "";
  // axis limits: y at 3x; x at 30%, 1.5 times the top of the 5%-20% plausibility range. A point beyond
  // a limit sits on it with a marker and its true value, so one outlier cannot squeeze the others.
  const W = 900, H = 470, L = 56, R = 20, T = 20, B = 46, CAP = 3, XCAP = 30;
  const xs = COS.map(c => g(c, "release_ratio") * 100);
  const x1 = Math.min(XCAP, Math.max(25, Math.ceil(Math.max(...xs) / 5) * 5));
  const px = v => L + Math.min(v, x1) / x1 * (W - L - R), py = v => H - B - Math.min(v, CAP) / CAP * (H - T - B);
  const maxC = Math.max(...COS.map(c => raw(c, "csm_close")));
  const rad = v => 4.5 + 19 * Math.sqrt(v / maxC);
  $("#qSub").textContent = t("qSub", { cur: CURL, lo: fM(Math.min(...COS.map(c => raw(c, "csm_close")))), hi: fM(maxC) });
  for (let v = 0; v <= CAP; v += 0.5) {
    svg.appendChild(el("line", { x1: L, x2: W - R, y1: py(v), y2: py(v), stroke: "var(--grid)" }));
    svg.appendChild(el("text", { x: L - 9, y: py(v) + 4, "text-anchor": "end", fill: "var(--muted)", "font-size": 11 }, v.toFixed(1) + "×"));
  }
  for (let v = 0; v <= x1; v += 5) svg.appendChild(el("text", { x: px(v), y: H - B + 18, "text-anchor": "middle", fill: "var(--muted)", "font-size": 11 }, v + "%"));
  svg.appendChild(el("line", { x1: L, x2: W - R, y1: H - B, y2: H - B, stroke: "var(--axis)" }));
  svg.appendChild(el("line", { x1: L, x2: W - R, y1: py(1), y2: py(1), stroke: "var(--ink-2)", "stroke-width": 1.5, "stroke-dasharray": "5 4" }));
  svg.appendChild(el("text", { x: (L + W - R) / 2, y: H - 6, "text-anchor": "middle", fill: "var(--ink-2)", "font-size": 12 }, t(QTR ? "qXQ" : "qX")));
  svg.appendChild(el("text", { x: 0, y: 0, fill: "var(--ink-2)", "font-size": 12, "text-anchor": "middle", transform: "translate(13," + ((T + H - B) / 2) + ") rotate(-90)" }, t("qY")));

  const pts = COS.map(c => {
    const overY = g(c, "nb_to_release") > CAP, overX = g(c, "release_ratio") * 100 > x1;
    const extra = [overX ? fP(g(c, "release_ratio")) : null, overY ? fX(g(c, "nb_to_release"), 1) : null].filter(Boolean).join(" · ");
    return { c, x: px(g(c, "release_ratio") * 100), y: py(g(c, "nb_to_release")), rad: rad(raw(c, "csm_close")), over: overX || overY, overX, overY, extra, txt: c.short };
  })
    .sort((a, b) => (isF(b.c) - isF(a.c)) || (b.rad - a.rad));
  // the 1.0x label goes at the right end of its line, or the left end when a bubble sits there;
  // its box is reserved so that no insurer's label is placed over it
  const thTxt = t("qThreshold"), thW = textW(thTxt, 11) * 1.06, thY = py(1) - 7;
  const thBox = [{ x1: W - R - 4 - thW, x2: W - R - 4, anchor: "end", x: W - R - 4 }, { x1: L + 4, x2: L + 4 + thW, anchor: "start", x: L + 4 }]
    .map(b => Object.assign(b, { y1: thY - 11, y2: thY + 3 }))
    .find(b => !pts.some(q => q.x + q.rad > b.x1 && q.x - q.rad < b.x2 && q.y + q.rad > b.y1 && q.y - q.rad < b.y2)) ||
    { x1: W - R - 4 - thW, x2: W - R - 4, y1: thY - 11, y2: thY + 3, anchor: "end", x: W - R - 4 };
  svg.appendChild(el("text", { x: thBox.x, y: thY, "text-anchor": thBox.anchor, fill: "var(--ink-2)", "font-size": 11, "font-weight": 600 }, thTxt));
  const boxes = [thBox], LH = 13;
  const overlap = (a, b) => !(a.x2 < b.x1 || b.x2 < a.x1 || a.y2 < b.y1 || b.y2 < a.y1);
  pts.forEach(p => {
    const w = Math.max(p.txt.length * (isF(p.c) ? 7 : 6.2), p.over ? p.extra.length * 5.8 : 0), h = p.over ? LH + 11 : LH;
    let best = null;
    for (const side of [1, -1]) for (const dy of [0, -14, 14, -28, 28, -42, 42, -56, 56]) {
      const lx = p.x + side * (p.rad + 6), ly = p.y + 4 + dy;
      const bx1 = side > 0 ? lx : lx - w, bx2 = side > 0 ? lx + w : lx;
      const box = { x1: bx1 - 2, x2: bx2 + 2, y1: ly - 11, y2: ly - 11 + h + 3 };
      if (bx1 < L + 2 || bx2 > W - R - 2 || box.y1 < T - 4 || box.y2 > H - B - 2) continue;
      const hitL = boxes.some(b => overlap(box, b));
      const hitB = pts.some(q => q !== p && !(box.x2 < q.x - q.rad || box.x1 > q.x + q.rad || box.y2 < q.y - q.rad || box.y1 > q.y + q.rad));
      if (!hitL && !hitB) { best = { side, dy, lx, ly, box }; break; }
      if (!best && !hitL) best = { side, dy, lx, ly, box };
    }
    if (!best) { const lx = p.x + p.rad + 6; best = { side: 1, dy: 0, lx, ly: p.y + 4, box: { x1: lx, x2: lx + w, y1: p.y - 7, y2: p.y + 7 } }; }
    Object.assign(p, best); boxes.push(best.box);
  });
  pts.slice().sort((a, b) => isF(a.c) - isF(b.c) || b.rad - a.rad).forEach(p => {
    const c = colr(p.c), gg = el("g");
    if (Math.abs(p.dy) > 8) gg.appendChild(el("line", { x1: p.x + p.side * p.rad, y1: p.y, x2: p.side > 0 ? p.lx - 3 : p.lx + 3, y2: p.ly - 4, stroke: "var(--axis)" }));
    gg.appendChild(el("circle", { cx: p.x, cy: p.y, r: p.rad, fill: c, "fill-opacity": isF(p.c) ? .45 : .22, stroke: c, "stroke-width": 2 }));
    if (p.overY) gg.appendChild(el("path", { d: "M" + (p.x - 6) + "," + (p.y - p.rad - 4) + " L" + (p.x + 6) + "," + (p.y - p.rad - 4) + " L" + p.x + "," + (p.y - p.rad - 13) + " Z", fill: c }));
    if (p.overX) gg.appendChild(el("path", { d: "M" + (p.x + p.rad + 4) + "," + (p.y - 6) + " L" + (p.x + p.rad + 4) + "," + (p.y + 6) + " L" + (p.x + p.rad + 13) + "," + p.y + " Z", fill: c }));
    gg.appendChild(el("text", { x: p.lx, y: p.ly, "text-anchor": p.side > 0 ? "start" : "end", fill: "var(--ink)", "font-size": isF(p.c) ? 13 : 11.5, "font-weight": isF(p.c) ? 650 : 400 }, p.txt));
    if (p.over) gg.appendChild(el("text", { x: p.lx, y: p.ly + 12, "text-anchor": p.side > 0 ? "start" : "end", fill: "var(--muted)", "font-size": 10.5 }, p.extra));
    const hit = el("circle", { cx: p.x, cy: p.y, r: Math.max(p.rad, 12), fill: "transparent" });
    hover(hit, () => coTip(p.c)); gg.appendChild(hit); svg.appendChild(gg);
  });
}

/* ---------- 4 strips ---------- */
// Break text into lines no wider than maxW (SVG units) at font size fs.
function wrapText(s, maxW, fs) {
  const w = x => textW(x, fs);
  const lines = [];
  s.split(" ").forEach(word => {
    const last = lines[lines.length - 1];
    if (last != null && w(last + " " + word) <= maxW) lines[lines.length - 1] = last + " " + word; else lines.push(word);
  });
  return lines;
}
function strips() {

    const cap = { nb_to_release: 3, onerous_ratio: 0.6 }[k] || null;
    let lo = Math.min(0, ...all), hi = cap ? cap : Math.max(...all);
    const { ticks } = niceTicks(lo, hi, 6); hi = Math.max(hi, ticks[ticks.length - 1]);
    const px = v => L + (Math.min(Math.max(v, lo), hi) - lo) / (hi - lo) * (W - L - R);
    // name, then its definition (as in the definitions table) in small type, then the reading direction
    svg.appendChild(el("text", { x: 0, y: cy - 14, "font-size": 13, "font-weight": 600, fill: "var(--ink)" }, mLabel(k)));
    const defLines = wrapText(mFormula(k), L - 14, 10.5);

    ticks.forEach(tk => {

      svg.appendChild(el("text", { x: px(tk), y: cy + 32, "text-anchor": "middle", "font-size": 10.5, fill: "var(--muted)" }, d.unit === "pct" ? nf(tk * 100, 0) + "%" : nf(tk, 1) + "×"));
    });
    svg.appendChild(el("line", { x1: L, x2: W - R, y1: cy, y2: cy, stroke: "var(--axis)" }));

    COS.filter(c => !isF(c)).forEach(c => {

      hover(dot, () => dotTip(c)); svg.appendChild(dot);
      if (cap && v > cap) svg.appendChild(el("text", { x: px(v) + 7, y: cy + 4, "font-size": 10, fill: "var(--muted)" }, "›"));
    });
    const c = byName(F), v = g(c, k), vp = g(c, k, CMP);
    if (v == null) {  // the highlighted insurer does not disclose this measure

      return;
    }

    }
    const fd = el("circle", { cx: px(v), cy, r: 7, fill: "var(--focus)", stroke: "var(--surface)", "stroke-width": 2 });
    hover(fd, () => dotTip(c, [[t("tipMedian"), fmtU(d.unit, med)], [t("tipRank"), rk(c, k).rank + " / " + rk(c, k).n]]));
    svg.appendChild(fd);
    svg.appendChild(el("text", { x: px(v), y: cy - 14, "text-anchor": "middle", "font-size": 12, "font-weight": 650, fill: "var(--ink)", stroke: "var(--surface)", "stroke-width": 4, "paint-order": "stroke" }, c.short + " " + fmtU(d.unit, v) + (cap && v > cap ? " ›" : "")));
    if (med != null) svg.appendChild(el("text", { x: px(med), y: cy + 44, "text-anchor": "middle", "font-size": 10.5, fill: "var(--ink-2)" }, t("median", { v: fmtU(d.unit, med) })));

/* ---------- 5 margin lollipops ---------- */
function lolli(sel, subSel, list, slots) {
  const svg = $(sel); svg.textContent = "";
  const W = 520, L = 150, R = 56, T = 12, B = 30, step = 25, H = T + slots * step + B;
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  const vals = COS.map(c => g(c, "ism_gross"));
  const lo = Math.min(0, Math.floor(Math.min(...vals) * 20) / 20), hi = Math.max(0.45, Math.ceil(Math.max(...vals) * 20) / 20);
  const px = v => L + (v - lo) / (hi - lo) * (W - L - R);
  const { ticks } = niceTicks(lo, hi, 4);
  ticks.forEach(tk => {
    svg.appendChild(el("line", { x1: px(tk), x2: px(tk), y1: T - 4, y2: H - B + 4, stroke: tk === 0 ? "var(--axis)" : "var(--grid)" }));
    svg.appendChild(el("text", { x: px(tk), y: H - B + 20, "text-anchor": "middle", fill: "var(--muted)", "font-size": 11 }, nf(tk * 100, 0) + "%"));
  });
  const sorted = list.slice().sort((a, b) => g(b, "ism_gross") - g(a, "ism_gross"));
  const v = sorted.map(c => g(c, "ism_gross")).sort((a, b) => a - b), n = v.length;
  const med = n % 2 ? v[(n - 1) / 2] : (v[n / 2 - 1] + v[n / 2]) / 2;
  $(subSel).textContent = t("groupSub", { n, cur: CURL, v: fP(med) });
  svg.appendChild(el("line", { x1: px(med), x2: px(med), y1: T - 4, y2: T + n * step, stroke: "var(--ink-2)", "stroke-width": 1.5 }));
  sorted.forEach((c, i) => {
    const y = T + i * step + step / 2, col = colr(c), xv = px(g(c, "ism_gross")), gg = el("g");
    if (isF(c)) gg.appendChild(el("rect", { x: 0, y: y - step / 2 + 1, width: W, height: step - 2, rx: 3, fill: "var(--focus-soft)" }));
    gg.appendChild(el("line", { x1: px(Math.max(0, lo)), x2: xv, y1: y, y2: y, stroke: col, "stroke-width": 2, "stroke-opacity": isF(c) ? 1 : .45 }));
    gg.appendChild(el("circle", { cx: xv, cy: y, r: isF(c) ? 6.5 : 5.5, fill: col, stroke: "var(--surface)", "stroke-width": 2 }));
    gg.appendChild(el("text", { x: L - 10, y: y + 4, "text-anchor": "end", fill: "var(--ink)", "font-size": 12.5, "font-weight": isF(c) ? 650 : 400 }, c.name));
    gg.appendChild(el("text", { x: W - R + 10, y: y + 4, fill: "var(--ink-2)", "font-size": 11.5 }, fP(g(c, "ism_gross"))));
    const hit = el("rect", { x: 0, y: y - step / 2, width: W, height: step, fill: "transparent" });
    hover(hit, () => coTip(c, [[t("tipIsmNet"), fP(g(c, "ism_net"))], [t("tipIsmCmp", { cmp: CMPL }), fP(g(c, "ism_gross", CMP))]]));
    gg.appendChild(hit); svg.appendChild(gg);
  });
}
function margins() {
  const dis = COS.filter(c => c.ra === "disaggregated"), not = COS.filter(c => c.ra !== "disaggregated");
  const slots = Math.max(dis.length, not.length);
  lolli("#m1", "#m1sub", dis, slots); lolli("#m2", "#m2sub", not, slots);
}

/* ---------- 6 bridge ---------- */
function bridge() {
  const svg = $("#br"); svg.textContent = "";
  const W = 900, L = 140, R = 78, T = 34, step = 31, B = 20, H = T + COS.length * step + B;
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  const lo = -30, hi = 70;
  const px = v => L + (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo) * (W - L - R);
  const parts = [["ism_net", "var(--c1)", "lgIsr"], ["inv_margin", "var(--c2)", "lgInv"], ["other_ratio", "var(--c3)", "lgOther"], ["tax_ratio", "var(--c4)", "lgTax"]];
  for (let v = lo; v <= hi; v += 10) {
    svg.appendChild(el("line", { x1: px(v), x2: px(v), y1: T - 12, y2: H - B + 4, stroke: v === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": v === 0 ? 1.5 : 1 }));
    svg.appendChild(el("text", { x: px(v), y: T - 18, "text-anchor": "middle", fill: "var(--muted)", "font-size": 11 }, (v > 0 ? "+" : "") + v + "%"));
  }
  const npmOf = c => g(c, "npm") ?? -Infinity;  // ordered by net-profit margin, highest first
  COS.slice().sort((a, b) => npmOf(b) - npmOf(a)).forEach((c, i) => {
    const y = T + i * step + step / 2, h = 14, gg = el("g");
    if (isF(c)) gg.appendChild(el("rect", { x: 4, y: y - step / 2 + 2, width: W - 8, height: step - 4, fill: "var(--focus-soft)", rx: 3 }));
    let cp = 0, cn = 0, clipped = false;
    const tipHtml = () => tipTable(c.name, [...parts.map(p => [t(p[2]), fP(g(c, p[0]))]), ["<b>" + t("lgNpm") + "</b>", "<b>" + fP(g(c, "npm")) + "</b>"],
      [t("tipRev"), fM(raw(c, "insurance_revenue")) + " " + t("m")]]);
    parts.forEach(([k, col]) => {
      const v = g(c, k) * 100; if (Math.abs(v) < 0.05) return;
      let x1, x2;
      if (v > 0) { x1 = px(cp); x2 = px(cp + v); cp += v; } else { x1 = px(cn + v); x2 = px(cn); cn += v; }
      if (cp > hi || cn < lo) clipped = true;
      const w = Math.max(0, x2 - x1 - 2); if (w <= 0) return;
      gg.appendChild(el("rect", { x: x1 + 1, y: y - h / 2, width: w, height: h, fill: col, rx: 2 }));
    });
    gg.appendChild(el("text", { x: L - 12, y: y + 4, "text-anchor": "end", "font-size": 12.5, fill: "var(--ink)", "font-weight": isF(c) ? 650 : 400 }, c.name));
    const mx = px(g(c, "npm") * 100), m = 6.5;
    gg.appendChild(el("path", { d: "M" + mx + "," + (y - m) + " L" + (mx + m) + "," + y + " L" + mx + "," + (y + m) + " L" + (mx - m) + "," + y + " Z", fill: "var(--ink)", stroke: "var(--surface)", "stroke-width": 2 }));
    gg.appendChild(el("text", { x: W - R + 24, y: y + 4, fill: "var(--ink-2)", "font-size": 11.5 }, fP(g(c, "npm"))));
    if (clipped) gg.appendChild(el("text", { x: W - R + 4, y: y + 4, fill: "var(--ink-2)", "font-size": 13, "font-weight": 700 }, "››"));
    const hit = el("rect", { x: 0, y: y - step / 2, width: W, height: step, fill: "transparent" }); hover(hit, tipHtml); gg.appendChild(hit);
    svg.appendChild(gg);
  });
}

/* ---------- 7 table ---------- */
const COLS = [
  ["insurance_revenue", "growth"], ["net_profit", "growth"], ["ism_gross", "pp"], ["npm", "pp"], ["csm_close", "growth"], ["csm_growth", "pp"],
  ["release_ratio", "pp"], ["nb_to_release", "x"], ["nb_csm", "growth"], ["nb_csm_margin", "pp"], ["acq_cost_ratio", "pp"], ["onerous_ratio", "pp"]];
let VIEW = "cur", SORT = { k: "insurance_revenue", dir: -1 };
function cellVal(c, k, kind) {
  if (VIEW === "cur") return g(c, k);
  if (VIEW === "cmp") return g(c, k, CMP);
  const a = g(c, k), b = g(c, k, CMP);
  if (a == null || b == null) return null;
  return kind === "growth" ? growth(a, b) : a - b;
}
function cellTxt(k, kind, v) {
  if (v == null) return t("nm");
  if (VIEW !== "chg") return fmtU(DEF[k].unit, v);
  if (kind === "growth") return (v >= 0 ? "+" : "") + nf(v * 100, 1) + "%";
  if (kind === "pp") return (v >= 0 ? "+" : "") + nf(v * 100, 1) + " " + t("pp");
  return (v >= 0 ? "+" : "") + nf(v, 2) + "×";
}
function table() {
  const seg = $("#viewSeg");
  if (!seg.childElementCount) {
    ["cur", "cmp", "chg"].forEach(id => {
      const b = document.createElement("button"); b.type = "button"; b.dataset.v = id;
      b.addEventListener("click", () => { VIEW = id; table(); }); seg.appendChild(b);
    });
    $("#dlBtn").addEventListener("click", downloadCsv);
  }
  seg.setAttribute("aria-label", t("tableView"));
  seg.querySelectorAll("button").forEach(b => { b.textContent = b.dataset.v === "cur" ? CURL : b.dataset.v === "cmp" ? CMPL : t("viewChange"); b.setAttribute("aria-pressed", b.dataset.v === VIEW); });
  const rows = COS.slice().sort((a, b) => {
    if (SORT.k === "name") return SORT.dir * a.name.localeCompare(b.name);
    const kind = (COLS.find(x => x[0] === SORT.k) || [])[1];
    const va = cellVal(a, SORT.k, kind), vb = cellVal(b, SORT.k, kind);
    return (va == null) - (vb == null) || SORT.dir * ((va ?? 0) - (vb ?? 0));
  });
  const arr = k => SORT.k === k ? (SORT.dir < 0 ? "▼" : "▲") : "";
  let h = "<thead><tr><th class='l sortable' data-k='name'>" + t("insurer") + " <span class='arr'>" + arr("name") + "</span></th><th class='l' title='" + esc(t("raSplitTitle")) + "'>" + t("raSplit") + "</th>" +
    COLS.map(([k]) => "<th class='sortable' data-k='" + k + "' title='" + esc(mFormula(k)) + "'>" + esc(t("cols")[k] + (QTR && k === "release_ratio" ? t("ann") : "")) + " <span class='arr'>" + arr(k) + "</span></th>").join("") + "</tr></thead><tbody>";
  const defaultOrder = SORT.k === "insurance_revenue" && SORT.dir < 0 && VIEW === "cur";
  rows.forEach((c, i) => {
    const cls = [isF(c) ? "focus" : "", defaultOrder && i > 0 && c.tier !== rows[i - 1].tier ? "tier-break" : ""].join(" ");
    h += "<tr class='" + cls + "'><td class='l'>" + esc(c.name) + (isF(c) ? "<span class='flag'>" + t("focusFlag") + "</span>" : "") + "</td><td class='l'>" + (c.ra === "disaggregated" ? t("raYes") : t("raNo")) + "</td>" +
      COLS.map(([k, kind]) => "<td>" + cellTxt(k, kind, cellVal(c, k, kind)) + "</td>").join("") + "</tr>";
  });
  const aggLab = VIEW === "chg" && LFL ? t("industryAggCommon", { k: M.common_n }) : t("industryAgg");
  h += "<tr><td class='l'><b>" + esc(aggLab) + "</b></td><td class='l'></td>" + COLS.map(([k, kind]) => {
    const a = ind(k, CUR).agg, b = ind(k, CMP).agg, ac = indC(k, CUR).agg, bc = indC(k, CMP).agg;
    const v = VIEW === "cur" ? a : VIEW === "cmp" ? b : (ac == null || bc == null ? null : kind === "growth" ? growth(ac, bc) : ac - bc);
    return "<td><b>" + cellTxt(k, kind, v) + "</b></td>";
  }).join("") + "</tr></tbody>";
  const tb = $("#all"); tb.innerHTML = h;
  if (QTR) $("#s-all .sec-note").innerHTML = t("noteAll") + t("noteAllQ", { k: LFL ? M.common_n : COS.length });
  tb.querySelectorAll("th.sortable").forEach(th => th.addEventListener("click", () => {
    const k = th.dataset.k; SORT = SORT.k === k ? { k, dir: -SORT.dir } : { k, dir: k === "name" ? 1 : -1 }; table();
  }));
}
function downloadCsv() {
  const codes = DATA.metric_defs.map(d => d.code);
  const lines = [["company", "fiscal_year", "ra_policy", ...codes].join(",")];
  COS.forEach(c => DATA.years.forEach(fy => { if (c.y[fy]) lines.push(['"' + c.name + '"', fy, c.ra, ...codes.map(k => g(c, k, fy) ?? "")].join(",")); }));
  const blob = new Blob([lines.join("\n")], { type: "text/csv" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = t("csvName", { cur: CUR });
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- 8 data quality ---------- */
function dataQuality() {
  const defs = DATA.check_defs;
  let total = 0, ok = 0, nAcc = 0, nNa = 0;
  let h = "<thead><tr><th class='l'>" + t("insurer") + "</th>" + DATA.years.map(fy => defs.map(d => "<th title='" + esc(chk(d.id, "label")) + "'>" + esc(chk(d.id, "short")) + "<br>" + esc(fyL(fy)) + "</th>").join("")).join("") + "<th>" + t("dqFlags") + "</th></tr></thead><tbody>";
  COS.forEach(c => {
    h += "<tr class='" + (isF(c) ? "focus" : "") + "'><td class='l'>" + esc(c.name) + "</td>" + DATA.years.map(fy => defs.map(d => {
      const r = ((DATA.checks[c.name] || {})[fy] || {})[d.id];
      if (!r) return "<td>–</td>";
      total++; if (r.ok) ok++;
      if (r.status === "ACCEPTED") { nAcc++; return "<td class='ok' title='" + esc(t("dqAccepted", { v: nf(r.diff, 3), r: r.reason || "" })) + "'>✓*</td>"; }
      if (r.status === "N/A") { nNa++; return "<td title='" + esc(t("dqNa")) + "'>" + t("na") + "</td>"; }
      return "<td class='" + (r.ok ? "ok" : "fail") + "' title='" + esc(t("diff", { v: nf(r.diff, 3) })) + "'>" + (r.ok ? "✓" : "✗") + "</td>";
    }).join("")).join("") + "<td>" + (DATA.flags.filter(f => f.company === c.name).length || "") + "</td></tr>";
  });
  $("#dq").innerHTML = h + "</tbody>";
  $("#dqNote").innerHTML = t(QTR ? "dqNoteQ" : "dqNote", { ok, total, tol: M.tolerance_thb_m, n: COS.length, y: DATA.years.length, c: defs.length }) +
    (nAcc ? t("dqNoteAcc", { a: nAcc }) : "") + (nNa ? t("dqNoteNa", { na: nNa }) : "");
  $("#flags").innerHTML = DATA.flags.map(f => "<li><b>" + esc(f.company) + "</b> " + esc(fyL(f.fiscal_year)) + ": " + esc(flagMsg(f)) + "</li>").join("") || "<li>" + t("none") + "</li>";
}

    DATA.metric_defs.map(d => "<tr><td class='l'>" + esc(groupT(d.group)) + "</td><td class='l'>" + esc(mLabel(d.code)) + "</td><td class='l' style='white-space:normal'>" + esc(mFormula(d.code)) + "</td></tr>").join("") + "</tbody>";

  $("#foot").innerHTML = t("foot", { wb: esc(M.source_ref), gen: esc(M.generated), git: M.git ? t("footGit", { git: esc(M.git) }) : "" });
}

function renderAll() {
  staticText();
  $$(".f-name").forEach(e => e.textContent = F);
  focusSection(); market(); waterfall(); quadrant(); strips(); margins(); bridge(); table(); dataQuality(); method();
}
(function init() {
  const h = new URLSearchParams(location.hash.slice(1));
  const langs = M.languages || ["en"];
  const want = h.get("lang") || store.get("ifrs17-dash-lang");
  if (want && langs.includes(want) && (want === "en" || (DATA.i18n || {})[want])) LANG = want;
  if (h.get("focus") && byName(h.get("focus"))) F = h.get("focus");

})();
