<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thai life insurance industry — IFRS 17 dashboard</title>
<meta name="description" content="TFRS 17 (IFRS 17) figures and indicators for 17 Thai life insurers, FY2025, highlighting Samsung Life.">
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  color-scheme:light;
  --plane:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --hair:rgba(11,11,11,.10);
  --peer:#2a78d6; --focus:#eb6834; --focus-soft:rgba(235,104,52,.13);
  --c1:#2a78d6; --c2:#1baf7a; --c3:#eda100; --c4:#6250d6;
  --pos:#2a78d6; --neg:#e34948; --total:#898781;
  --good:#006300; --bad:#d03b3b; --neutral-mid:#f0efec;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --plane:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --hair:rgba(255,255,255,.10);
  --peer:#3987e5; --focus:#d95926; --focus-soft:rgba(217,89,38,.20);
  --c1:#3987e5; --c2:#199e70; --c3:#c98500; --c4:#9085e9;
  --pos:#3987e5; --neg:#e66767; --total:#898781;
  --good:#0ca30c; --bad:#e66767; --neutral-mid:#383835;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --plane:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --hair:rgba(255,255,255,.10);
  --peer:#3987e5; --focus:#d95926; --focus-soft:rgba(217,89,38,.20);
  --c1:#3987e5; --c2:#199e70; --c3:#c98500; --c4:#9085e9;
  --pos:#3987e5; --neg:#e66767; --total:#898781;
  --good:#0ca30c; --bad:#e66767; --neutral-mid:#383835;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--plane);color:var(--ink);font:400 15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  -webkit-font-smoothing:antialiased;padding:32px 16px 64px}
.wrap{max-width:1180px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-start;justify-content:space-between}
.top-text{flex:1 1 560px;min-width:0}
h1{font-weight:650;font-size:28px;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em;text-wrap:balance}
.lede{color:var(--ink-2);max-width:72ch;margin:0}
.units{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:10px}
.controls{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.lang-pick{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.lang-pick .seg button{text-transform:none;letter-spacing:0}
:lang(ko) body{word-break:keep-all;overflow-wrap:anywhere}
:lang(ko) .units,:lang(ko) .lang-pick,:lang(ko) .focus-pick,:lang(ko) .panel h3,:lang(ko) table.data th{letter-spacing:0}
@media(max-width:620px){.controls{align-items:stretch;width:100%}.lang-pick{justify-content:space-between}}
.focus-pick{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.focus-pick select{font:inherit;font-size:15px;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--surface);
  border:1px solid var(--axis);border-radius:6px;padding:7px 10px;min-width:220px}
nav.toc{display:flex;flex-wrap:wrap;gap:6px 18px;margin:22px 0 0;padding:10px 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);font-size:13px}
nav.toc a{color:var(--ink-2);text-decoration:none}
nav.toc a:hover{color:var(--ink);text-decoration:underline}
section{margin-top:44px;scroll-margin-top:12px}
h2{font-weight:650;font-size:20px;margin:0;letter-spacing:-.005em}
.sec-note{color:var(--ink-2);font-size:14px;max-width:76ch;margin:6px 0 16px}
.panel{background:var(--surface);border:1px solid var(--hair);border-radius:8px;padding:16px}
.panel h3{margin:0;font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.panel .sub{font-size:12px;color:var(--muted);margin:3px 0 10px}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:860px){.panels{grid-template-columns:1fr}}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
.num{font-variant-numeric:tabular-nums}
.legend{display:flex;gap:8px 18px;align-items:center;flex-wrap:wrap;margin:12px 0 0;font-size:13px;color:var(--ink-2)}
.key{display:inline-flex;align-items:center;gap:7px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.sq{width:12px;height:10px;border-radius:2px;display:inline-block}
/* focus summary */
.focus-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:12px}
.focus-name{font-size:22px;font-weight:650}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--hair);color:var(--ink-2);background:var(--surface)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:960px){.tiles{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.tiles{grid-template-columns:1fr}}
.tile{background:var(--surface);border:1px solid var(--hair);border-radius:8px;padding:13px 14px 12px;border-top:3px solid var(--focus)}
.tile .lab{font-size:13px;color:var(--ink-2)}
.tile .val{font-size:26px;font-weight:620;line-height:1.25;margin-top:2px}
.tile .delta{font-size:13px;margin-top:2px}
.tile .ctx{font-size:12px;color:var(--muted);margin-top:4px}
.up-good,.down-good{color:var(--good)} .up-bad,.down-bad{color:var(--bad)} .flat{color:var(--ink-2)}
.headlines{margin:16px 0 0;padding:0 0 0 18px;color:var(--ink);max-width:90ch}
.headlines li{margin:4px 0}
.callouts{margin-top:14px;display:grid;gap:8px}
.callout{font-size:13.5px;color:var(--ink-2);border-left:3px solid var(--axis);padding:4px 0 4px 12px}
.callout b{color:var(--ink)}
/* bar table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--hair);border-radius:8px;background:var(--surface)}
table.data{border-collapse:collapse;width:100%;font-size:13px}
table.data th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:550;text-align:right;
  padding:10px 8px;border-bottom:1px solid var(--axis);white-space:nowrap;vertical-align:bottom}
table.data th.l,table.data td.l{text-align:left}
table.data td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap;font-variant-numeric:tabular-nums}
table.data tr:last-child td{border-bottom:0}
table.data tr.focus td{background:var(--focus-soft)}
table.data tr.focus td.l{font-weight:600}
table.data tr.tier-break td{border-top:2px solid var(--axis)}
table#all th{white-space:normal;line-height:1.3}
table.data th.sortable{cursor:pointer;user-select:none}
table.data th.sortable:hover{color:var(--ink)}
table.data th .arr{display:inline-block;width:10px;color:var(--ink-2)}
.barcell{display:flex;align-items:center;gap:8px;justify-content:flex-end;min-width:200px}
.barcell .track{flex:1;height:10px;position:relative}
.barcell .fill{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--peer);opacity:.75}
tr.focus .barcell .fill{background:var(--focus);opacity:1}
.barcell .v{min-width:56px}
.barcell .s{min-width:44px;color:var(--muted)}
.flag{display:inline-block;font-size:10.5px;padding:0 5px;border-radius:3px;border:1px solid var(--hair);color:var(--ink-2);margin-left:6px;font-weight:400}
.tbl-tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px;font-size:13px;color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--axis);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:var(--surface);color:var(--ink-2);padding:5px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--axis)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
button.dl{font:inherit;font-size:13px;border:1px solid var(--axis);background:var(--surface);color:var(--ink);border-radius:6px;padding:5px 12px;cursor:pointer}
.ok{color:var(--good)} .fail{color:var(--bad);font-weight:700}
.notes{font-size:13.5px;color:var(--ink-2);max-width:82ch}
.notes h4{color:var(--ink);font-size:14px;margin:18px 0 4px}
.notes p{margin:0 0 8px}
details{border-top:1px solid var(--grid);padding:6px 0}
details summary{cursor:pointer;color:var(--ink);font-size:13.5px}
details p{margin:6px 0 4px;font-size:13px;color:var(--ink-2)}
ul.flags{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2)}
footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--hair);font-size:12px;color:var(--muted)}
.tip{position:fixed;pointer-events:none;z-index:9;background:var(--surface);color:var(--ink);border:1px solid var(--hair);border-radius:6px;
  padding:9px 11px;font-size:12.5px;box-shadow:0 6px 22px rgba(0,0,0,.16);opacity:0;transition:opacity .1s;max-width:290px}
.tip b{font-size:13.5px;display:block;margin-bottom:5px}
.tip table{border-collapse:collapse;width:100%}
.tip td{padding:1px 0;font-size:12px;white-space:nowrap}
.tip td:last-child{text-align:right;padding-left:16px;font-variant-numeric:tabular-nums}
@media print{body{padding:0}.controls,nav.toc,.tbl-tools button{display:none}.tile,.panel{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="top-text">
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <div class="units" id="units"></div>
  </div>
  <div class="controls">
    <div class="lang-pick"><span data-t="langLabel"></span>
      <div class="seg" role="group" id="langSeg"></div>
    </div>
    <label class="focus-pick"><span data-t="focusPick"></span>
      <select id="focusSel"></select>
    </label>
  </div>
</header>
<nav class="toc" id="toc"></nav>

<section id="s-focus">
  <div class="focus-head"><span class="focus-name" id="fName"></span><span id="fChips"></span></div>
  <div class="tiles" id="tiles"></div>
  <ul class="headlines" id="headlines"></ul>
  <div class="callouts" id="callouts"></div>
</section>

<section id="s-market">
  <h2 data-t="h2market"></h2>
  <p class="sec-note" data-t="noteMarket"></p>
  <div class="tbl-wrap"><table class="data" id="mkt"></table></div>
</section>

<section id="s-csm">
  <h2 data-t="h2csm"></h2>
  <p class="sec-note" data-t="noteCsm"></p>
  <div class="panel"><h3 data-t="h3wf"></h3><div class="sub" id="wfSub"></div>
    <svg id="wf" viewBox="0 0 900 320" role="img" data-t-aria="ariaWf"></svg>
    <div class="legend">
      <span class="key"><i class="sq" style="background:var(--total)"></i><span data-t="lgOpenClose"></span></span>
      <span class="key"><i class="sq" style="background:var(--pos)"></i><span data-t="lgIncrease"></span></span>
      <span class="key"><i class="sq" style="background:var(--neg)"></i><span data-t="lgDecrease"></span></span>
    </div>
  </div>
  <div class="panel" style="margin-top:20px"><h3 data-t="h3quad"></h3><div class="sub" id="qSub"></div>
    <svg id="quad" viewBox="0 0 900 470" role="img" data-t-aria="ariaQuad"></svg>
    <div class="legend">
      <span class="key"><i class="dot" style="background:var(--focus)"></i><span class="f-name"></span></span>
      <span class="key"><i class="dot" style="background:var(--peer)"></i><span data-t="lgOthers"></span></span>
      <span class="key" style="color:var(--muted)">&#9650;&nbsp;<span data-t="lgCeiling"></span></span>
      <span class="key" style="color:var(--muted)" data-t="lgBubble"></span>
    </div>
  </div>
</section>

<section id="s-nb">
  <h2 data-t="h2nb"></h2>
  <p class="sec-note" data-t="noteNb"></p>
  <div class="panel"><svg id="strips" viewBox="0 0 900 380" role="img" data-t-aria="ariaStrips"></svg>
    <div class="legend">
      <span class="key"><i class="dot" style="background:var(--focus)"></i><span class="f-name"></span> <span class="p-cur"></span></span>
      <span class="key"><i class="dot" style="border:2px solid var(--focus);background:transparent"></i><span class="f-name"></span> <span class="p-cmp"></span></span>
      <span class="key"><i class="dot" style="background:var(--peer);opacity:.6"></i><span data-t="lgOthers"></span></span>
      <span class="key"><i class="sq" style="width:2px;height:12px;background:var(--ink-2)"></i><span data-t="lgMedian"></span></span>
    </div>
  </div>
</section>

<section id="s-ism">
  <h2 data-t="h2ism"></h2>
  <p class="sec-note" data-t="noteIsm"></p>
  <div class="panels">
    <div class="panel"><h3 data-t="h3dis"></h3><div class="sub" id="m1sub"></div><svg id="m1" viewBox="0 0 520 330" role="img" data-t-aria="h3dis"></svg></div>
    <div class="panel"><h3 data-t="h3not"></h3><div class="sub" id="m2sub"></div><svg id="m2" viewBox="0 0 520 330" role="img" data-t-aria="h3not"></svg></div>
  </div>
</section>

<section id="s-bridge">
  <h2 data-t="h2bridge"></h2>
  <p class="sec-note" data-t="noteBridge"></p>
  <div class="panel"><svg id="br" viewBox="0 0 900 640" role="img" data-t-aria="ariaBridge"></svg>
    <div class="legend">
      <span class="key"><i class="sq" style="background:var(--c1)"></i><span data-t="lgIsr"></span></span>
      <span class="key"><i class="sq" style="background:var(--c2)"></i><span data-t="lgInv"></span></span>
      <span class="key"><i class="sq" style="background:var(--c3)"></i><span data-t="lgOther"></span></span>
      <span class="key"><i class="sq" style="background:var(--c4)"></i><span data-t="lgTax"></span></span>
      <span class="key">&#9670;&nbsp;<span data-t="lgNpm"></span></span>
      <span class="key" style="color:var(--muted)">&rsaquo;&rsaquo;&nbsp;<span data-t="lgClipped"></span></span>
    </div>
  </div>
</section>

<section id="s-all">
  <h2 data-t="h2all"></h2>
  <p class="sec-note" data-t="noteAll"></p>
  <div class="tbl-tools">
    <div class="seg" role="group" id="viewSeg"></div>
    <button class="dl" id="dlBtn" type="button" data-t="download"></button>
  </div>
  <div class="tbl-wrap"><table class="data" id="all"></table></div>
</section>

<section id="s-dq">
  <h2 data-t="h2dq"></h2>
  <p class="sec-note" id="dqNote"></p>
  <div class="tbl-wrap"><table class="data" id="dq"></table></div>
  <div class="notes" style="margin-top:16px"><h4 data-t="h4flags"></h4>
    <p data-t="noteFlags"></p>
    <ul class="flags" id="flags"></ul></div>
</section>

<section id="s-method">
  <h2 data-t="h2method"></h2>
  <div class="notes" id="commentary"></div>
  <div class="notes"><h4 data-t="h4defs"></h4></div>
  <div class="tbl-wrap" style="margin-top:8px"><table class="data" id="defs"></table></div>
  <div class="notes" id="extract"></div>
</section>

<footer id="foot"></footer>
</div>

"Southeast Life","sheet_title":"Southeast Life - extracted from 18_FS_SE_4Q2025.pdf (THB million)","header_note":"Annual report: the narrative (p.1-149) has a text layer; the financial statements start at p.149 (title) and are scanned; read locally, pages located by their headings (file page numbers; the statements' own folio + 150 = file page). Thousand Baht. Single set of columns (no subsidiaries). The SCI (p.157) prints the tax expense as a positive figure; it is turned negative. Every note page carries the running header 'สำหรับปีสิ้นสุดวันที่ 31 ธันวาคม 2568', also on the comparative pages: the year is taken from the table's own column header and confirmed by the opening balance (p.221 is 2567, opening CSM 7,141,995). Note 18 (p.238 2568, p.240 2567; columns ordinary / group / annuity / personal accident / total) - the total column is used. CSM roll-forward 14.1.1.2 p.220 (2568) and p.221 (2567); future-service change = change in estimates + experience adjustment (CSM column). New business 14.1.1.3 p.222 (both years): the totals are used; the split between the non-onerous and onerous columns is unusual (2568: 401 and a CSM of 40 in the other column; 2567: the loss of 68,490 shown under the non-onerous column), the totals reconcile. No PAA business. RA release uses note 18 (227,129 / 183,957), equal to the AOC RA. Other expense = other finance costs + other operating expenses.","extraction_note":"Source: 18_FS_SE_4Q2025.pdf (Annual report 2025 including audited financial statements (Thai)), 277 pages, text layer: hybrid (annual report p.1-149 text; financial statements p.150-273 scanned), SHA-256 c6190f99341cce1862ebea6628e5890fdd6c7d2f8fbb5e5514a2a496ecc25b24 (sources/2025FY/registry.csv)."},{"company":"Samsung Life","sheet_title":"Samsung Life - extracted from 06_FS_SAMSUNG_4Q2025.pdf (THB million)","header_note":"Face statement in Baht, notes in thousand Baht. Note 12 has per-product tables plus a total (ทั้งหมด) table: the total is used. RA release comes from note 17.1 (LRC basis), not the AOC current-service RA.","extraction_note":"Source: 06_FS_SAMSUNG_4Q2025.pdf (Audited financial statements FY2025 (Thai)), 183 pages, text layer: yes, SHA-256 2ac2bb380d07c4525d7a6216d8f5d4728284cd309c84c63254f4b5f140384045 (sources/2025FY/registry.csv)."},{"company":"T Life","sheet_title":"T Life - extracted from 20_FS_CAR_TLIFE_4Q2025.pdf (THB million)","header_note":"Scanned; read locally, pages located by their headings (file page numbers). Units differ: the statement of profit or loss (p.39) is in Baht, the notes in thousand Baht. No PAA business, one portfolio (non-participating). Revenue and expenses from 4.2.1 (p.75, both years); CSM roll-forward 4.3.1.2 p.82-83 (2568) and p.84-85 (2567); new business 4.3.1.3 p.86 (both years). Future-service change = change in estimates + experience adjustment (CSM column). CSM interest accretion is negative in FY2025 (5,912), kept as printed; the roll-forward closes. The new-business loss is the printed total of the bottom row of 4.3.1.3 (56,750 / 69,015), which in FY2025 includes 240 in the non-onerous column; it equals the total column of the new-business row in 4.3.1.2. RA release uses 4.2.1 (LRC basis), not the AOC RA (39,084 / 38,949). No income tax in FY2024 ('-'). Other expense = other finance costs + other operating expenses. Pilot difference: FY2024 insurance revenue is 350,874,687 Baht on the face (350.875m); the pilot took 350.874 from the thousand-Baht total of 4.2.1 (350,874). The face figure is used.","extraction_note":"Source: 20_FS_CAR_TLIFE_4Q2025.pdf (Audited financial statements FY2025 with CAR disclosure (Thai)), 147 pages, text layer: no (scanned), SHA-256 6b591be408f4d4af4c3d15dfd912e90e99883ae2e3847fded52e5c2b0070eaf5 (sources/2025FY/registry.csv)."},{"company":"Rabbit Life","sheet_title":"Rabbit Life - extracted from 22_CAR_FS-RBL_4Q2025.pdf (THB million)","header_note":"Hybrid file: the CAR narrative has a text layer, the audited financial statements are scanned; read locally, pages located by their headings (file page numbers; printed note folio + 54 = file page). Units differ: the SCI (p.49) is in Baht, the notes in thousand Baht. No PAA business, no other revenue line. Revenue and expenses from 8.1 (p.94, both years). CSM roll-forward 9.2 p.99 (2568) and p.100 (2567); future-service change = change in estimates + experience adjustment relating to future service (CSM column); accretion = the profit-or-loss part of the insurance finance row (CSM column). New business 9.3 p.101 (both years). RA release uses 8.1 (16,682 / 14,614), not the AOC RA (18,553 / 16,831). FY2024 is a loss year (onerous charge 287,367). Other expense = other finance costs + other operating expenses + other expenses.","extraction_note":"Source: 22_CAR_FS-RBL_4Q2025.pdf (CAR disclosure with audited financial statements FY2025 (Thai)), 157 pages, text layer: hybrid (CAR narrative p.1-48 text; financial statements scanned), SHA-256 dc8de49d6ca46cbfab0ff3e3a641d971bc84c36f2d787b42a423d7a6876e105a (sources/2025FY/registry.csv)."}],"commentary":[{"id":"ra_policy","title":"Risk-adjustment disaggregation limits margin comparisons","companies":[],"body":"An insurer that does not split the change in the risk adjustment between the insurance service result and insurance finance income or expense carries the whole RA change, including the effect of discount-rate movements, in the insurance service result. Service margins are therefore compared only within each policy group. Restating to a common basis would need the P&L/OCI split of the RA finance effect, which the statements do not disclose, so no restated margin is shown. Net profit is not affected by the choice."},{"id":"transition","title":"FY2024 figures are transition comparatives","companies":[],"body":"TFRS 17 took effect on 1 January 2025 with transition on 1 January 2024. FY2024 figures are the restated comparatives in the FY2025 statements, not previously reported results, and the transition approach chosen by each insurer shapes its FY2024 CSM. Year-on-year changes are shown, but a large move can come from transition mechanics rather than from performance."},{"id":"chubb_rabbit","title":"CHUBB and Rabbit Life sit above the replacement scale","companies":["CHUBB Life","Rabbit Life"],"body":"Both took heavy onerous-contract charges in the FY2024 transition comparative, which left a small CSM and a small FY2025 release. A small denominator inflates new business / release, so their position in the quadrant reflects transition mechanics rather than unusually strong new business."},{"id":"t_life_accretion","title":"T Life's CSM interest accretion is negative in FY2025","companies":["T Life"],"body":"Accretion at locked-in rates on a positive CSM should be positive; the likely explanation is that another movement is netted into that row. The roll-forward closes exactly with the row as printed, so it is carried unchanged."},{"id":"rabbit_scale","title":"Ratios to insurance revenue stop being meaningful for Rabbit Life","companies":["Rabbit Life"],"body":"Its investment book is very large relative to a small insurance operation, so the investment result and other expenses run far past the scale of the profit bridge. Its bars are clipped at the axis; the net-profit margin shown is the true figure."},{"id":"release_ratio","title":"Reading the CSM quadrant","companies":[],"body":"A release ratio of roughly 8-13% is the normal run-off pace for a stable book. Far above it, the store is drawn down quickly relative to what remains; far below it, the runway is long. New business below 1.0x the release for more than a year or two is the early warning on future earnings."}],"i18n":{"ko":{"meta":{"title":"태국 생명보험업계 IFRS 17 대시보드","market":"태국 · 생명보험","standard":"TFRS 17 (IFRS 17)","period_end":"2025년 12월 31일 (불기 2568년)","unit":"백만 바트","comparative_caveat":"태국은 TFRS 17을 2025년 1월 1일부터 시행했고 전환일은 2024년 1월 1일이다. 따라서 FY2024 수치는 기존에 보고된 실적이 아니라 재작성된 전환 비교기간 수치다. 전년 대비 변동은 이 점을 감안해 읽어야 한다."},"groups":{"scale":"규모","profitability":"수익성","csm":"CSM","new_business":"신계약"},"metrics":{"insurance_revenue":{"label":"보험수익","formula":"보험수익 합계"},"net_profit":{"label":"당기순이익","formula":"당기순이익"},"csm_close":{"label":"기말 CSM","formula":"기말 보험계약마진(CSM)"},"nb_csm":{"label":"신계약 CSM","formula":"당기에 최초 인식한 계약에서 발생한 CSM"},"nb_pv_premium":{"label":"신계약 PV 보험료","formula":"신계약 미래 현금유입의 현재가치"},"isr_gross":{"label":"보험서비스결과","formula":"보험수익 + 보험서비스비용"},"ism_gross":{"label":"보험서비스이익률","formula":"(보험수익 + 보험서비스비용) ÷ 보험수익"},"ism_net":{"label":"재보험 후 보험서비스이익률","formula":"(보험서비스결과 + 재보험손익) ÷ 보험수익"},"inv_margin":{"label":"투자손익(보험금융비용 차감 후)","formula":"(순투자수익 + 순보험금융비용) ÷ 보험수익"},"other_ratio":{"label":"기타비용(순)","formula":"(기타비용 + 기타수익) ÷ 보험수익"},"tax_ratio":{"label":"법인세","formula":"법인세 ÷ 보험수익"},"npm":{"label":"순이익률","formula":"당기순이익 ÷ 보험수익"},"current_loss_ratio":{"label":"당기 서비스 손해율","formula":"−(발생사고 + 과거서비스 관련 변동) ÷ (BEL 해제 + RA 해제 + PAA 보험수익 + 기타 보험수익 + 보험취득현금흐름 회수)"},"csm_release_share":{"label":"보험수익 중 CSM 상각 비중","formula":"CSM 상각 ÷ 보험수익"},"csm_growth":{"label":"CSM 증가율","formula":"기말 CSM ÷ 기초 CSM − 1"},"release_ratio":{"label":"CSM 상각률","formula":"CSM 상각 ÷ (기초 CSM + 신계약 + 이자부리 + 미래서비스 관련 변동)"},"nb_to_release":{"label":"신계약 CSM ÷ 상각","formula":"신계약 CSM ÷ CSM 상각"},"nb_csm_margin":{"label":"신계약 CSM 마진율","formula":"신계약 CSM ÷ 신계약 PV 보험료"},"acq_cost_ratio":{"label":"신계약비율","formula":"신계약 PV 보험취득현금흐름 ÷ 신계약 PV 보험료"},"nb_claims_ratio":{"label":"신계약 보험금·급부 비율","formula":"신계약 PV 보험금 유출 ÷ 신계약 PV 보험료"},"onerous_ratio":{"label":"신계약 손실부담 비율","formula":"신계약 손실요소 ÷ 신계약 CSM"},"rev_share":{"label":"보험수익 점유율","formula":"회사 보험수익 ÷ 대상 보험사 전체 합계"},"csm_share":{"label":"기말 CSM 점유율","formula":"회사 기말 CSM ÷ 대상 보험사 전체 합계"},"nb_csm_share":{"label":"신계약 CSM 점유율","formula":"회사 신계약 CSM ÷ 대상 보험사 전체 합계"}},"checks":{"revenue_split":{"label":"보험수익 구성 합계 = 보험수익 총액","short":"수익"},"expense_split":{"label":"비용 구성 합계 = 보험서비스비용 총액","short":"비용"},"net_profit":{"label":"순이익 브리지 = 공시 당기순이익","short":"순이익"},"csm_rollforward":{"label":"CSM 변동표 = 기말 CSM","short":"CSM 변동"},"nb_csm":{"label":"신계약: PV 유입 − 취득비용 − 보험금 − RA + 손실요소 = CSM","short":"신계약 CSM"},"nb_consistency":{"label":"CSM 변동표의 신계약 = 신계약 주석","short":"신계약 일치"}},"commentary":{"ra_policy":{"title":"위험조정(RA) 분리 여부에 따라 이익률 비교가 제한된다","body":"위험조정 변동을 보험서비스결과와 보험금융손익으로 나누지 않는 보험사는 할인율 변동 효과를 포함한 RA 변동 전체를 보험서비스결과에 반영한다. 그래서 보험서비스이익률은 같은 정책 그룹 안에서만 비교한다. 공통 기준으로 재계산하려면 RA 금융효과의 당기손익/기타포괄손익 구분이 필요한데 재무제표에 공시되지 않으므로, 재계산한 이익률은 보여 주지 않는다. 당기순이익은 이 선택의 영향을 받지 않는다."},"transition":{"title":"FY2024 수치는 전환 비교기간 수치다","body":"TFRS 17은 2025년 1월 1일 시행, 전환일은 2024년 1월 1일이다. FY2024 수치는 FY2025 재무제표에 재작성되어 실린 비교기간 수치이며, 보험사별로 선택한 전환 방법이 FY2024 CSM에 영향을 준다. 전년 대비 변동을 표시하지만, 큰 변동은 실적보다 전환 방식에서 비롯될 수 있다."},"chubb_rabbit":{"title":"CHUBB와 Rabbit Life는 신계약 대체 배수 눈금 밖에 있다","body":"두 회사 모두 FY2024 전환 비교기간에 손실부담계약 비용을 크게 인식해 CSM과 FY2025 상각액이 작다. 분모가 작아 신계약 CSM ÷ 상각 배수가 부풀려지므로, 사분면에서의 위치는 신계약이 특별히 강해서가 아니라 전환 방식의 결과로 읽어야 한다."},"t_life_accretion":{"title":"T Life의 FY2025 CSM 이자부리는 음수다","body":"양(+)의 CSM에 최초 인식 시점 이율로 부리하는 이자는 양수여야 한다. 다른 변동이 해당 행에 상계되어 있을 가능성이 크다. 공시된 그대로 CSM 변동표가 정확히 맞으므로 수정하지 않고 반영했다."},"rabbit_scale":{"title":"Rabbit Life는 보험수익 대비 비율의 의미가 약하다","body":"보험 영업 규모에 비해 투자 자산이 매우 커서, 투자손익과 기타비용이 이익 브리지 눈금을 크게 벗어난다. 막대는 축에서 잘라 표시했고, 순이익률은 실제 값이다."},"release_ratio":{"title":"CSM 사분면 읽는 법","body":"CSM 상각률이 대략 8~13%이면 안정적인 보유계약의 일반적인 상각 속도다. 그보다 훨씬 높으면 남은 CSM 대비 빠르게 소진되는 것이고, 훨씬 낮으면 이익 실현 기간이 길다는 뜻이다. 신계약 CSM이 상각액의 1.0배에 못 미치는 상태가 1~2년 넘게 이어지면 미래 이익에 대한 조기 경고 신호다."}},"notes_language_label":"추출 메모는 추출 규격에 기록한 영문 원문 그대로 표시한다."}}}</script>

function showTip(ev, html) {
  tip.innerHTML = html; tip.style.opacity = 1;
  const w = tip.offsetWidth || 260, h = tip.offsetHeight || 120;
  let x = ev.clientX + 16, y = ev.clientY - 20;
  if (x + w > innerWidth - 10) x = ev.clientX - w - 16;
  if (y + h > innerHeight - 10) y = innerHeight - h - 10;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
}
const hideTip = () => tip.style.opacity = 0;
const tipTable = (title, rows) => "<b>" + esc(title) + "</b><table>" + rows.map(r => "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td></tr>").join("") + "</table>";

    [t("tipCsm"), fM(raw(c, "csm_close"))], [t("tipIsm"), fP(g(c, "ism_gross"))],
    [t("tipRel"), fP(g(c, "release_ratio"))], [t("tipNbr"), fX(g(c, "nb_to_release"))],
    [t("tipNbm"), fP(g(c, "nb_csm_margin"))], [t("tipNpm"), fP(g(c, "npm"))],
    [t("tipRa"), raLabel(c)], ...extra]);
}

}
function niceTicks(lo, hi, n = 5) {
  const span = hi - lo, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => span / s <= n) || 10 * mag;
  const out = []; for (let x = Math.ceil(lo / step - 1e-9) * step; x <= hi + 1e-9; x += step) out.push(+x.toFixed(10));
  return { ticks: out, step };
}

function deltaHtml(kind, cur, prev, better) {
  if (cur == null || prev == null) return '<span class="flat">' + t("noCmp") + "</span>";
  let d, txt;
  if (kind === "growth") { d = growth(cur, prev); if (d == null) return '<span class="flat">' + t("nmBase", { cmp: CMP }) + "</span>"; txt = (d >= 0 ? "+" : "") + nf(d * 100, 1) + "%"; }
  else if (kind === "pp") { d = cur - prev; txt = (d >= 0 ? "+" : "") + nf(d * 100, 1) + " " + t("pp"); }
  else { d = cur - prev; txt = (d >= 0 ? "+" : "") + nf(d, 2) + "×"; }
  const dir = Math.abs(d) < 1e-9 ? "flat" : d > 0 ? "up" : "down";
  const cls = dir === "flat" || better == null ? "flat" : ((dir === "up") === better ? dir + "-good" : dir + "-bad");
  const arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "◆";
  return '<span class="' + cls + '">' + arrow + " " + txt + '</span> <span class="flat">' + t("vs", { cmp: CMP }) + "</span>";
}

/* ---------- 3b quadrant ---------- */

  const pts = COS.map(c => ({ c, x: px(g(c, "release_ratio") * 100), y: py(g(c, "nb_to_release")), rad: rad(raw(c, "csm_close")), over: g(c, "nb_to_release") > CAP, txt: c.short }))
    .sort((a, b) => (isF(b.c) - isF(a.c)) || (b.rad - a.rad));
  const boxes = [], LH = 13;
  const overlap = (a, b) => !(a.x2 < b.x1 || b.x2 < a.x1 || a.y2 < b.y1 || b.y2 < a.y1);
  pts.forEach(p => {
    const w = p.txt.length * (isF(p.c) ? 7 : 6.2), h = p.over ? LH + 11 : LH;
    let best = null;
    for (const side of [1, -1]) for (const dy of [0, -14, 14, -28, 28, -42, 42, -56, 56]) {
      const lx = p.x + side * (p.rad + 6), ly = p.y + 4 + dy;

      if (!hitL && !hitB) { best = { side, dy, lx, ly, box }; break; }
      if (!best && !hitL) best = { side, dy, lx, ly, box };

    if (!best) { const lx = p.x + p.rad + 6; best = { side: 1, dy: 0, lx, ly: p.y + 4, box: { x1: lx, x2: lx + w, y1: p.y - 7, y2: p.y + 7 } }; }

    if (p.over) gg.appendChild(el("path", { d: "M" + (p.x - 6) + "," + (p.y - p.rad - 4) + " L" + (p.x + 6) + "," + (p.y - p.rad - 4) + " L" + p.x + "," + (p.y - p.rad - 13) + " Z", fill: c }));
    gg.appendChild(el("text", { x: p.lx, y: p.ly, "text-anchor": p.side > 0 ? "start" : "end", fill: "var(--ink)", "font-size": isF(p.c) ? 13 : 11.5, "font-weight": isF(p.c) ? 650 : 400 }, p.txt));
    if (p.over) gg.appendChild(el("text", { x: p.lx, y: p.ly + 12, "text-anchor": p.side > 0 ? "start" : "end", fill: "var(--muted)", "font-size": 10.5 }, fX(g(p.c, "nb_to_release"), 1)));
    const hit = el("circle", { cx: p.x, cy: p.y, r: Math.max(p.rad, 12), fill: "transparent" });

      gg.appendChild(el("rect", { x: x1 + 1, y: y - h / 2, width: w, height: h, fill: col, rx: 2 }));
    });
    gg.appendChild(el("text", { x: L - 12, y: y + 4, "text-anchor": "end", "font-size": 12.5, fill: "var(--ink)", "font-weight": isF(c) ? 650 : 400 }, c.name));
    const mx = px(g(c, "npm") * 100), m = 6.5;
    gg.appendChild(el("path", { d: "M" + mx + "," + (y - m) + " L" + (mx + m) + "," + y + " L" + mx + "," + (y + m) + " L" + (mx - m) + "," + y + " Z", fill: "var(--ink)", stroke: "var(--surface)", "stroke-width": 2 }));
    gg.appendChild(el("text", { x: W - R + 24, y: y + 4, fill: "var(--ink-2)", "font-size": 11.5 }, fP(g(c, "npm"))));
    if (clipped) gg.appendChild(el("text", { x: W - R + 4, y: y + 4, fill: "var(--ink-2)", "font-size": 13, "font-weight": 700 }, "››"));
    const hit = el("rect", { x: 0, y: y - step / 2, width: W, height: step, fill: "transparent" }); hover(hit, tipHtml); gg.appendChild(hit);
    svg.appendChild(gg);
  });
}

/* ---------- 7 table ---------- */
const COLS = [
  ["insurance_revenue", "growth"], ["net_profit", "growth"], ["ism_gross", "pp"], ["npm", "pp"], ["csm_close", "growth"], ["csm_growth", "pp"],
  ["release_ratio", "pp"], ["nb_to_release", "x"], ["nb_csm", "growth"], ["nb_csm_margin", "pp"], ["acq_cost_ratio", "pp"], ["onerous_ratio", "pp"]];
let VIEW = "cur", SORT = { k: "insurance_revenue", dir: -1 };
function cellVal(c, k, kind) {
  if (VIEW === "cur") return g(c, k);
  if (VIEW === "cmp") return g(c, k, CMP);
  const a = g(c, k), b = g(c, k, CMP);
  if (a == null || b == null) return null;
  return kind === "growth" ? growth(a, b) : a - b;
}
function cellTxt(k, kind, v) {
  if (v == null) return t("nm");
  if (VIEW !== "chg") return fmtU(DEF[k].unit, v);
  if (kind === "growth") return (v >= 0 ? "+" : "") + nf(v * 100, 1) + "%";
  if (kind === "pp") return (v >= 0 ? "+" : "") + nf(v * 100, 1) + " " + t("pp");
  return (v >= 0 ? "+" : "") + nf(v, 2) + "×";
}
function table() {
  const seg = $("#viewSeg");
  if (!seg.childElementCount) {
    ["cur", "cmp", "chg"].forEach(id => {
      const b = document.createElement("button"); b.type = "button"; b.dataset.v = id;
      b.addEventListener("click", () => { VIEW = id; table(); }); seg.appendChild(b);
    });
    $("#dlBtn").addEventListener("click", downloadCsv);
  }
  seg.setAttribute("aria-label", t("tableView"));
  seg.querySelectorAll("button").forEach(b => { b.textContent = b.dataset.v === "cur" ? CUR : b.dataset.v === "cmp" ? CMP : t("viewChange"); b.setAttribute("aria-pressed", b.dataset.v === VIEW); });
  const rows = COS.slice().sort((a, b) => {
    if (SORT.k === "name") return SORT.dir * a.name.localeCompare(b.name);
    const kind = (COLS.find(x => x[0] === SORT.k) || [])[1];
    const va = cellVal(a, SORT.k, kind), vb = cellVal(b, SORT.k, kind);
    return (va == null) - (vb == null) || SORT.dir * ((va ?? 0) - (vb ?? 0));
  });
  const arr = k => SORT.k === k ? (SORT.dir < 0 ? "▼" : "▲") : "";
  let h = "<thead><tr><th class='l sortable' data-k='name'>" + t("insurer") + " <span class='arr'>" + arr("name") + "</span></th><th class='l' title='" + esc(t("raSplitTitle")) + "'>" + t("raSplit") + "</th>" +
    COLS.map(([k]) => "<th class='sortable' data-k='" + k + "' title='" + esc(mFormula(k)) + "'>" + esc(t("cols")[k]) + " <span class='arr'>" + arr(k) + "</span></th>").join("") + "</tr></thead><tbody>";
  const defaultOrder = SORT.k === "insurance_revenue" && SORT.dir < 0 && VIEW === "cur";
  rows.forEach((c, i) => {
    const cls = [isF(c) ? "focus" : "", defaultOrder && i > 0 && c.tier !== rows[i - 1].tier ? "tier-break" : ""].join(" ");
    h += "<tr class='" + cls + "'><td class='l'>" + esc(c.name) + (isF(c) ? "<span class='flag'>" + t("focusFlag") + "</span>" : "") + "</td><td class='l'>" + (c.ra === "disaggregated" ? t("raYes") : t("raNo")) + "</td>" +
      COLS.map(([k, kind]) => "<td>" + cellTxt(k, kind, cellVal(c, k, kind)) + "</td>").join("") + "</tr>";
  });
  h += "<tr><td class='l'><b>" + t("industryAgg") + "</b></td><td class='l'></td>" + COLS.map(([k, kind]) => {
    const a = ind(k, CUR).agg, b = ind(k, CMP).agg;
    const v = VIEW === "cur" ? a : VIEW === "cmp" ? b : (a == null || b == null ? null : kind === "growth" ? growth(a, b) : a - b);
    return "<td><b>" + cellTxt(k, kind, v) + "</b></td>";
  }).join("") + "</tr></tbody>";
  const tb = $("#all"); tb.innerHTML = h;
  tb.querySelectorAll("th.sortable").forEach(th => th.addEventListener("click", () => {
    const k = th.dataset.k; SORT = SORT.k === k ? { k, dir: -SORT.dir } : { k, dir: k === "name" ? 1 : -1 }; table();
  }));
}
function downloadCsv() {
  const codes = DATA.metric_defs.map(d => d.code);
  const lines = [["company", "fiscal_year", "ra_policy", ...codes].join(",")];
  COS.forEach(c => DATA.years.forEach(fy => { if (c.y[fy]) lines.push(['"' + c.name + '"', fy, c.ra, ...codes.map(k => g(c, k, fy) ?? "")].join(",")); }));
  const blob = new Blob([lines.join("\n")], { type: "text/csv" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = t("csvName", { cur: CUR });
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- 8 data quality ---------- */
function dataQuality() {
  const defs = DATA.check_defs;
  let total = 0, ok = 0;
  let h = "<thead><tr><th class='l'>" + t("insurer") + "</th>" + DATA.years.map(fy => defs.map(d => "<th title='" + esc(chk(d.id, "label")) + "'>" + esc(chk(d.id, "short")) + "<br>" + fy + "</th>").join("")).join("") + "<th>" + t("dqFlags") + "</th></tr></thead><tbody>";
  COS.forEach(c => {
    h += "<tr class='" + (isF(c) ? "focus" : "") + "'><td class='l'>" + esc(c.name) + "</td>" + DATA.years.map(fy => defs.map(d => {
      const r = ((DATA.checks[c.name] || {})[fy] || {})[d.id]; total++; if (r && r.ok) ok++;
      return r ? "<td class='" + (r.ok ? "ok" : "fail") + "' title='" + esc(t("diff", { v: nf(r.diff, 3) })) + "'>" + (r.ok ? "✓" : "✗") + "</td>" : "<td>–</td>";
    }).join("")).join("") + "<td>" + (DATA.flags.filter(f => f.company === c.name).length || "") + "</td></tr>";
  });
  $("#dq").innerHTML = h + "</tbody>";
  $("#dqNote").innerHTML = t("dqNote", { ok, total, tol: M.tolerance_thb_m, n: COS.length, y: DATA.years.length, c: defs.length });
  $("#flags").innerHTML = DATA.flags.map(f => "<li><b>" + esc(f.company) + "</b> " + f.fiscal_year + ": " + esc(flagMsg(f)) + "</li>").join("") || "<li>" + t("none") + "</li>";
}

/* ---------- 9 method ---------- */
function method() {
  $("#commentary").innerHTML = "<h4>" + t("h4comp") + "</h4><p><b>" + t("compYear") + ".</b> " + esc(metaT("comparative_caveat")) + "</p>" +
    DATA.commentary.filter(x => x.id !== "transition").map(x => "<p><b>" + esc(noteT(x, "title")) + ".</b> " + esc(noteT(x, "body")) + "</p>").join("");
  $("#defs").innerHTML = "<thead><tr><th class='l'>" + t("defArea") + "</th><th class='l'>" + t("defInd") + "</th><th class='l'>" + t("defDef") + "</th></tr></thead><tbody>" +
    DATA.metric_defs.map(d => "<tr><td class='l'>" + esc(groupT(d.group)) + "</td><td class='l'>" + esc(mLabel(d.code)) + "</td><td class='l' style='white-space:normal'>" + esc(mFormula(d.code)) + "</td></tr>").join("") + "</tbody>";
  const tr = TR(), ex = $("#extract");
  ex.innerHTML = "<h4>" + t("h4extract") + "</h4>" + (tr && tr.notes_language_label ? "<p>" + esc(tr.notes_language_label) + "</p>" : "");
  COS.forEach(c => {
    const n = DATA.company_notes.find(x => x.company === c.name) || {};
    const d = document.createElement("details");
    d.innerHTML = "<summary>" + esc(c.name) + " — " + esc(c.units) + "</summary><p lang='en'>" + esc(n.header_note || "") + "</p><p lang='en'>" + esc(n.extraction_note || "") + "</p>";
    ex.appendChild(d);
  });
  $("#foot").innerHTML = t("foot", { wb: esc(M.source_ref), gen: esc(M.generated), git: M.git ? t("footGit", { git: esc(M.git) }) : "" });
}

function renderAll() {
  staticText();
  $$(".f-name").forEach(e => e.textContent = F);
  focusSection(); market(); waterfall(); quadrant(); strips(); margins(); bridge(); table(); dataQuality(); method();
}
(function init() {
  const h = new URLSearchParams(location.hash.slice(1));
  const langs = M.languages || ["en"];
  const want = h.get("lang") || store.get("ifrs17-dash-lang");
  if (want && langs.includes(want) && (want === "en" || (DATA.i18n || {})[want])) LANG = want;
  if (h.get("focus") && byName(h.get("focus"))) F = h.get("focus");
  controls(); renderAll();
})();
</script>
